  <text x="470.0" y="67.96" text-anchor="middle" font-size="11" fill="currentColor">I/O ports</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="currentColor" opacity=".65">separate spaces, IN / OUT</text>
  <text x="400" y="204" text-anchor="middle" font-size="10" fill="currentColor" opacity=".65">and an IO/M̄ signal</text>
</svg>
