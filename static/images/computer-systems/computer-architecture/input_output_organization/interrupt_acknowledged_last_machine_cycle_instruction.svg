  <polyline points="460,20 460,41" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arr-ack-g)"/>
  <polyline points="140,92 140,73" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arr-ack-r)"/>
