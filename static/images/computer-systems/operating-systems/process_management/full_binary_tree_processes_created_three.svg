<svg font-family="Merriweather, Georgia, serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" role="img" aria-label="Full binary tree of processes created by three fork calls in a loop, with the parent of each process">
  <g fill="currentColor" font-size="12">
