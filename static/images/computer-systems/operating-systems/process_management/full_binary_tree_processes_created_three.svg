    <text x="249" y="105">P0</text>
    <text x="513" y="105">P1</text>
    <text x="183" y="175">P0</text>
    <text x="315" y="175">P2</text>
    <text x="447" y="175">P1</text>
    <text x="579" y="175">P3</text>
