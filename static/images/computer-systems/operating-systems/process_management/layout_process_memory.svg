  <text x="282" y="232" text-anchor="start" font-size="11" fill="currentColor" opacity=".65">global variables</text>
  <text x="282" y="266" text-anchor="start" font-size="11" fill="currentColor" opacity=".65">program code</text>
  <text x="195.0" y="135" text-anchor="middle" font-size="11" fill="currentColor" font-style="italic" opacity=".65">free</text>
