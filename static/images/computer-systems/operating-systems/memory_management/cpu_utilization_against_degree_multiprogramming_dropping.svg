  <line x1="60" y1="200" x2="60" y2="14" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr-thr)"/>
  <line x1="60" y1="200" x2="428" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr-thr)"/>
