<svg font-family="Merriweather, Georgia, serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" role="img" aria-label="Major tasks of a molecular dynamics application">
  <defs><marker id="arr-mdtasks" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker><marker id="arr-mdtaskss" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="currentColor"/></marker></defs>
  <rect x="315" y="10" width="140" height="30" rx="0" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="385.0" y="29.2" text-anchor="middle" font-size="12" fill="currentColor">Neighbor list</text>
  <rect x="40" y="90" width="190" height="40" rx="0" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="135.0" y="106.975" text-anchor="middle" font-size="11" fill="currentColor">Vibrational and</text>
