  <text x="260.0" y="194.85" text-anchor="middle" font-size="11" fill="currentColor">Update atomic positions and velocities</text>
  <rect x="190" y="236" width="140" height="28" rx="0" stroke="currentColor" stroke-width="1.5" fill="none"/>
