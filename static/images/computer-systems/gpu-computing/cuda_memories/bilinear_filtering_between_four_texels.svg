<svg font-family="Merriweather, Georgia, serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" role="img" aria-label="Bilinear filtering between four texels">
  <defs><marker id="arr-bilinear" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker><marker id="arr-bilinears" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="currentColor"/></marker></defs>
  <circle cx="80" cy="40" r="7" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.5"/>
  <text x="66" y="28" text-anchor="end" font-size="12" fill="currentColor">T<tspan baseline-shift="sub" font-size="75%">00</tspan></text>
  <circle cx="240" cy="40" r="7" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.5"/>
  <text x="254" y="28" text-anchor="start" font-size="12" fill="currentColor">T<tspan baseline-shift="sub" font-size="75%">10</tspan></text>
  <circle cx="80" cy="200" r="7" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.5"/>
  <text x="66" y="222" text-anchor="end" font-size="12" fill="currentColor">T<tspan baseline-shift="sub" font-size="75%">01</tspan></text>
  <circle cx="240" cy="200" r="7" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.5"/>
  <text x="254" y="222" text-anchor="start" font-size="12" fill="currentColor">T<tspan baseline-shift="sub" font-size="75%">11</tspan></text>
  <rect x="80" y="40" width="160" height="160" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity=".65"/>
  <circle cx="136.0" cy="136.0" r="5" stroke="none" fill="currentColor" fill-opacity="1"/>
  <text x="146.0" y="128.0" text-anchor="start" font-size="12" fill="currentColor">(u, v)</text>
  <polyline points="80,226 136.0,226" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr-bilinear)" marker-start="url(#arr-bilinears)"/>
  <text x="108.0" y="244" text-anchor="middle" font-size="13" fill="currentColor" font-style="italic">α</text>
  <polyline points="270,40 270,136.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr-bilinear)" marker-start="url(#arr-bilinears)"/>
  <text x="280" y="92.0" text-anchor="start" font-size="13" fill="currentColor" font-style="italic">β</text>
  <polyline points="136.0,40 136.0,200" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" opacity=".65"/>
  <polyline points="80,136.0 240,136.0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" opacity=".65"/>
  <text x="300" y="70" text-anchor="start" font-size="11" fill="currentColor">x_B = u − 0.5,  i = ⌊x_B⌋,  α = x_B − i</text>
  <text x="300" y="92" text-anchor="start" font-size="11" fill="currentColor">y_B = v − 0.5,  j = ⌊y_B⌋,  β = y_B − j</text>
  <text x="300" y="130" text-anchor="start" font-size="11" fill="currentColor">result = (1−α)(1−β)T<tspan baseline-shift="sub" font-size="75%">00</tspan> + α(1−β)T<tspan baseline-shift="sub" font-size="75%">10</tspan></text>
  <text x="300" y="152" text-anchor="start" font-size="11" fill="currentColor">          + (1−α)β T<tspan baseline-shift="sub" font-size="75%">01</tspan> + αβ T<tspan baseline-shift="sub" font-size="75%">11</tspan></text>
</svg>
