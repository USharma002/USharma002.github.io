<svg font-family="Merriweather, Georgia, serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 194" width="360" role="img" aria-label="B. With prefetching">
  <defs><marker id="arr-pf1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker><marker id="arr-pf1s" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="currentColor"/></marker></defs>
  <rect x="5" y="5" width="350" height="166" rx="0" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="14" y="26" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">Load first tile from global memory into registers</text>
  <text x="14" y="44" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">Loop {</text>
  <text x="14" y="62" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">    Deposit tile from registers to shared memory</text>
  <text x="14" y="80" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">    __syncthreads()</text>
  <text x="14" y="98" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">    Load next tile from global memory into registers</text>
  <text x="14" y="116" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">    Compute current tile</text>
  <text x="14" y="134" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">    __syncthreads()</text>
  <text x="14" y="152" text-anchor="start" font-size="10.5" fill="currentColor" font-family="Source Code Pro, monospace">}</text>
  <text x="180" y="189" text-anchor="middle" font-size="11" fill="currentColor">B. With prefetching</text>
</svg>
