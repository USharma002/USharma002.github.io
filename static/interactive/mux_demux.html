<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplexer and Demultiplexer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
    :root {
        --text: #374151;
        --muted: #9ca3af;
        --border: #d1d5db;
        --one: #2563eb;
    }
    /* Minimal, diagram-like: blog fonts, thin lines, transparent background */
    body { margin: 0; padding: 4px 2px; font-family: 'Merriweather', Georgia, serif; font-weight: 300; font-size: 14px; background: transparent; color: var(--text); }
    .wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 40px; }
    .panel { flex: 1 1 300px; max-width: 420px; }
    .caption { text-align: center; font-style: italic; font-size: 13px; color: var(--muted); margin-top: 2px; }
    svg { width: 100%; height: auto; display: block; }
    text { fill: var(--text); font-family: 'Merriweather', Georgia, serif; font-size: 14px; }
    .wire { fill: none; stroke: var(--muted); stroke-width: 1.3; transition: stroke .2s, stroke-width .2s; }
    .wire.v1 { stroke: var(--one); stroke-width: 2.6; }
    .wire.path { stroke-dasharray: none; }
    .wire.dim { opacity: .35; }
    .body { fill: none; stroke: var(--text); stroke-width: 1.5; }
    .route { fill: none; stroke: var(--text); stroke-width: 1.2; stroke-dasharray: 4 3; opacity: .8; }
    .tog { cursor: pointer; }
    .tog rect { fill: transparent; stroke: var(--border); stroke-width: 1; rx: 3; transition: stroke .2s; }
    .tog:hover rect { stroke: var(--text); }
    .tog text { font-family: 'Source Code Pro', monospace; font-size: 13px; text-anchor: middle; }
    .tog.on rect { stroke: var(--text); }
    .tog.on text { font-weight: 600; }
    .lbl { font-style: italic; }
    .eq { text-align: center; font-size: 13px; margin-top: 6px; min-height: 1.4em; }
    .eq b { font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
    <div class="panel">
        <svg id="mux" viewBox="0 0 360 268" aria-label="Interactive 4 to 1 multiplexer"></svg>
        <div class="eq" id="mux-eq"></div>
        <div class="caption">4 : 1 multiplexer. Click the inputs and the select lines.</div>
    </div>
    <div class="panel">
        <svg id="demux" viewBox="0 0 360 268" aria-label="Interactive 1 to 4 demultiplexer"></svg>
        <div class="eq" id="demux-eq"></div>
        <div class="caption">1 : 4 demultiplexer (a decoder whose enable is the data input).</div>
    </div>
</div>
<script>
    // --- Theme Detection (matches the other interactive pages) ---
    function detectTheme() {
        try {
            if (window.parent === window) throw 0;  // standalone: keep the light defaults
            const bg = getComputedStyle(window.parent.document.body).backgroundColor;
            document.documentElement.style.background = bg;  // match the page, or the browser paints the iframe white
            const rgb = bg.match(/\d+/g);
            if (!rgb) return;
            const dark = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 128;
            const set = (k, v) => document.documentElement.style.setProperty(k, v);
            set('--text', dark ? '#e4e4e4' : '#374151');
            set('--muted', dark ? '#737373' : '#9ca3af');
            set('--border', dark ? '#525252' : '#d1d5db');
            set('--one', dark ? '#60a5fa' : '#2563eb');
        } catch (e) { /* standalone */ }
    }
    setInterval(detectTheme, 1000);
    detectTheme();

    const NS = 'http://www.w3.org/2000/svg';
    const SUB = '₀₁₂₃';
    function el(parent, tag, attrs, text) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text !== undefined) e.textContent = text;
        parent.appendChild(e);
        return e;
    }
    function toggle(parent, x, y, onClick) {
        const g = el(parent, 'g', { class: 'tog', transform: `translate(${x - 13},${y - 11})` });
        el(g, 'rect', { width: 26, height: 22 });
        const t = el(g, 'text', { x: 13, y: 16 }, '0');
        g.addEventListener('click', onClick);
        return { set(v) { t.textContent = v; g.classList.toggle('on', v === 1); } };
    }

    // ---- 4:1 multiplexer ----
    const mux = { I: [0, 1, 1, 0], s1: 0, s0: 0 };
    const M = document.getElementById('mux');
    const mIn = [], mTog = [];
    for (let k = 0; k < 4; k++) {
        const y = 50 + k * 40;
        el(M, 'text', { x: 20, y: y + 5, class: 'lbl' }, `I${SUB[k]}`);
        mTog.push(toggle(M, 58, y, () => { mux.I[k] ^= 1; drawMux(); }));
        mIn.push(el(M, 'polyline', { class: 'wire', points: `71,${y} 150,${y}` }));
    }
    el(M, 'polygon', { class: 'body', points: '150,20 240,55 240,195 150,230' });
    el(M, 'text', { x: 195, y: 130, 'text-anchor': 'middle' }, '4 : 1');
    const mRoute = el(M, 'polyline', { class: 'route', points: '' });
    const mOut = el(M, 'polyline', { class: 'wire', points: '240,125 300,125' });
    el(M, 'text', { x: 310, y: 130, class: 'lbl' }, 'y');
    const mY = el(M, 'text', { x: 270, y: 117, 'text-anchor': 'middle', 'font-weight': 700 }, '0');
    const mSel = [];
    [['s₁', 168], ['s₀', 218]].forEach(([lab, x], k) => {
        const yEdge = 230 - (x - 150) * 35 / 90;
        el(M, 'polyline', { class: 'wire', points: `${x},${yEdge} ${x},222` });
        mSel.push(toggle(M, x, 234, () => { if (k === 0) mux.s1 ^= 1; else mux.s0 ^= 1; drawMux(); }));
        el(M, 'text', { x, y: 262, class: 'lbl', 'font-size': 12, 'text-anchor': 'middle' }, lab);
    });

    function drawMux() {
        const sel = mux.s1 * 2 + mux.s0, y = mux.I[sel];
        mux.I.forEach((v, k) => {
            mTog[k].set(v);
            mIn[k].classList.toggle('v1', v === 1);
            mIn[k].classList.toggle('dim', k !== sel);
        });
        mSel[0].set(mux.s1); mSel[1].set(mux.s0);
        mRoute.setAttribute('points', `150,${50 + sel * 40} 240,125`);
        mOut.classList.toggle('v1', y === 1);
        mY.textContent = y;
        const terms = ['s̄₁s̄₀I₀', 's̄₁s₀I₁', 's₁s̄₀I₂', 's₁s₀I₃'].map((t, k) => k === sel ? `<b>${t}</b>` : t);
        document.getElementById('mux-eq').innerHTML = `<i>y</i> = ${terms.join(' + ')} = I${SUB[sel]} = ${y}`;
    }

    // ---- 1:4 demultiplexer ----
    const dem = { D: 1, s1: 0, s0: 0 };
    const X = document.getElementById('demux');
    el(X, 'text', { x: 20, y: 130, class: 'lbl' }, 'D');
    const dTog = toggle(X, 58, 125, () => { dem.D ^= 1; drawDemux(); });
    const dIn = el(X, 'polyline', { class: 'wire', points: '71,125 120,125' });
    el(X, 'polygon', { class: 'body', points: '120,55 210,20 210,230 120,195' });
    el(X, 'text', { x: 165, y: 130, 'text-anchor': 'middle' }, '1 : 4');
    const dRoute = el(X, 'polyline', { class: 'route', points: '' });
    const dOut = [], dVal = [];
    for (let k = 0; k < 4; k++) {
        const y = 50 + k * 50;
        dOut.push(el(X, 'polyline', { class: 'wire', points: `210,${y} 290,${y}` }));
        dVal.push(el(X, 'text', { x: 250, y: y - 7, 'text-anchor': 'middle', 'font-weight': 700 }, '0'));
        el(X, 'text', { x: 300, y: y + 5, class: 'lbl' }, `D${SUB[k]}`);
    }
    const dSel = [];
    [['s₁', 138], ['s₀', 188]].forEach(([lab, x], k) => {
        const yEdge = 195 + (x - 120) * 35 / 90;
        el(X, 'polyline', { class: 'wire', points: `${x},${yEdge} ${x},222` });
        dSel.push(toggle(X, x, 234, () => { if (k === 0) dem.s1 ^= 1; else dem.s0 ^= 1; drawDemux(); }));
        el(X, 'text', { x, y: 262, class: 'lbl', 'font-size': 12, 'text-anchor': 'middle' }, lab);
    });

    function drawDemux() {
        const sel = dem.s1 * 2 + dem.s0;
        dTog.set(dem.D);
        dIn.classList.toggle('v1', dem.D === 1);
        dSel[0].set(dem.s1); dSel[1].set(dem.s0);
        dRoute.setAttribute('points', `120,125 210,${50 + sel * 50}`);
        for (let k = 0; k < 4; k++) {
            const v = k === sel ? dem.D : 0;
            dOut[k].classList.toggle('v1', v === 1);
            dOut[k].classList.toggle('dim', k !== sel);
            dVal[k].textContent = v;
        }
        document.getElementById('demux-eq').innerHTML = `<i>D</i> is routed to <b>D${SUB[sel]}</b>; the other outputs are 0.`;
    }

    drawMux();
    drawDemux();
</script>
</body>
</html>
