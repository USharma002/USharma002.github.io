<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inverse square law</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; touch-action: none; user-select: none; }
  svg text { font-family: var(--serif); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .s { font-size: 13px; }
  .m { font-style: italic; font-size: 16px; }
  .handle { cursor: ew-resize; }
</style>
</head>
<body>
<div class="readout" id="readout"></div>
<svg id="svg" viewBox="0 0 760 300"></svg>
<div class="hint">drag the patch to change its distance r from the source</div>
<script src="/interactive/pt/embed.js"></script>
<script>
// A point source sends a fixed flux into a fixed cone of directions. At distance r the cone
// crosses an area proportional to r^2 (shown here in cross-section), so the irradiance falls as 1/r^2.
const svg = document.getElementById('svg'), out = document.getElementById('readout');
const SX = 110, SY = 150, U = 95, HALF = 18 * Math.PI / 180, NRAY = 15;
let r = 1.5;                                          // distance in units, 1..4

function el(tag, a, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
function draw() {
  const c = PT.c, E = 1 / (r * r);
  svg.textContent = '';
  // distance rings
  for (let i = 1; i <= 4; i++) {
    el('path', { d: `M${SX + i * U * Math.cos(HALF + 0.15)},${SY - i * U * Math.sin(HALF + 0.15)} A${i * U},${i * U} 0 0 1 ${SX + i * U * Math.cos(HALF + 0.15)},${SY + i * U * Math.sin(HALF + 0.15)}`,
                 fill: 'none', stroke: c.border, 'stroke-dasharray': '4 4' });
    el('text', { x: SX + i * U, y: 290, 'text-anchor': 'middle', class: 's', fill: c.muted }, `r = ${i}`);
  }
  // cone and photon rays up to the patch
  const R = r * U;
  for (let k = 0; k < NRAY; k++) {
    const a = -HALF + 2 * HALF * (k + 0.5) / NRAY;
    el('line', { x1: SX, y1: SY, x2: SX + R * Math.cos(a), y2: SY + R * Math.sin(a), stroke: PT.alpha(c.accent, 0.45), 'stroke-width': 1 });
    el('circle', { cx: SX + R * Math.cos(a), cy: SY + R * Math.sin(a), r: 2.6, fill: c.accent });
  }
  // the patch the cone covers at distance r
  el('path', { d: `M${SX + R * Math.cos(HALF)},${SY - R * Math.sin(HALF)} A${R},${R} 0 0 1 ${SX + R * Math.cos(HALF)},${SY + R * Math.sin(HALF)}`,
               fill: 'none', stroke: c.text, 'stroke-width': 3, class: 'handle', id: 'h' });
  el('text', { x: SX + R + 14, y: SY + 5, class: 'm', fill: c.text }, 'A ∝ r²');
  el('circle', { cx: SX, cy: SY, r: 7, fill: c.accent });
  el('text', { x: SX - 14, y: SY + 5, 'text-anchor': 'end', class: 'm', fill: c.text }, 'source');
  // irradiance bar
  const bx = 680, bh = 200, by = 40;
  el('rect', { x: bx, y: by, width: 16, height: bh, fill: 'none', stroke: c.muted });
  el('rect', { x: bx, y: by + bh * (1 - E), width: 16, height: bh * E, fill: c.accent });
  el('text', { x: bx + 24, y: by + 5, class: 's', fill: c.muted }, '1');
  el('text', { x: bx + 24, y: by + bh + 4, class: 's', fill: c.muted }, '0');
  el('text', { x: bx + 8, y: by + bh + 26, 'text-anchor': 'middle', class: 's', fill: c.muted }, 'E(r) / E(1)');
  out.innerHTML = `<span class="k">r =</span> ${r.toFixed(2)}&emsp;<span class="k">area ∝ r² =</span> ${(r * r).toFixed(2)}&emsp;<span class="k">irradiance ∝ 1/r² =</span> <span class="acc">${E.toFixed(3)}</span>`;
}
function pointer(e) {
  const b = svg.getBoundingClientRect(), s = 760 / b.width;
  const x = (e.clientX - b.left) * s - SX, y = (e.clientY - b.top) * s - SY;
  r = Math.max(1, Math.min(4, Math.hypot(x, y) / U));
  draw();
}
let drag = false;
svg.addEventListener('pointerdown', e => { drag = true; svg.setPointerCapture(e.pointerId); pointer(e); });
svg.addEventListener('pointermove', e => { if (drag) pointer(e); });
svg.addEventListener('pointerup', () => drag = false);
PT.onTheme(draw);
draw();
</script>
</body>
</html>
