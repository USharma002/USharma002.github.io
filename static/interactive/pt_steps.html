<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Path tracing step by step</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; user-select: none; margin-top: 2px; }
  svg text { font-family: var(--serif); font-size: 13px; }
  svg .it { font-style: italic; font-size: 14px; }
  svg .m { font-family: var(--mono); font-size: 11.5px; }
  .cap { font-size: 13.5px; min-height: 3em; margin-top: 2px; }
  .cap i { font-style: italic; }
</style>
</head>
<body>
<div class="row">
  <div class="seg"><button id="prev">◀</button><button id="next">▶</button></div>
  <span class="readout" id="stepno"></span>
</div>
<svg id="svg" viewBox="0 0 760 274"></svg>
<div class="cap" id="cap"></div>
<script src="/interactive/pt/embed.js"></script>
<script>
// Side view of a pinhole camera, a diffuse green box, a diffuse red wall and an area light, with max_depth = 3.
// Both surfaces are Lambertian and sampled with p(ω) = cos θ / π, so the weight f_r cos θ / p equals the albedo ρ
// and the radiance returned by a vertex is L_e + ρ · (radiance returned by the next vertex), per colour channel.
const svg = document.getElementById('svg'), cap = document.getElementById('cap');
const LE = [1.0, 0.9, 0.7], GREEN = [0.25, 0.55, 0.18], RED = [0.85, 0.25, 0.2];
const mul = (a, b) => a.map((v, i) => v * b[i]);
const EYE = [40, 112], COL = 2, ROW = 3;                              // the selected pixel
// Image plane: a 5 x 5 pixel grid drawn in perspective. FO is its top-left corner, FU one pixel to the right
// (receding from the viewer), FV one pixel down. Both camera rays pass through pixel (COL, ROW).
const FO = [69, 90.5], FU = [14, -10], FV = [0, 19];
const fp = (i, j) => [FO[0] + i * FU[0] + j * FV[0], FO[1] + i * FU[1] + j * FV[1]];
const cell = (i, j) => [fp(i, j), fp(i + 1, j), fp(i + 1, j + 1), fp(i, j + 1)].map(q => q.join(',')).join(' ');
const PATHS = [
  { v: [[290, 190], [430, 112], [365, 36]], n: [[0, -1], [-1, 0]], alb: [GREEN, RED], lab: [[290, 210, 'middle'], [440, 117, 'start'], [365, 25, 'middle']] },
  { v: [[318, 190], [350, 36]], n: [[0, -1]], alb: [GREEN], lab: [[318, 210, 'middle'], [350, 25, 'middle']] }
];
// radiance returned by each vertex (last one is on the light), flowing towards the camera
for (const P of PATHS) { const n = P.v.length; P.L = new Array(n); P.L[n - 1] = LE; for (let k = n - 2; k >= 0; k--) P.L[k] = mul(P.L[k + 1], P.alb[k]); }
const S1 = PATHS[0].L[0], S2 = PATHS[1].L[0], MEAN = S1.map((v, i) => (v + S2[i]) / 2);
const STEPS = [
  ['Scene', 'A pinhole camera, an area light and two diffuse objects, seen from the side. The image plane is the grid of pixels in front of the eye; the same grid is shown face-on on the right.'],
  ['1. Generate a camera ray', 'The ray starts at the eye and passes through a random point inside the selected pixel.'],
  ['2. Trace the ray', 'The nearest intersection is <i>x</i><sub>1</sub>, on top of the green box. A ray that hits nothing returns the background radiance instead.'],
  ['3. Emission at <i>x</i><sub>1</sub>', 'The box is not a light, so <i>L</i><sub>e</sub>(<i>x</i><sub>1</sub>) = 0. To continue, a direction is drawn from the density <i>p</i>(<i>ω</i>) = cos <i>θ</i> / π, plotted as the blue lobe around the normal.'],
  ['4. Sample a direction and recurse', 'The sampled ray hits <i>x</i><sub>2</sub> on the red wall. Its weight is <i>f</i><sub>r</sub> cos <i>θ</i> / <i>p</i>, which for a diffuse surface sampled this way is exactly the albedo <i>ρ</i><sub>green</sub>.'],
  ['5. Repeat at <i>x</i><sub>2</sub>', 'Same steps: <i>L</i><sub>e</sub>(<i>x</i><sub>2</sub>) = 0, sample a direction with weight <i>ρ</i><sub>red</sub>, trace. This ray reaches the light at <i>x</i><sub>3</sub>.'],
  ['6. Emission at <i>x</i><sub>3</sub>', 'Here <i>L</i><sub>e</sub>(<i>x</i><sub>3</sub>) is not zero. With a maximum depth of 3 the path ends, so <i>x</i><sub>3</sub> returns <i>L</i><sub>e</sub> and the recursion starts to unwind.'],
  ['7. Return through <i>x</i><sub>2</sub>', '<i>x</i><sub>2</sub> returns <i>L</i><sub>e</sub>(<i>x</i><sub>2</sub>) + <i>ρ</i><sub>red</sub> · <i>L</i>(<i>x</i><sub>3</sub>): the light, with green and blue mostly absorbed by the red wall.'],
  ['8. Return through <i>x</i><sub>1</sub> to the pixel', '<i>x</i><sub>1</sub> multiplies by <i>ρ</i><sub>green</sub>. The result, <i>L</i><sub>e</sub> · <i>ρ</i><sub>red</sub> · <i>ρ</i><sub>green</sub>, is one sample of the pixel.'],
  ['9. A second sample', 'Another path through the same pixel makes different random choices: it reaches the light after one bounce and returns <i>L</i><sub>e</sub> · <i>ρ</i><sub>green</sub>. The pixel is the average of its samples; more samples means less noise.']
];
let step = 0;
function el(tag, a, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
function sub(x, y, base, s, fill, anchor) {           // italic symbol with an upright subscript
  const t = el('text', { x, y, fill, 'text-anchor': anchor || 'middle', class: 'it' }, base);
  const ts = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
  ts.setAttribute('dy', 4); ts.setAttribute('font-size', 10); ts.setAttribute('font-style', 'normal'); ts.textContent = s; t.appendChild(ts);
}
const css = c => `rgb(${c.map(v => Math.round(255 * Math.pow(Math.min(1, Math.max(0, v)), 1 / 2.2))).join(',')})`;   // display gamma
function arrow(a, b, col, w, mid) {                   // head at the end, or at the midpoint for returning radiance
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, h = mid ? 11 : 9, s = mid ? 4.6 : 3.6;
  const t = mid ? [(a[0] + b[0]) / 2 + ux * h / 2, (a[1] + b[1]) / 2 + uy * h / 2] : b;
  el('line', { x1: a[0], y1: a[1], x2: mid ? b[0] : b[0] - ux * h * 0.8, y2: mid ? b[1] : b[1] - uy * h * 0.8, stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' });
  el('path', { d: `M${t[0]},${t[1]} L${t[0] - ux * h - uy * s},${t[1] - uy * h + ux * s} L${t[0] - ux * h + uy * s},${t[1] - uy * h - ux * s}Z`, fill: col });
}
function lobe(p, n, c) {           // polar plot of p(ω) ∝ cos θ: a circle tangent to the surface, with the normal
  const r = 21;
  el('circle', { cx: p[0] + n[0] * r, cy: p[1] + n[1] * r, r, fill: PT.alpha(c.accent2, 0.16), stroke: c.accent2 });
  arrow(p, [p[0] + n[0] * 54, p[1] + n[1] * 54], c.muted, 1);
  sub(p[0] + n[0] * 62 + (n[1] ? 9 : 0), p[1] + n[1] * 62 + (n[0] ? -7 : 4), 'n', '', c.muted);
}
function scene(c) {
  el('line', { x1: 150, y1: 250, x2: 540, y2: 250, stroke: c.text, 'stroke-width': 3, 'stroke-linecap': 'round' });
  el('rect', { x: 260, y: 190, width: 80, height: 59, fill: PT.alpha(css(GREEN), 0.45), stroke: css(GREEN), 'stroke-width': 1.6 });
  el('rect', { x: 430, y: 80, width: 60, height: 169, fill: PT.alpha(css(RED), 0.45), stroke: css(RED), 'stroke-width': 1.6 });
  el('line', { x1: 322, y1: 36, x2: 408, y2: 36, stroke: c.accent, 'stroke-width': 4, 'stroke-linecap': 'round' });
  el('text', { x: 418, y: 40, fill: c.muted }, 'light');
  // pinhole camera: eye point and the image plane
  el('circle', { cx: EYE[0], cy: EYE[1], r: 3, fill: c.text });
  el('text', { x: EYE[0], y: EYE[1] - 12, 'text-anchor': 'middle', fill: c.muted }, 'eye');
  el('polygon', { points: [fp(0, 0), fp(5, 0), fp(5, 5), fp(0, 5)].map(q => q.join(',')).join(' '), fill: PT.alpha(c.muted, 0.08), stroke: 'none' });
  if (step >= 8) el('polygon', { points: cell(COL, ROW), fill: css(step >= 9 ? MEAN : S1) });
  for (let i = 0; i <= 5; i++) {
    const a = fp(i, 0), b = fp(i, 5), d = fp(0, i), e = fp(5, i), w = i % 5 ? 0.7 : 1.3, col = i % 5 ? c.muted : c.text;
    el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, 'stroke-width': w });
    el('line', { x1: d[0], y1: d[1], x2: e[0], y2: e[1], stroke: col, 'stroke-width': w });
  }
  el('text', { x: 108, y: 30, 'text-anchor': 'middle', fill: c.muted }, 'image plane');
  if (step >= 1) el('polygon', { points: cell(COL, ROW), fill: 'none', stroke: c.accent, 'stroke-width': 2, 'stroke-linejoin': 'round' });
}
function panel(c) {                // the image and the numbers, on the right
  const gx = 598, gy = 34, s = 22, px = gx + COL * s, py = gy + ROW * s;
  el('text', { x: gx + 2.5 * s, y: gy - 10, 'text-anchor': 'middle', fill: c.muted }, 'image');
  if (step >= 8) el('rect', { x: px, y: py, width: s, height: s, fill: css(step >= 9 ? MEAN : S1) });
  for (let i = 0; i <= 5; i++) {
    el('line', { x1: gx + i * s, y1: gy, x2: gx + i * s, y2: gy + 5 * s, stroke: c.muted, 'stroke-width': 0.8 });
    el('line', { x1: gx, y1: gy + i * s, x2: gx + 5 * s, y2: gy + i * s, stroke: c.muted, 'stroke-width': 0.8 });
  }
  if (step >= 1) el('rect', { x: px, y: py, width: s, height: s, fill: 'none', stroke: c.accent, 'stroke-width': 2 });
  const rows = [['L', 'e', LE, 0], ['ρ', 'green', GREEN, 0], ['ρ', 'red', RED, 0], ['sample 1', null, S1, 8], ['sample 2', null, S2, 9], ['pixel', null, MEAN, 9]];
  rows.forEach(([name, s2, val, from], i) => {
    if (step < from) return;
    const y = 172 + i * 17;
    el('rect', { x: 566, y: y - 9.5, width: 10, height: 10, fill: css(val), stroke: c.muted, 'stroke-width': 0.6 });
    if (s2) sub(583, y, name, s2, c.text, 'start'); else el('text', { x: 583, y, fill: c.text }, name);
    el('text', { x: 756, y, 'text-anchor': 'end', class: 'm', fill: c.text }, val.map(v => v.toFixed(2)).join(' '));
  });
}
function drawPath(c, P, upto, back) {
  // upto: segments traced outward (eye -> x1 is the first); back: how many of them already carry radiance back
  const pts = [EYE, ...P.v], n = P.v.length;
  for (let k = 0; k < upto; k++) {
    if (k >= n - back) arrow(pts[k + 1], pts[k], css(P.L[k]), 3, true);
    else arrow(pts[k], pts[k + 1], c.text, 1.3);
  }
  P.v.forEach((p, i) => {
    if (upto <= i) return;
    el('circle', { cx: p[0], cy: p[1], r: 3, fill: c.text });
    sub(P.lab[i][0], P.lab[i][1], 'x', String(i + 1), c.text, P.lab[i][2]);
  });
}
function draw() {
  const c = PT.c, P = PATHS[0];
  svg.textContent = '';
  scene(c);
  document.getElementById('stepno').textContent = `step ${step} / ${STEPS.length - 1}`;
  if (step === 3 || step === 4) lobe(P.v[0], P.n[0], c);
  if (step === 5) lobe(P.v[1], P.n[1], c);
  if (step === 1) { const t = 0.42; arrow(EYE, [EYE[0] + (P.v[0][0] - EYE[0]) * t, EYE[1] + (P.v[0][1] - EYE[1]) * t], c.text, 1.3); }
  else if (step === 9) drawPath(c, PATHS[1], 2, 2);
  else drawPath(c, P, [0, 0, 1, 1, 2, 3, 3, 3, 3][step], [0, 0, 0, 0, 0, 0, 1, 2, 3][step]);
  panel(c);
  cap.innerHTML = `<b>${STEPS[step][0]}.</b> ${STEPS[step][1]}`;
}
document.getElementById('next').onclick = () => { step = Math.min(STEPS.length - 1, step + 1); draw(); };
document.getElementById('prev').onclick = () => { step = Math.max(0, step - 1); draw(); };
{ const q = new URLSearchParams(location.search); if (q.get('step')) step = +q.get('step'); }
PT.onTheme(draw);
draw();
</script>
</body>
</html>
