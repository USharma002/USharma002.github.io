<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importance sampling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; user-select: none; }
  svg text { font-family: var(--serif); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .s { font-size: 12px; }
  .m { font-style: italic; font-size: 14px; }
  .readout { margin-top: 4px; }
</style>
</head>
<body>
<div class="row">
  <div class="grp">p(x) = (1 − α) · uniform + α · f(x)/I&ensp;&alpha; <input type="range" id="alpha" min="0" max="1" step="0.01" value="0"><b id="av"></b></div>
  <div class="seg"><button id="resample">resample</button><button id="newf">new f(x)</button></div>
</div>
<svg id="svg" viewBox="0 0 760 330"></svg>
<div class="readout" id="readout"></div>
<script src="/interactive/pt/embed.js"></script>
<script>
// Estimator: I ≈ (1/N) Σ f(X)/p(X), X ~ p.  Its per-sample variance is ∫ f²/p dx − I²,
// computed here by quadrature, so the number shown is exact, not an estimate.
const svg = document.getElementById('svg'), out = document.getElementById('readout'), al = document.getElementById('alpha');
const NS = 40, Q = 2000;
let G = [], I = 0, fmax = 1, xs = [];

const f = x => { let y = 0.05; for (const g of G) y += g.a * Math.exp(-0.5 * ((x - g.m) / g.s) ** 2); return y; };
const p = (x, a) => (1 - a) + a * f(x) / I;

function newF() {
  G = Array.from({ length: 2 + Math.floor(Math.random() * 3) }, () => ({ m: 0.1 + 0.8 * Math.random(), s: 0.025 + 0.08 * Math.random(), a: 0.2 + 0.8 * Math.random() }));
  I = 0; fmax = 0;
  for (let i = 0; i < Q; i++) { const y = f((i + 0.5) / Q); I += y / Q; fmax = Math.max(fmax, y); }
  resample();
}
function sampleOne(a) {
  if (Math.random() >= a) return Math.random();
  for (;;) { const x = Math.random(); if (Math.random() * fmax < f(x)) return x; }   // rejection sampling from f/I
}
function resample() { const a = +al.value; xs = Array.from({ length: NS }, () => sampleOne(a)); draw(); }
function el(tag, at, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in at) e.setAttribute(k, at[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
function draw() {
  const c = PT.c, a = +al.value;
  document.getElementById('av').textContent = a.toFixed(2);
  svg.textContent = '';
  const L = 50, R = 740, T = 20, B = 220, ymax = Math.max(fmax, ...Array.from({ length: 101 }, (_, i) => p(i / 100, a) * I)) * 1.08;
  const X = x => L + (R - L) * x, Y = y => B - (B - T) * y / ymax;
  el('line', { x1: L, y1: B, x2: R, y2: B, stroke: c.muted });
  el('line', { x1: L, y1: T, x2: L, y2: B, stroke: c.muted });
  // I · p(x): the density scaled to the integral, so it lies on top of f when p ∝ f
  let d = `M${X(0)},${B}`;
  for (let i = 0; i <= 200; i++) d += ` L${X(i / 200)},${Y(p(i / 200, a) * I)}`;
  el('path', { d: d + ` L${X(1)},${B}Z`, fill: PT.alpha(c.accent2, 0.15), stroke: c.accent2, 'stroke-width': 1.5, 'stroke-dasharray': '5 4' });
  d = '';
  for (let i = 0; i <= 300; i++) d += (i ? ' L' : 'M') + `${X(i / 300)},${Y(f(i / 300))}`;
  el('path', { d, fill: 'none', stroke: c.accent, 'stroke-width': 2.5 });
  el('text', { x: R - 4, y: T + 4, 'text-anchor': 'end', class: 'm', fill: c.accent }, 'f(x)');
  el('text', { x: R - 4, y: T + 22, 'text-anchor': 'end', class: 'm', fill: c.accent2 }, 'I · p(x)');
  // samples and their weights f/p, drawn below the axis on a common scale
  const ws = xs.map(x => f(x) / p(x, a)), wmax = Math.max(I * 2, ...ws);
  const WB = 315, WT = 245, WY = w => WB - (WB - WT) * w / wmax;
  el('line', { x1: L, y1: WY(I), x2: R, y2: WY(I), stroke: c.muted, 'stroke-dasharray': '4 4' });
  el('text', { x: L - 6, y: WY(I) + 4, 'text-anchor': 'end', class: 'm', fill: c.muted }, 'I');
  el('text', { x: L - 6, y: WB + 2, 'text-anchor': 'end', class: 's', fill: c.muted }, 'f/p');
  xs.forEach((x, i) => {
    el('line', { x1: X(x), y1: B, x2: X(x), y2: B - 8, stroke: c.text, 'stroke-width': 1.3 });
    el('line', { x1: X(x), y1: WB, x2: X(x), y2: WY(ws[i]), stroke: c.text, 'stroke-width': 2, 'stroke-opacity': 0.7 });
  });
  // exact variance of one sample by quadrature
  let m2 = 0; for (let i = 0; i < Q; i++) { const x = (i + 0.5) / Q; m2 += f(x) ** 2 / p(x, a) / Q; }
  const v1 = Math.max(0, m2 - I * I), est = ws.reduce((s, w) => s + w, 0) / NS;
  out.innerHTML = `<span class="k">I =</span> ${I.toFixed(4)}&ensp;<span class="k">estimate (N=${NS}) =</span> <span class="acc">${est.toFixed(4)}</span>&ensp;<span class="k">Var[f/p] =</span> <span class="acc2">${v1.toFixed(5)}</span>&ensp;<span class="k">std. error =</span> ${Math.sqrt(v1 / NS).toFixed(4)}`;
}
al.oninput = resample;
document.getElementById('resample').onclick = resample;
document.getElementById('newf').onclick = newF;
PT.onTheme(draw);
newF();
</script>
</body>
</html>
