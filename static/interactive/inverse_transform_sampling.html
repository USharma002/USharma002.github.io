<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inverse transform sampling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; user-select: none; }
  svg text { font-family: var(--serif); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .s { font-size: 12px; }
  .t { font-size: 14px; }
  .m { font-style: italic; font-size: 14px; }
</style>
</head>
<body>
<div class="row">
  <div class="seg"><button id="one">draw 1 sample</button><button id="hund">draw 100</button><button id="reset">clear</button></div>
  <button id="pmf">new PMF</button>
  <span class="readout" id="readout"></span>
</div>
<svg id="svg" viewBox="0 0 760 260"></svg>
<div class="hint">X = F⁻¹(U) = the smallest x with F(x) ≥ U. The histogram of drawn samples converges to the PMF.</div>
<script src="/interactive/pt/embed.js"></script>
<script>
const svg = document.getElementById('svg'), out = document.getElementById('readout');
const N = 5;
let pmf = [0.1, 0.2, 0.4, 0.2, 0.1], counts = new Array(N).fill(0), total = 0, last = null;
const cdf = () => { let s = 0; return pmf.map(p => (s += p)); };

function el(tag, a, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
function axes(x0, x1, y0, y1, ymax, title, yl) {
  const c = PT.c;
  el('line', { x1: x0, y1: y1, x2: x1, y2: y1, stroke: c.muted });
  el('line', { x1: x0, y1: y0, x2: x0, y2: y1, stroke: c.muted });
  const step = ymax >= 1 ? 0.25 : 0.1;
  for (let v = 0; v <= ymax + 1e-9; v += step) {
    const y = y1 - (y1 - y0) * v / ymax;
    if (v) el('line', { x1: x0, y1: y, x2: x1, y2: y, stroke: c.border });
    el('text', { x: x0 - 6, y: y + 4, 'text-anchor': 'end', class: 's', fill: c.muted }, +v.toFixed(2));
  }
  el('text', { x: (x0 + x1) / 2, y: 14, 'text-anchor': 'middle', class: 't', fill: c.text }, title);
  el('text', { x: x0 - 34, y: (y0 + y1) / 2, 'text-anchor': 'middle', class: 'm', fill: c.muted, transform: `rotate(-90 ${x0 - 34} ${(y0 + y1) / 2})` }, yl);
}
function draw() {
  const c = PT.c, F = cdf();
  svg.textContent = '';
  // PMF panel: bars = p(x), outlined boxes = fraction of samples that landed on x
  const ax0 = 60, ax1 = 330, ay0 = 30, ay1 = 220, bw = (ax1 - ax0) / N;
  const ymax = Math.max(0.5, Math.ceil(Math.max(...pmf) * 10) / 10);
  axes(ax0, ax1, ay0, ay1, ymax, 'PMF p(x) and sample histogram', 'probability');
  for (let i = 0; i < N; i++) {
    const h = (ay1 - ay0) * pmf[i] / ymax, x = ax0 + i * bw + bw * 0.18;
    el('rect', { x, y: ay1 - h, width: bw * 0.64, height: h, fill: PT.alpha(c.accent2, last === i ? 0.75 : 0.4) });
    if (total) {
      const hh = Math.min(ay1 - ay0, (ay1 - ay0) * counts[i] / total / ymax);
      el('rect', { x: x + 4, y: ay1 - hh, width: bw * 0.64 - 8, height: hh, fill: 'none', stroke: c.accent, 'stroke-width': 2 });
    }
    el('text', { x: ax0 + (i + 0.5) * bw, y: ay1 + 16, 'text-anchor': 'middle', class: 's', fill: c.text }, i + 1);
  }
  el('text', { x: (ax0 + ax1) / 2, y: 254, 'text-anchor': 'middle', class: 'm', fill: c.muted }, 'x');
  // CDF panel: step function, U on the vertical axis, X read off the horizontal axis
  const bx0 = 450, bx1 = 720, by0 = 30, by1 = 220, sw = (bx1 - bx0) / N;
  axes(bx0, bx1, by0, by1, 1, 'CDF F(x)', 'F(x),  U');
  // F jumps by p(k) exactly at x = k (the tick), so the dashed reading meets the riser
  let prev = 0, d = `M${bx0},${by1}`;
  for (let i = 0; i < N; i++) {
    const y = by1 - (by1 - by0) * F[i], x = bx0 + (i + 0.5) * sw;
    d += ` L${x},${by1 - (by1 - by0) * prev} L${x},${y}`;
    prev = F[i];
    el('text', { x, y: by1 + 16, 'text-anchor': 'middle', class: 's', fill: c.text }, i + 1);
  }
  d += ` L${bx1},${by1 - (by1 - by0) * prev}`;
  el('path', { d, fill: 'none', stroke: c.text, 'stroke-width': 2 });
  if (last !== null) {
    const yu = by1 - (by1 - by0) * lastU, xs = bx0 + (last + 0.5) * sw;
    el('line', { x1: bx0, y1: yu, x2: xs, y2: yu, stroke: c.accent, 'stroke-width': 1.6, 'stroke-dasharray': '5 4' });
    el('line', { x1: xs, y1: yu, x2: xs, y2: by1, stroke: c.accent, 'stroke-width': 1.6, 'stroke-dasharray': '5 4' });
    el('circle', { cx: bx0, cy: yu, r: 4, fill: c.accent });
    el('circle', { cx: xs, cy: by1, r: 4, fill: c.accent });
  }
  el('text', { x: (bx0 + bx1) / 2, y: 254, 'text-anchor': 'middle', class: 'm', fill: c.muted }, 'x');
  out.innerHTML = last === null ? `<span class="k">samples:</span> ${total}`
    : `<span class="k">U =</span> <span class="acc">${lastU.toFixed(3)}</span>&ensp;<span class="k">X =</span> <span class="acc">${last + 1}</span>&ensp;<span class="k">samples:</span> ${total}`;
}
let lastU = 0;
function sample() {
  const u = Math.random(), F = cdf();
  let i = 0; while (i < N - 1 && u > F[i]) i++;
  counts[i]++; total++; last = i; lastU = u;
}
document.getElementById('one').onclick = () => { sample(); draw(); };
document.getElementById('hund').onclick = () => { for (let k = 0; k < 100; k++) sample(); draw(); };
document.getElementById('reset').onclick = () => { counts.fill(0); total = 0; last = null; draw(); };
document.getElementById('pmf').onclick = () => {
  const r = Array.from({ length: N }, () => 0.05 + Math.random()), s = r.reduce((a, b) => a + b, 0);
  pmf = r.map(v => v / s); counts.fill(0); total = 0; last = null; draw();
};
PT.onTheme(draw);
draw();
</script>
</body>
</html>
