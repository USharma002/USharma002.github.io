<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building the Model Transform</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="row" id="steps"></div>
<div class="row" id="order"></div>
<div class="stage"><div class="pane"><div class="readout" id="ro"></div><canvas id="cv"></canvas><div class="hint">Drag to rotate the view</div><div class="label" id="lab"></div></div></div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
// The house of the shared scene, with its own S, R and T. Each factor is a function of e in [0,1],
// from the identity (e = 0) to the full transform (e = 1).
const H = SCENE.models[0], mesh = H.mesh;
const Sm = e => TF.S(...H.s.map(x => 1 + (x - 1) * e)), Rm = e => TF.Ry(H.r * e), Tm = e => TF.T(...TF.scl(H.t, e));
let step = 0, order = 0, sc = 0;                     // sc: continuous step in [0, 3]
const ORD = [[Sm, Rm, Tm], [Tm, Rm, Sm]];          // order in which the factors are applied
const NAMES = [['S', 'R', 'T'], ['T', 'R', 'S']];
const VERB = { S: 'Scale', R: 'Rotate', T: 'Translate' };
// Product of the first k applied factors, the k-th one at progress e: the last one applied is leftmost.
const prod = (k, e = 1) => ORD[order].slice(0, k).reduce((A, F, i) => TF.mul(F(i === k - 1 ? e : 1), A), TF.I());
const Mof = s => { if (s <= 0) return TF.I(); const [k, e] = TF.segOf(s, 3); return prod(k + 1, e); };

const v = new TF.View($('cv'), { extent: 3.6, target: [-1.6, 1.0, 0.4], draw: dv => {
    const M = Mof(sc);
    dv.grid(6, 1, 0);
    dv.axes(TF.I(), 2.2, { faint: true });
    dv.mesh(TF.mapMesh(mesh, p => TF.xf(M, p)), 'house');
    dv.axes(M, 0.9);
} });
TF.onTheme(() => v.render());
const anim = TF.animator(() => sc, x => sc = x, () => v.render());

function readout() {
    const applied = NAMES[order].slice(0, step).reverse().map(s => `<i>${s}</i>`).join('');
    $('lab').innerHTML = step ? `<i>M</i> = ${applied}` : 'Object space, <i>M</i> = <i>I</i>';
    $('ro').innerHTML = `<span>M = ${TF.matHTML(prod(step), 4, 4, 2)}</span>`;
}
function go(s) { step = s; readout(); anim(s); }
const setSteps = TF.seg($('steps'), ['Object space', 'S', 'R', 'T'], 0, go);
function labels() { $('steps').querySelectorAll('button').forEach((b, i) => { if (i) b.textContent = VERB[NAMES[order][i - 1]]; }); }
// Changing the order: undo the current factors, then apply them in the new order.
TF.seg($('order'), ['Order: scale → rotate → translate', 'Order: translate → rotate → scale'], 0, o => {
    setSteps(0); step = 0; readout();
    anim(0, () => { order = o; labels(); setSteps(3); go(3); });
});
labels(); readout();
// ?sc=<number> opens at that point of the animation (for checking intermediate frames)
{ const q = parseFloat(new URLSearchParams(location.search).get('sc')); if (isFinite(q)) { sc = q; v.render(); } }
</script>
</body>
</html>
