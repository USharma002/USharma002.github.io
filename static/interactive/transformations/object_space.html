<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Space Visualization</title>
<style>
    :root {
        --mafs-bg: transparent;
        --mafs-fg: #000000;
        --mafs-grid: rgba(0,0,0,0.15);
        --mafs-axis: rgba(0,0,0,0.8);
        --mafs-text: #333;
    }

    /* Theme synchronization */
    .theme-light {
        --mafs-fg: #000000;
        --mafs-grid: rgba(0,0,0,0.15);
        --mafs-axis: rgba(0,0,0,0.8);
        --mafs-text: #333;
    }

    .theme-dark {
        --mafs-fg: #ffffff;
        --mafs-grid: rgba(255,255,255,0.2);
        --mafs-axis: rgba(255,255,255,0.8);
        --mafs-text: #eee;
    }

    body {
        margin: 0;
        overflow: hidden;
        background-color: var(--mafs-bg);
        font-family: system-ui, sans-serif;
        color: var(--mafs-text);
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
        min-height: 400px;
        justify-content: center;
    }

    .panel {
        flex: 1;
        min-width: 250px;
        height: 400px;
        position: relative;
        border-right: 1px solid var(--mafs-grid);
    }
    .panel:last-child { border-right: none; }

    .label {
        position: absolute;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        color: var(--mafs-fg);
        pointer-events: none;
    }

    svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .face {
        fill: rgba(59, 130, 246, 0.4);
        stroke: rgba(255,255,255,0.5);
        stroke-width: 0.01;
    }

    .sphere-line {
        fill: none;
        stroke: rgba(59, 130, 246, 0.6);
        stroke-width: 0.03;
    }

    text.axis-label {
        fill: var(--mafs-fg);
        font-size: 0.4px;
        font-style: italic;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <div class="panel">
        <svg id="canvas-cube" preserveAspectRatio="xMidYMid slice">
            <defs>
                <marker id="arrow-x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
                </marker>
                <marker id="arrow-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
                </marker>
                <marker id="arrow-z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
                </marker>
            </defs>
            <g class="axes-group"></g>
            <g class="mesh-group"></g>
        </svg>
        <div class="label">Cube Local Space</div>
    </div>
    <div class="panel">
        <svg id="canvas-pyramid" preserveAspectRatio="xMidYMid slice">
            <defs>
                <marker id="arrow-x2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
                </marker>
                <marker id="arrow-y2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
                </marker>
                <marker id="arrow-z2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
                </marker>
            </defs>
            <g class="axes-group"></g>
            <g class="mesh-group"></g>
        </svg>
        <div class="label">Pyramid Local Space</div>
    </div>
    <div class="panel">
        <svg id="canvas-bunny" preserveAspectRatio="xMidYMid slice">
            <defs>
                <marker id="arrow-x3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
                </marker>

                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
                </marker>
                <marker id="arrow-z3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
                </marker>
            </defs>
            <g class="axes-group"></g>
            <g class="mesh-group"></g>
        </svg>
        <div class="label">Bunny Local Space</div>
    </div>
</div>

    // Theme sync
    function syncTheme() {
        try {
            const parent = window.parent.document.body;
            const isDark = parent.classList.contains('dark') || 
                           window.parent.document.documentElement.classList.contains('dark');
            document.documentElement.className = isDark ? 'theme-dark' : 'theme-light';
        } catch (e) {}
    }
    syncTheme();
    setInterval(syncTheme, 1000);

    function project(x, y, z) {
        const angle = 30 * Math.PI / 180;
        const factor = 0.5;
        return {
            x: x - z * Math.cos(angle) * factor,
            y: -(y - z * Math.sin(angle) * factor)
        };
    }

    function initSVG(id) {
        const svg = document.getElementById(id);
        const aspect = svg.clientWidth / svg.clientHeight;
        const height = 6;
        const width = height * aspect;
        svg.setAttribute('viewBox', `${-width/2} ${-height/2} ${width} ${height}`);
        
        // Draw Axes
        const axes = svg.querySelector('.axes-group');
        const axScale = 2.2;
        
        const colors = { x: '#ef4444', y: '#22c55e', z: '#3b82f6' };
        const pts = [
            {v: {x:axScale, y:0, z:0}, l: 'x'},
            {v: {x:0, y:axScale, z:0}, l: 'y'},
            {v: {x:0, y:0, z:axScale}, l: 'z'}
        ];

        pts.forEach(p => {
            const origin = project(0,0,0);
            const target = project(p.v.x, p.v.y, p.v.z);
            const color = colors[p.l];
            let markerSuffix = '';
            if (id === 'canvas-pyramid') markerSuffix = '2';
            if (id === 'canvas-bunny') markerSuffix = '3';
            
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            line.setAttribute('d', `M ${origin.x} ${origin.y} L ${target.x} ${target.y}`);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '0.04');
            line.setAttribute('marker-end', `url(#arrow-${p.l}${markerSuffix})`);
            axes.appendChild(line);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x', target.x + (p.l === 'x' ? 0.2 : -0.2));
            text.setAttribute('y', target.y + (p.l === 'y' ? -0.2 : 0.2));
            text.setAttribute('class', 'axis-label');
            text.setAttribute('style', `fill: ${color}`);
            text.textContent = p.l;
            axes.appendChild(text);
        });

        // Origin dot
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const o = project(0,0,0);
        dot.setAttribute('cx', o.x); dot.setAttribute('cy', o.y); dot.setAttribute('r', '0.08');
        dot.setAttribute('fill', 'var(--mafs-fg)');
        axes.appendChild(dot);
    }

    function getShadingColor(v0, v1, v2) {
        let ux = v1.x - v0.x, uy = v1.y - v0.y, uz = v1.z - v0.z;
        let vx = v2.x - v0.x, vy = v2.y - v0.y, vz = v2.z - v0.z;
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        let len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
        nx /= len; ny /= len; nz /= len;

        let lx = 0.5, ly = 0.8, lz = 0.5; 
        let llen = Math.sqrt(lx*lx + ly*ly + lz*lz);
        lx /= llen; ly /= llen; lz /= llen;
        let dot = Math.max(0.1, nx * lx + ny * ly + nz * lz);
        
        let r = Math.round(26 + (165 - 26) * dot);
        let g = Math.round(156 + (216 - 156) * dot);
        let b = Math.round(199 + (243 - 199) * dot);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function render() {
        // Render Cube
        cubeMesh.innerHTML = '';
        const cubeData = cubeFaces.map(indices => {
            const pts = indices.map(i => cubeVertices[i]);
            const avgZ = pts.reduce((sum, p) => sum + p.z, 0) / 4;
            return {pts, avgZ};
        }).sort((a, b) => a.avgZ - b.avgZ);

        cubeData.forEach(f => {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('class', 'face');
            const points = f.pts.map(p => project(p.x, p.y, p.z));
            poly.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
            poly.setAttribute('fill', getShadingColor(f.pts[0], f.pts[1], f.pts[2]));
            cubeMesh.appendChild(poly);
        });

        // Render Pyramid
        pyramidMesh.innerHTML = '';
        const pyramidData = pyramidFaces.map(indices => {
            const pts = indices.map(i => pyramidVertices[i]);
            const avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
            return {pts, avgZ};
        }).sort((a, b) => a.avgZ - b.avgZ);

        pyramidData.forEach(f => {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('class', 'face');
            const points = f.pts.map(p => project(p.x, p.y, p.z));
            poly.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
            poly.setAttribute('fill', getShadingColor(f.pts[0], f.pts[1], f.pts[2]));
            pyramidMesh.appendChild(poly);
        });

        // Render Bunny
        bunnyMesh.innerHTML = '';
        const bunnyData = bunnyFaces.map(indices => {
            const pts = indices.map(i => bunnyVertices[i]);
            const avgZ = pts.reduce((sum, p) => sum + p.z, 0) / 3;
            return {pts, avgZ};
        }).sort((a, b) => a.avgZ - b.avgZ);

        bunnyData.forEach(f => {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('class', 'face');
            const points = f.pts.map(p => project(p.x, p.y, p.z));
            poly.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
            poly.setAttribute('fill', getShadingColor(f.pts[0], f.pts[1], f.pts[2]));
            bunnyMesh.appendChild(poly);
        });
    }
    render();
