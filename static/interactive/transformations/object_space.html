<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Space</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
const views = [];
SCENE.models.forEach((m, i) => {
    const pane = document.createElement('div'); pane.className = 'pane';
    pane.innerHTML = `<canvas></canvas>${i === 0 ? '<div class="hint">Drag to rotate the view</div>' : ''}<div class="label">${m.name[0].toUpperCase() + m.name.slice(1)}</div>`;
    $('stage').appendChild(pane);
    views.push(new TF.View(pane.querySelector('canvas'), {
        extent: 1.25, target: [0, 0.15, 0],
        onOrbit: (y, p) => views.forEach(v => v.setOrbit(y, p)),
        draw: v => {
            v.grid(2, 0.5, -0.5);
            v.mesh(m.mesh, m.name);
            v.axes(TF.I(), 0.95);
            v.dot([0, 0, 0], C.fg, { r: 2.5 });
        }
    }));
});
TF.onTheme(() => views.forEach(v => v.render()));
</script>
</body>
</html>
