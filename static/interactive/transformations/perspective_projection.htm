<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perspective Projection</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="row" id="ctrl"></div>
<div class="row" id="params"></div>
<div class="stage">
    <div class="pane" style="flex:1.5"><canvas id="cv3"></canvas><div class="hint">Drag to rotate the view</div><div class="label" id="lab"></div></div>
    <div class="pane"><div class="readout" id="ro" style="left: 10px; right: 10px; max-width: none; align-items: center;"></div><canvas id="cv2"></canvas><div class="label">Image on the projection plane</div></div>
</div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
const { models, cam } = SCENE;
const a = cam.a;                                   // aspect ratio, height / width
let fov = cam.fov, n = 1, f = cam.f, t = 0;
// The shared scene in camera space: the camera is at the origin and looks down -z.
const items = models.map(m => ({ m: TF.mapMesh(m.world, p => TF.xf(cam.L.view, p)), type: m.name }));
const probe = () => items[0].m.v[16];             // the top corner of the house's chimney
// Geometry clipped to the near and far planes, so n and f decide what is visible
const clipped = () => items.map(it => ({ m: TF.clipMesh(it.m, n, f), type: it.type }));

function Mf() {
    const e = 1 / Math.tan(fov * TF.deg / 2), r = n / e, tp = a * n / e;
    return TF.frustum(-r, r, -tp, tp, n, f);
}
const v3 = new TF.View($('cv3'), { yaw: -0.75, pitch: 0.35, persp: 0.05, draw: draw3 });
const v2 = new TF.View($('cv2'), { orbit: false, draw: v => {
    const { X, Y } = v.image(clipped(), Mf(), a, innerWidth <= 560 ? { fit: 0.36, cy: 0.44 } : { fit: 0.3, cy: 0.64 });   // phones: no readout above it
    const p = TF.xf(Mf(), probe());
    v.ctx.beginPath(); v.ctx.arc(X(p[0]), Y(p[1]), 4, 0, 7); v.ctx.fillStyle = C.hi; v.ctx.fill();
} });
TF.onTheme(() => { v3.render(); v2.render(); });

function draw3(v) {
    // (1 - t) I + t ZFLIP M_frustum, then division by w: a projective map for every t, with no collapse of z
    const M = TF.lerp(TF.I(), TF.mul(TF.ZFLIP, Mf()), t), P = p => TF.xf(M, p);
    v.extent = 1.9 + (f * 0.6 - 1.9) * (1 - t);
    v.target = [0, 0, -(n + f) / 2 * (1 - t)];
    const e = 1 / Math.tan(fov * TF.deg / 2), r = n / e, tp = a * n / e, k = f / n;
    const c = [[-r, -tp, -n], [r, -tp, -n], [r, tp, -n], [-r, tp, -n], [-r * k, -tp * k, -f], [r * k, -tp * k, -f], [r * k, tp * k, -f], [-r * k, tp * k, -f]];
    v.glass(c.map(P));
    v.axes(t < 0.5 ? TF.I() : TF.ZFLIP, t < 0.5 ? 2 : 1.3);     // NDC axes: z points into the screen
    clipped().forEach(it => v.mesh(TF.mapMesh(it.m, P), it.type, { normals: it.m }));
    v.dot(P(probe()), C.hi, { label: 'P' });
}
function readout() {
    const M = Mf(), P = probe(), Pc = TF.apply(M, P), Pn = TF.divide(Pc);
    $('ro').innerHTML = `<span>M<sub>frustum</sub> = ${TF.matHTML(M, 4, 4, 3)}</span>
        <span>P = ${TF.vecHTML([...P, 1], 2)} → P′/w′ = ${TF.vecHTML(Pn, 3, 'ch')}</span>`;
    $('lab').innerHTML = t < 0.5 ? 'Camera space: the view frustum' : 'NDC: the cube [−1, 1]³, left-handed (+<i>z</i> into the screen)';
}
const anim = TF.animator(() => t, x => t = x, () => { readout(); v3.render(); }, 1000);
const s0 = +(new URLSearchParams(location.search).get('step') || 0);
TF.seg($('ctrl'), ['Camera space', 'Apply M<sub>frustum</sub> and divide by <i>w</i>'], s0, i => anim(i));
if (s0) t = 1;
const upd = () => { readout(); v3.render(); v2.render(); };
TF.slider($('params'), 'α', 30, 110, 1, fov, x => { fov = x; upd(); }, x => x.toFixed(0) + '°');
TF.slider($('params'), 'n', 0.5, 14, 0.1, n, x => { n = Math.min(x, f - 0.5); upd(); });
TF.slider($('params'), 'f', 4, 40, 0.5, f, x => { f = Math.max(x, n + 0.5); upd(); });
upd();
</script>
</body>
</html>
