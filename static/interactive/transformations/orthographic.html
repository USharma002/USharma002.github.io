<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orthographic Projection</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="row" id="ctrl"></div>
<div class="row" id="params"></div>
<div class="stage">
    <div class="pane" style="flex:1.5"><canvas id="cv3"></canvas><div class="hint">Drag to rotate the view</div><div class="label" id="lab"></div></div>
    <div class="pane"><div class="readout" id="ro" style="left: 10px; right: 10px; max-width: none; align-items: center;"></div><canvas id="cv2"></canvas><div class="label">Image on the projection plane</div></div>
</div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
const { models, cam } = SCENE;
const a = cam.a;
let hw = 7, n = 1, f = cam.f, stage = 0, sc = 0;        // sc: continuous step in [0, 2]
// The shared scene in camera space
const items = models.map(m => ({ m: TF.mapMesh(m.world, p => TF.xf(cam.L.view, p)), type: m.name }));
const probe = () => items[0].m.v[16];
// Geometry clipped to the near and far planes, so n and f decide what is visible
const clipped = () => items.map(it => ({ m: TF.clipMesh(it.m, n, f), type: it.type }));

const box = () => { const r = hw, t = a * hw; return { l: -r, r, b: -t, t }; };
const Mo = () => { const B = box(); return TF.ortho(B.l, B.r, B.b, B.t, n, f); };
// M_ortho = S T: translate the box center to the origin, then scale it to [-1,1]^3 (z negated).
const Tc = () => { const B = box(); return TF.T(-(B.r + B.l) / 2, -(B.t + B.b) / 2, (f + n) / 2); };
const Sc = () => { const B = box(); return TF.S(2 / (B.r - B.l), 2 / (B.t - B.b), -2 / (f - n)); };
// The last stage is drawn through ZFLIP, since NDC is left-handed (see tf.js); readouts show M_ortho itself.
const stageM = s => s === 0 ? TF.I() : s === 1 ? Tc() : TF.mul(TF.ZFLIP, Sc(), Tc());
// Between stages: (1-e)A + eB. Both blends are exact: a partial translation, then a partial scale ((1-e)I + eS)T.
const Mof = s => { const [k, e] = TF.segOf(Math.max(0, s), 2); return TF.lerp(stageM(k), stageM(k + 1), e); };

const v3 = new TF.View($('cv3'), { yaw: -0.75, pitch: 0.35, persp: 0.05, draw: v => {
    const M = Mof(sc), P = p => TF.xf(M, p);
    const u = Math.max(0, Math.min(1, sc - 1));                  // progress of the scale
    const span = Math.max(f, 2 * hw);
    v.extent = span * 0.6 + (1.9 - span * 0.6) * u;
    v.target = TF.xf(M, [0, 0, -(n + f) / 2]);
    const B = box();
    v.glass([[B.l, B.b, -n], [B.r, B.b, -n], [B.r, B.t, -n], [B.l, B.t, -n], [B.l, B.b, -f], [B.r, B.b, -f], [B.r, B.t, -f], [B.l, B.t, -f]].map(P));
    v.axes(u > 0.5 ? TF.ZFLIP : TF.I(), u > 0.5 ? 1.3 : 2);
    clipped().forEach(it => v.mesh(TF.mapMesh(it.m, P), it.type, { normals: it.m }));
    v.dot(P(probe()), C.hi, { label: 'P' });
} });
const v2 = new TF.View($('cv2'), { orbit: false, draw: v => {
    const { X, Y } = v.image(clipped(), Mo(), a, innerWidth <= 560 ? { fit: 0.36, cy: 0.44 } : { fit: 0.3, cy: 0.64 });
    const p = TF.xf(Mo(), probe());
    v.ctx.beginPath(); v.ctx.arc(X(p[0]), Y(p[1]), 4, 0, 7); v.ctx.fillStyle = C.hi; v.ctx.fill();
} });
TF.onTheme(() => { v3.render(); v2.render(); });

const labs = ['Camera space: the view volume is a box', 'Translated: the box is centred at the origin', 'NDC: the cube [−1, 1]³, left-handed (+<i>z</i> into the screen)'];
function readout() {
    const Mm = Mo(), P = probe(), Pn = TF.xf(Mm, P);
    $('ro').innerHTML = `<span>M<sub>ortho</sub> = ${TF.matHTML(Mm, 4, 4, 3)}</span>
        <span>P = ${TF.vecHTML([...P, 1], 2)} → M<sub>ortho</sub>P = ${TF.vecHTML([...Pn, 1], 3, 'ch')}</span>`;
    $('lab').innerHTML = labs[stage];
}
const anim = TF.animator(() => sc, x => sc = x, () => v3.render(), 800);
function go(s) { stage = s; readout(); anim(s); }
const s0 = Math.min(2, +(new URLSearchParams(location.search).get('step') || 0));
TF.seg($('ctrl'), ['Camera space', 'Move box to origin', 'Scale to cube'], s0, go);
stage = s0; sc = s0;
const upd = () => { readout(); v3.render(); v2.render(); };
TF.slider($('params'), 'r', 2, 12, 0.1, hw, x => { hw = x; upd(); });
TF.slider($('params'), 'n', 0.5, 14, 0.1, n, x => { n = Math.min(x, f - 0.5); upd(); });
TF.slider($('params'), 'f', 4, 40, 0.5, f, x => { f = Math.max(x, n + 0.5); upd(); });
upd();
</script>
</body>
</html>
