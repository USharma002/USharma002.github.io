<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depth in Normalized Device Coordinates</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="row" id="params"></div>
<div class="stage"><div class="pane"><canvas id="cv"></canvas><div class="readout" id="ro" style="top: auto; bottom: 42px; right: 30px;"></div></div></div>
<script src="tf.js?v=4"></script>
<script>
const { $, C } = TF;
let n = 1, f = 10, N = 10;
// z_ndc as a function of the distance d = -P_z (Lengyel 5.47)
const zndc = d => (f + n) / (f - n) - 2 * n * f / ((f - n) * d);

const v = new TF.View($('cv'), { orbit: false, draw: dv => {
    const c = dv.ctx, W = dv.W, H = dv.H, padL = 70, padR = 30, top = 24, bot = H - 30;
    const xL = padL, xR = W - padR, xm = xL + (xR - xL) * 0.36;
    // left axis: d from n to f (linear). right axis: z_ndc from -1 to 1 (linear).
    const yD = d => bot - (d - n) / (f - n) * (bot - top);
    const yZ = z => bot - (z + 1) / 2 * (bot - top);
    c.font = '11px "Source Code Pro", monospace'; c.textBaseline = 'middle';
    // axes
    c.strokeStyle = C.muted; c.lineWidth = 1;
    c.beginPath(); c.moveTo(xL, top); c.lineTo(xL, bot); c.moveTo(xm, top); c.lineTo(xm, bot); c.stroke();
    c.fillStyle = C.muted; c.textAlign = 'right';
    c.fillText('d = n', xL - 6, bot); c.fillText('d = f', xL - 6, top);
    c.textAlign = 'left'; c.fillText('−1', xm + 5, bot); c.fillText('1', xm + 5, top);
    c.font = '13px system-ui, sans-serif'; c.textAlign = 'center';
    c.fillText('camera space', xL, bot + 16); c.fillText('NDC', xm, bot + 16);
    // evenly spaced depths and where they land
    for (let i = 0; i <= N; i++) {
        const d = n + (f - n) * i / N, z = zndc(d), t = i / N;
        const col = TF.mix(C.hi, C['ax-z'], t);
        c.strokeStyle = TF.alpha(col, 0.6); c.lineWidth = 1;
        c.beginPath(); c.moveTo(xL, yD(d)); c.lineTo(xm, yZ(z)); c.stroke();
        c.fillStyle = col;
        c.beginPath(); c.arc(xL, yD(d), 3, 0, 7); c.fill();
        c.beginPath(); c.arc(xm, yZ(z), 3, 0, 7); c.fill();
    }
    // graph of z_ndc(d) on the right
    const gx0 = xm + 60, gx1 = xR, X = d => gx0 + (d - n) / (f - n) * (gx1 - gx0);
    c.strokeStyle = C.border; c.beginPath(); c.moveTo(gx0, yZ(0)); c.lineTo(gx1, yZ(0)); c.moveTo(gx0, bot); c.lineTo(gx0, top); c.stroke();
    c.strokeStyle = C.text; c.lineWidth = 1.6; c.beginPath();
    for (let k = 0; k <= 200; k++) { const d = n + (f - n) * k / 200; k ? c.lineTo(X(d), yZ(zndc(d))) : c.moveTo(X(d), yZ(zndc(d))); }
    c.stroke();
    c.strokeStyle = TF.alpha(C.muted, 0.6); c.lineWidth = 1; c.setLineDash([3, 3]);
    c.beginPath(); c.moveTo(X(n), yZ(-1)); c.lineTo(X(f), yZ(1)); c.stroke(); c.setLineDash([]);
    for (let i = 0; i <= N; i++) { const d = n + (f - n) * i / N; c.fillStyle = TF.mix(C.hi, C['ax-z'], i / N); c.beginPath(); c.arc(X(d), yZ(zndc(d)), 2.5, 0, 7); c.fill(); }
    c.fillStyle = C.muted; c.textAlign = 'center';
    c.fillText('z_ndc as a function of d', (gx0 + gx1) / 2, top - 10); c.fillText('d', gx1, bot + 16);
    c.font = '11px "Source Code Pro", monospace'; c.fillText('n', gx0, bot + 16); c.fillText('f', gx1 - 14, bot + 16);
} });
TF.onTheme(() => v.render());
function readout() {
    const half = zndc((n + f) / 2);
    let cnt = 0; for (let i = 0; i <= N; i++) if (zndc(n + (f - n) * i / N) > 0.5) cnt++;
    $('ro').innerHTML = `<span><i>z</i><sub>ndc</sub>(<i>d</i>) = (<i>f</i>+<i>n</i>)/(<i>f</i>−<i>n</i>) − 2<i>nf</i>/((<i>f</i>−<i>n</i>)<i>d</i>)</span>
        <span>midpoint depth <i>d</i> = ${TF.num((n + f) / 2)} → <i>z</i><sub>ndc</sub> = ${TF.num(half, 3)}</span>
        <span>${cnt} of ${N + 1} samples land in the top quarter, <i>z</i><sub>ndc</sub> &gt; 0.5</span>`;
    v.render();
}
TF.slider($('params'), 'n', 0.1, 5, 0.05, n, x => { n = Math.min(x, f - 0.5); readout(); });
TF.slider($('params'), 'f', 2, 50, 0.5, f, x => { f = Math.max(x, n + 0.5); readout(); });
readout();
</script>
</body>
</html>
