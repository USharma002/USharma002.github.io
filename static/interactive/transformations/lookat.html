<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LookAt Camera Orientation</title>
<style>
    :root { --mafs-bg: transparent; --mafs-fg: #000000; --mafs-grid: rgba(0,0,0,0.15); --mafs-axis: rgba(0,0,0,0.8); --mafs-text: #333; }
    .theme-light { --mafs-fg: #000000; --mafs-grid: rgba(0,0,0,0.15); --mafs-axis: rgba(0,0,0,0.8); --mafs-text: #333; }
    .theme-dark { --mafs-fg: #ffffff; --mafs-grid: rgba(255,255,255,0.2); --mafs-axis: rgba(255,255,255,0.8); --mafs-text: #eee; }
    
    body { margin: 0; overflow: hidden; background-color: var(--mafs-bg); font-family: system-ui, sans-serif; color: var(--mafs-text); display: flex; flex-direction: column; height: 100vh; }
    .container { width: 100%; flex: 1; position: relative; cursor: grab; }
    .container:active { cursor: grabbing; }

    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 15px; background: var(--mafs-bg); border-bottom: 1px solid var(--mafs-grid); }
    button { background: var(--mafs-bg); color: var(--mafs-fg); border: 1px solid var(--mafs-grid); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    button:hover { background: var(--mafs-grid); }
    button.active { background: #333; color: #ffffff; border-color: #333; }
    
    /* LaTeX-like styling for math entities */
    .math { font-family: "Cambria Math", "Latin Modern Math", "Times New Roman", serif; font-style: italic; font-weight: bold; }

    .label { position: absolute; bottom: 15px; left: 0; right: 0; text-align: center; font-weight: 500; font-size: 18px; color: var(--mafs-fg); pointer-events: none; }
    .hint { position: absolute; top: 15px; left: 15px; font-weight: 500; font-size: 13px; color: var(--mafs-fg); opacity: 0.7; pointer-events: none; background: var(--mafs-bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--mafs-grid); }

    svg { width: 100%; height: 100%; display: block; }
    .face { stroke: rgba(255,255,255,0.5); stroke-width: 0.01; stroke-linejoin: round; }
    .face.camera { stroke: #333; stroke-width: 0.02; }

    text.axis-label { fill: var(--mafs-fg); font-size: 0.4px; font-style: italic; font-weight: bold; user-select: none; }
</style>
</head>
<body>

<div class="controls" id="buttons-container">
    <!-- Buttons dynamically injected to use formatting -->
</div>

<div class="container">
    <svg id="canvas" preserveAspectRatio="xMidYMid slice">
        <defs>
            <marker id="arrow-x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
            <marker id="arrow-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
            <marker id="arrow-z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
            
            <marker id="arrow-forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
            <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
            <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
            <marker id="arrow-worldup" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/></marker>
        </defs>
        <g class="grid-group"></g>
        <g class="axes-group"></g>
        <g class="mesh-group"></g>
        <g class="vectors-group"></g>
    </svg>
    <div class="hint">Drag to rotate the view</div>
    <div class="label" id="status-label">World Space</div>
</div>

<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
    function syncTheme() {
        try {
            const parent = window.parent.document.body;
            const isDark = parent.classList.contains('dark') || window.parent.document.documentElement.classList.contains('dark');
            document.documentElement.className = isDark ? 'theme-dark' : 'theme-light';
        } catch (e) {}
    }
    syncTheme();
    // follow the page's theme toggle without polling
    try { if (window.parent !== window) new MutationObserver(syncTheme).observe(window.parent.document.body, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}

    // Initial angle rotated to clearly see the camera profile mapping to vectors
    let viewAngleX = 30 * Math.PI / 180;
    let viewAngleY = 70* Math.PI / 180;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;

    // --- Math Text Formatting ---
    const fmt = (text, color) => `<span class="math" style="color: ${color};">${text}</span>`;
    const fFwd = fmt("Forward", "#3b82f6");
    const fRight = fmt("Right", "#ef4444");
    const fUp = fmt("Up", "#22c55e");
    const fWUp = fmt("WorldUp", "#a855f7");

    const labels =[
        "World Space Setup", 
        `${fFwd}: <b>f</b> = normalize(<b>C</b> &minus; <b>E</b>)`,
        `${fRight}: <b>r</b> = normalize(<b>f</b> &times; <b>U</b>)`,
        `${fUp}: <b>u</b> = <b>r</b> &times; <b>f</b>`
    ];

    // Inject buttons
    const btnContainer = document.getElementById('buttons-container');
    btnContainer.innerHTML = `
        <button onclick="setState(0)" class="active">World Space</button>
        <button onclick="setState(1)">1. ${fFwd}</button>
        <button onclick="setState(2)">2. ${fRight} Cross Product</button>
        <button onclick="setState(3)">3. ${fUp} Cross Product</button>
    `;

    let state = 0;
    let animProgress =[0, 0, 0, 0];
    let animTarget = [0, 0, 0, 0];
    let isAnimating = false;

    function setState(newState) {
        document.querySelectorAll('.controls button').forEach((b, i) => b.className = i === newState ? 'active' : '');
        state = newState;
        animTarget[1] = state >= 1 ? 1 : 0;
        animTarget[2] = state >= 2 ? 1 : 0;
        animTarget[3] = state >= 3 ? 1 : 0;

        document.getElementById('status-label').innerHTML = labels[newState];

        if (!isAnimating) { isAnimating = true; requestAnimationFrame(animate); }
    }

    function animate() {
        let needsUpdate = false;
        for(let i=1; i<=3; i++) {
            let diff = animTarget[i] - animProgress[i];
            if (Math.abs(diff) > 0.01) {
                animProgress[i] += diff * 0.06; // sweep speed
                needsUpdate = true;
            } else {
                animProgress[i] = animTarget[i];
            }
        }
        if (needsUpdate) { render(); requestAnimationFrame(animate); } 
        else { isAnimating = false; }
    }

    const bindMouse = (ev1, ev2, ev3) => {
        window.addEventListener(ev1, e => { isDragging = true; lastMouseX = e.clientX || e.touches[0].clientX; lastMouseY = e.clientY || e.touches[0].clientY; });
        window.addEventListener(ev2, e => {
            if(isDragging) {
                const cx = e.clientX || e.touches[0].clientX, cy = e.clientY || e.touches[0].clientY;
                viewAngleY -= (cx - lastMouseX) * 0.01; viewAngleX -= (cy - lastMouseY) * 0.01;
                viewAngleX = Math.max(-Math.PI/2, Math.min(Math.PI/2, viewAngleX));
                lastMouseX = cx; lastMouseY = cy; render();
            }
        });
        window.addEventListener(ev3, () => { isDragging = false; });
    };
    bindMouse('mousedown', 'mousemove', 'mouseup'); bindMouse('touchstart', 'touchmove', 'touchend');
    window.addEventListener('mouseleave', () => { isDragging = false; });

    function project(x, y, z) {
        let x1 = x * Math.cos(viewAngleY) - z * Math.sin(viewAngleY);
        let z1 = x * Math.sin(viewAngleY) + z * Math.cos(viewAngleY);
        let y1 = y * Math.cos(viewAngleX) - z1 * Math.sin(viewAngleX);
        let z2 = y * Math.sin(viewAngleX) + z1 * Math.cos(viewAngleX);
        return { x: x1, y: -y1, z: z2 };
    }

    const svg = document.getElementById('canvas');
    // The view is centered on the midpoint between the camera and its target, so both stay in frame.
    let viewW = 30, viewH = 30;
    function resize() {
        const aspect = svg.clientWidth / svg.clientHeight;
        viewH = 27;
        viewW = viewH * aspect;
        render();
    }
    function centerView() {
        const m = project((camPos.x + targetPos.x) / 2, (camPos.y + targetPos.y) / 2, (camPos.z + targetPos.z) / 2);
        svg.setAttribute('viewBox', `${m.x - viewW / 2} ${m.y - viewH / 2} ${viewW} ${viewH}`);
    }
    window.addEventListener('resize', resize);

    // --- Vector Math ---
    function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
    function add(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
    function scale(v, s) { return { x: v.x*s, y: v.y*s, z: v.z*s }; }
    function dot(a, b) { return a.x*b.x + a.y*b.y + a.z*b.z; }
    function normalize(v) { let len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z); return len > 0 ? { x: v.x/len, y: v.y/len, z: v.z/len } : {x:0, y:0, z:0}; }
    function cross(a, b) { return { x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x }; }
    
    // --- LookAt Calculations ---
    // Same camera as the other pipeline widgets (scene.js)
    const camPos = { x: SCENE.cam.E[0], y: SCENE.cam.E[1], z: SCENE.cam.E[2] };
    const targetPos = { x: SCENE.cam.C[0], y: SCENE.cam.C[1], z: SCENE.cam.C[2] };
    const worldUp = { x: 0, y: 1, z: 0 };

    const forward = normalize(sub(targetPos, camPos)); // Step 1
    const right = normalize(cross(forward, worldUp));  // Step 2
    const camUp = normalize(cross(right, forward));    // Step 3

    // Local Z for standard meshes looks down -Z, so LocalZ = -Forward
    const localZ = scale(forward, -1);

    // --- Geometry: the same house, pyramid and cube, at the same positions, as the other pipeline widgets (scene.js) ---
    const SCALE = 1;                                   // scene.js already uses this scene's scale

    const cameraVertices =[
        {x: -0.5, y: -0.4, z: -0.5}, {x: 0.5, y: -0.4, z: -0.5}, {x: 0.5, y: 0.4, z: -0.5}, {x: -0.5, y: 0.4, z: -0.5},
        {x: -0.5, y: -0.4, z: 0.5}, {x: 0.5, y: -0.4, z: 0.5}, {x: 0.5, y: 0.4, z: 0.5}, {x: -0.5, y: 0.4, z: 0.5},
        {x: -0.2, y: -0.2, z: -0.5}, {x: 0.2, y: -0.2, z: -0.5}, {x: 0.2, y: 0.2, z: -0.5}, {x: -0.2, y: 0.2, z: -0.5},
        {x: -0.4, y: -0.4, z: -1.0}, {x: 0.4, y: -0.4, z: -1.0}, {x: 0.4, y: 0.4, z: -1.0}, {x: -0.4, y: 0.4, z: -1.0}
    ];
    const cameraFaces = [[0, 1, 2, 3], [4, 5, 6, 7],[0, 4, 7, 3], [1, 5, 6, 2],[3, 2, 6, 7], [0, 1, 5, 4],[8, 9, 13, 12], [9, 10, 14, 13],[10, 11, 15, 14],[11, 8, 12, 15]];

    function applyTransform(v, tx, ty, tz, sx, sy, sz, rx, ry, rz) {
        let x = v.x * sx, y = v.y * sy, z = v.z * sz;
        let y1 = y * Math.cos(rx) - z * Math.sin(rx);
        let z1 = y * Math.sin(rx) + z * Math.cos(rx);
        let x2 = x * Math.cos(ry) - z1 * Math.sin(ry);
        let z2 = x * Math.sin(ry) + z1 * Math.cos(ry);
        let x3 = x2 * Math.cos(rz) - y1 * Math.sin(rz);
        let y3 = x2 * Math.sin(rz) + y1 * Math.cos(rz);
        return { x: x3 + tx, y: y3 + ty, z: z2 + tz };
    }

    // Mathematically orient camera vertices using our derived lookAt basis
    function applyCameraTransform(v) {
        let sx = 1.8, sy = 1.8, sz = 1.8;   // sized for the camera distance in scene.js
        let x = v.x * sx, y = v.y * sy, z = v.z * sz;
        
        // Transform vector into world space based on new orthonormal basis axes
        let rx = x * right.x + y * camUp.x + z * localZ.x;
        let ry = x * right.y + y * camUp.y + z * localZ.y;
        let rz = x * right.z + y * camUp.z + z * localZ.z;
        
        return { x: rx + camPos.x, y: ry + camPos.y, z: rz + camPos.z };
    }

    function getShadingColor(nx, ny, nz, type) {
        let lx = 0.5, ly = 0.8, lz = 0.5; 
        let llen = Math.sqrt(lx*lx + ly*ly + lz*lz);
        lx /= llen; ly /= llen; lz /= llen;
        let dot = Math.max(0.1, nx * lx + ny * ly + nz * lz);
        
        let r, g, b;
        if (type === 'cube') { r = Math.round(50 + 189 * dot); g = Math.round(20 + 48 * dot); b = Math.round(20 + 48 * dot); }
        else if (type === 'pyramid') { r = Math.round(20 + 14 * dot); g = Math.round(50 + 147 * dot); b = Math.round(20 + 74 * dot); }
        else if (type === 'dummy') { r = Math.round(26 + 139 * dot); g = Math.round(156 + 60 * dot); b = Math.round(199 + 44 * dot); }
        else if (type === 'camera') { r = Math.round(30 + 50 * dot); g = Math.round(30 + 50 * dot); b = Math.round(30 + 50 * dot); }
        return `rgb(${r}, ${g}, ${b})`;
    }

    const allFaces =[];
    const objType = { house: 'dummy', pyramid: 'pyramid', cube: 'cube' };   // keeps the original colours
    SCENE.models.forEach(m => {
        const M = TF.mul(TF.S(SCALE, SCALE, SCALE), m.M);               // object-to-world, then scale the scene
        m.mesh.f.forEach(f => allFaces.push({
            pts: f.map(i => { const p = TF.xf(M, m.mesh.v[i]); return { x: p[0], y: p[1], z: p[2] }; }),
            type: objType[m.name] }));
    });
    
    // Apply LookAt directly
    cameraFaces.forEach(f => allFaces.push({ pts: f.map(i => applyCameraTransform(cameraVertices[i])), type: 'camera' }));

    allFaces.forEach(f => {
        let v0 = f.pts[0], v1 = f.pts[1], v2 = f.pts[2];
        let ux = v1.x - v0.x, uy = v1.y - v0.y, uz = v1.z - v0.z;
        let vx = v2.x - v0.x, vy = v2.y - v0.y, vz = v2.z - v0.z;
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        let len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
        f.color = getShadingColor(nx/len, ny/len, nz/len, f.type);
    });

    function render() {
        centerView();
        const meshGroup = document.querySelector('.mesh-group');
        const axesGroup = document.querySelector('.axes-group');
        const gridGroup = document.querySelector('.grid-group');
        const vectorsGroup = document.querySelector('.vectors-group');
        
        meshGroup.innerHTML = '';
        axesGroup.innerHTML = '';
        gridGroup.innerHTML = '';
        vectorsGroup.innerHTML = '';

        // Draw Base Grid
        const gridLines =[];
        const gridSize = 10;
        const step = 2;
        for(let i = -gridSize; i <= gridSize; i+=step) {
            let p1 = project(i, 0, -gridSize), p2 = project(i, 0, gridSize);
            gridLines.push({p1, p2, z: (p1.z + p2.z)/2});
            let p3 = project(-gridSize, 0, i), p4 = project(gridSize, 0, i);
            gridLines.push({p1: p3, p2: p4, z: (p3.z + p4.z)/2});
        }
        gridLines.forEach(line => {
            const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
            el.setAttribute('x1', line.p1.x); el.setAttribute('y1', line.p1.y);
            el.setAttribute('x2', line.p2.x); el.setAttribute('y2', line.p2.y);
            el.setAttribute('stroke', 'var(--mafs-grid)');
            el.setAttribute('stroke-width', '0.04');
            gridGroup.appendChild(el);
        });

        // Calculate and sort geometry faces
        const renderData = allFaces.map(f => {
            const p2d = f.pts.map(p => project(p.x, p.y, p.z));
            const avgZ = p2d.reduce((sum, p) => sum + p.z, 0) / p2d.length;
            let cross = (p2d[1].x - p2d[0].x)*(p2d[2].y - p2d[0].y) - (p2d[1].y - p2d[0].y)*(p2d[2].x - p2d[0].x);
            let isBackfacing = (f.type === 'camera') ? false : cross > 0;   // scene meshes are all wound outward
            return { p2d, avgZ, color: f.color, type: f.type, isBackfacing };
        });

        renderData.sort((a, b) => a.avgZ - b.avgZ);

        renderData.forEach(data => {
            if (data.isBackfacing) return;
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('class', data.type === 'camera' ? 'face camera' : 'face');
            poly.setAttribute('points', data.p2d.map(p => `${p.x},${p.y}`).join(' '));
            poly.setAttribute('fill', data.color);
            if(data.type === 'camera' && state >= 1) poly.style.opacity = '0.4'; // Ghost camera to see vectors clearly
            meshGroup.appendChild(poly);
        });

        // Draw Axes
        const axScale = 5;
        const colors = { x: '#ef4444', y: '#22c55e', z: '#3b82f6' };
        const pts =[
            {v: {x:axScale, y:0, z:0}, l: 'x'}, {v: {x:0, y:axScale, z:0}, l: 'y'}, {v: {x:0, y:0, z:axScale}, l: 'z'}
        ];

        pts.forEach(p => {
            const origin = project(0,0,0);
            const target = project(p.v.x, p.v.y, p.v.z);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1', origin.x); line.setAttribute('y1', origin.y);
            line.setAttribute('x2', target.x); line.setAttribute('y2', target.y);
            line.setAttribute('stroke', colors[p.l]);
            line.setAttribute('stroke-width', '0.08');
            line.setAttribute('marker-end', `url(#arrow-${p.l})`);
            axesGroup.appendChild(line);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x', target.x + 0.3); text.setAttribute('y', target.y + 0.3);
            text.setAttribute('class', 'axis-label');
            text.setAttribute('style', `fill: ${colors[p.l]}`);
            text.textContent = p.l.toUpperCase();
            axesGroup.appendChild(text);
        });

        // Vectors Logic
        function drawVec(start, dir, len, color, name, opacity, isDashed = false) {
            if(opacity <= 0.01) return;
            const end = add(start, scale(dir, len));
            const p1 = project(start.x, start.y, start.z);
            const p2 = project(end.x, end.y, end.z);
            
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '0.12');
            line.setAttribute('opacity', opacity);
            if (isDashed) line.setAttribute('stroke-dasharray', '0.2,0.15');
            line.setAttribute('marker-end', `url(#arrow-${name.replace(/\s+/g, '')})`);
            vectorsGroup.appendChild(line);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            const lblOff = project(end.x + dir.x*0.4, end.y + dir.y*0.4, end.z + dir.z*0.4);
            text.setAttribute('x', lblOff.x); text.setAttribute('y', lblOff.y);
            text.setAttribute('class', 'axis-label');
            text.setAttribute('style', `fill: ${color}; font-size: 0.6px`);
            text.setAttribute('opacity', opacity);
            // labels use the post's symbols; `name` also selects the arrowhead marker
            const LBL = { 'forward': 'f (forward)', 'world up': 'U (world up)', 'right': 'r (right)', 'up': 'u (up)' };
            text.textContent = LBL[name] || name;
            vectorsGroup.appendChild(text);
        }

        function drawSweep(start, A, normal, radius, progress, color) {
            if (progress <= 0.01) return;
            // Calculate vector rotation around normal plane linearly
            let crossNA = cross(normal, A);
            
            // Assuming sweep maps up to 90deg exactly since these form an orthogonal basis via cross products
            // Forward x WorldUp might not be 90, but Right x Forward definitely is.
            let maxSweepAngle = Math.PI / 2; 
            if(color === '#ef4444') { // First sweep: Forward to WorldUp isn't always 90
                let val = Math.max(-1, Math.min(1, dot(A, worldUp)));
                maxSweepAngle = Math.acos(val);
            }
            let currentAngle = maxSweepAngle * progress;

            let pts = [project(start.x, start.y, start.z)];
            let steps = 20;
            for(let i=0; i<=steps; i++) {
                let phi = currentAngle * (i / steps);
                // V(phi) = A*cos(phi) + (Normal x A)*sin(phi) -> accurately sweeps in orthogonal arc
                let vx = A.x * Math.cos(phi) + crossNA.x * Math.sin(phi);
                let vy = A.y * Math.cos(phi) + crossNA.y * Math.sin(phi);
                let vz = A.z * Math.cos(phi) + crossNA.z * Math.sin(phi);

                let p3d = { x: start.x + vx * radius, y: start.y + vy * radius, z: start.z + vz * radius };
                pts.push(project(p3d.x, p3d.y, p3d.z));
            }

            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
            poly.setAttribute('fill', color);
            poly.setAttribute('opacity', 0.25);
            vectorsGroup.appendChild(poly);

            pts.shift(); // remove center
            const path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            path.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', '0.04');
            path.setAttribute('stroke-dasharray', '0.2,0.1');
            path.setAttribute('opacity', 0.8);
            vectorsGroup.appendChild(path);
        }

        // Target Line Intent
        if (animProgress[1] > 0.01) {
            const p1 = project(camPos.x, camPos.y, camPos.z);
            const p2 = project(targetPos.x, targetPos.y, targetPos.z);
            const targetLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            targetLine.setAttribute('x1', p1.x); targetLine.setAttribute('y1', p1.y);
            targetLine.setAttribute('x2', p2.x); targetLine.setAttribute('y2', p2.y);
            targetLine.setAttribute('stroke', '#3b82f6');
            targetLine.setAttribute('stroke-width', '0.04');
            targetLine.setAttribute('stroke-dasharray', '0.2,0.2');
            targetLine.setAttribute('opacity', animProgress[1] * 0.4);
            vectorsGroup.appendChild(targetLine);
        }

        // 1. Forward Vector 
        drawVec(camPos, forward, 6 * animProgress[1], '#3b82f6', 'forward', animProgress[1]);
        
        // 2. Cross Product: Forward x World Up -> Right
        if (animProgress[2] > 0.01) {
            drawVec(camPos, worldUp, 6 * animProgress[2], '#a855f7', 'world up', animProgress[2], true);
            drawSweep(camPos, forward, right, 6, animProgress[2], '#ef4444');
            
            // Resultant Right vector length scales with sweep progress
            drawVec(camPos, right, 6 * animProgress[2], '#ef4444', 'right', animProgress[2]); 
        }

        // 3. Cross Product: Right x Forward -> Camera Up
        if (animProgress[3] > 0.01) {
            drawSweep(camPos, right, camUp, 6, animProgress[3], '#22c55e');
            
            // Resultant Up vector length scales with sweep progress
            drawVec(camPos, camUp, 6 * animProgress[3], '#22c55e', 'up', animProgress[3]);
        }
    }

    setState(0);
    setTimeout(resize, 0);
</script>
</body>
</html>
