<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Space</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="row" id="ctrl"></div>
<div class="stage"><div class="pane"><div class="readout" id="ro"></div><canvas id="cv"></canvas><div class="hint">Drag to rotate the view</div><div class="label" id="lab"></div></div></div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
const { models, cam } = SCENE;
let sel = 0, prev = 0, u = 1;                         // the selected model's axes cross-fade as u goes 0 -> 1
const hl = i => (i === sel ? u : 0) + (i === prev && prev !== sel ? 1 - u : 0);
const v = new TF.View($('cv'), { extent: 8.6, target: [-2, 3.2, 3.2], yaw: -0.6, pitch: 0.42, draw: dv => {
    dv.grid(7, 1, 0);
    dv.axes(TF.I(), 2.2, { faint: true });
    models.forEach((m, i) => {
        dv.mesh(m.world, m.name);
        const h = hl(i);
        if (h > 0.02) dv.axes(m.M, 0.9, { alpha: h });
    });
    SCENE.cameraLines(dv, cam.L.toWorld, C.fg, 1.2);
    dv.text(cam.E, 'camera', C.fg, { dy: -14 });
} });
TF.onTheme(() => v.render());
const cap = s => s[0].toUpperCase() + s.slice(1);
function readout() {
    const m = models[sel];
    $('lab').innerHTML = `${cap(m.name)} placed by its <i>M</i><sub>model</sub>`;
    $('ro').innerHTML = `<span>M<sub>model</sub> (${m.name}) = ${TF.matHTML(m.M, 4, 4, 2)}</span>`;
}
const anim = TF.animator(() => u, x => u = x, () => v.render(), 450);
TF.seg($('ctrl'), models.map(m => cap(m.name)), 0, i => { if (i === sel) return; prev = sel; sel = i; u = 0; readout(); anim(1); });
readout();
</script>
</body>
</html>
