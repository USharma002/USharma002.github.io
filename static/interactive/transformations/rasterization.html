<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasterization</title>
<style>
    :root { --mafs-bg: transparent; --mafs-fg: #000; --mafs-grid: rgba(0,0,0,0.15); --mafs-text: #333; }
    .theme-light { --mafs-fg: #000; --mafs-grid: rgba(0,0,0,0.15); --mafs-text: #333; }
    .theme-dark { --mafs-fg: #fff; --mafs-grid: rgba(255,255,255,0.2); --mafs-text: #eee; }
    body { margin: 0; overflow: hidden; background: var(--mafs-bg); font-family: system-ui, sans-serif; color: var(--mafs-text); display: flex; flex-direction: column; height: 100vh; }
    .controls { display: flex; justify-content: center; gap: 10px; padding: 15px; background: var(--mafs-bg); border-bottom: 1px solid var(--mafs-grid); }
    button { background: var(--mafs-bg); color: var(--mafs-fg); border: 1px solid var(--mafs-grid); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    button:hover { background: var(--mafs-grid); }
    button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .container { width: 100%; flex: 1; position: relative; }
    .label { position: absolute; bottom: 15px; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 16px; color: var(--mafs-fg); pointer-events: none; }
    svg { width: 100%; height: 100%; display: block; }
    .face { stroke: rgba(255,255,255,0.5); stroke-width: 0.002; stroke-linejoin: round; }
    text.axis-label { fill: var(--mafs-fg); font-size: 0.08px; font-style: italic; font-weight: bold; }
</style>
</head>
<body>
<div class="controls">
    <button onclick="setState(0)" id="btn-0" class="active">NDC Space</button>
    <button onclick="setState(1)" id="btn-1">Rasterize</button>
</div>
<div class="container">
    <svg id="canvas" preserveAspectRatio="xMidYMid slice">
        <defs>
            <marker id="arrow-x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
            <marker id="arrow-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
            <marker id="arrow-z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
        </defs>
        <g class="grid-group"></g>
        <g class="mesh-group"></g>
        <g class="axes-group"></g>
    </svg>
    <div class="label" id="status-label">NDC Space</div>
</div>
<script>
    function syncTheme() {
        try {
            const parent = window.parent.document.body;
            const isDark = parent.classList.contains('dark') || window.parent.document.documentElement.classList.contains('dark');
            document.documentElement.className = isDark ? 'theme-dark' : 'theme-light';
        } catch (e) {}
    }
    syncTheme(); setInterval(syncTheme, 1000);

    let animProgress = 0, animTarget = 0, isAnimating = false;
    const labels = ["NDC Space", "Rasterization (Z-Buffer)"];

    function setState(state) {
        document.querySelectorAll('button').forEach((b, i) => b.className = i === state ? 'active' : '');
        animTarget = state;
        document.getElementById('status-label').textContent = labels[state];
        if (!isAnimating) { isAnimating = true; requestAnimationFrame(animate); }
    }

    function animate() {
        let diff = animTarget - animProgress;
        if (Math.abs(diff) < 0.01) { animProgress = animTarget; isAnimating = false; }
        else { animProgress += diff * 0.06; requestAnimationFrame(animate); }
        renderAll();
    }

    let globalViewX = 30 * Math.PI / 180;
    let globalViewY = -45 * Math.PI / 180;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;

    const bindMouse = (ev1, ev2, ev3) => {
        window.addEventListener(ev1, e => { isDragging = true; let t = e.touches ? e.touches[0] : e; lastMouseX = t.clientX; lastMouseY = t.clientY; });
        window.addEventListener(ev2, e => {
            if (isDragging) {
                let t = e.touches ? e.touches[0] : e;
                globalViewY -= (t.clientX - lastMouseX) * 0.01;
                globalViewX -= (t.clientY - lastMouseY) * 0.01;
                globalViewX = Math.max(-Math.PI/2, Math.min(Math.PI/2, globalViewX));
                lastMouseX = t.clientX; lastMouseY = t.clientY; renderAll();
            }
        });
        window.addEventListener(ev3, () => { isDragging = false; });
    };
    bindMouse('mousedown', 'mousemove', 'mouseup');
    bindMouse('touchstart', 'touchmove', 'touchend');
    window.addEventListener('mouseleave', () => { isDragging = false; });

    function project(x, y, z) {
        let x1 = x * Math.cos(globalViewY) - z * Math.sin(globalViewY);
        let z1 = x * Math.sin(globalViewY) + z * Math.cos(globalViewY);
        let y1 = y * Math.cos(globalViewX) - z1 * Math.sin(globalViewX);
        let z2 = y * Math.sin(globalViewX) + z1 * Math.cos(globalViewX);
        return { x: x1, y: -y1, z: z2 };
    }

    // Scene geometry in actual NDC [-1,1]³
    const VS = 1;

    // Cube: centered, occupies most of the NDC box
    const cubeVertices = [{x:-0.6,y:-0.6,z:-0.6},{x:0.6,y:-0.6,z:-0.6},{x:0.6,y:0.6,z:-0.6},{x:-0.6,y:0.6,z:-0.6},
                          {x:-0.6,y:-0.6,z:0.6},{x:0.6,y:-0.6,z:0.6},{x:0.6,y:0.6,z:0.6},{x:-0.6,y:0.6,z:0.6}];
    const cubeFaces = [[4,5,6,7],[5,1,2,6],[1,0,3,2],[0,4,7,3],[7,6,2,3],[0,1,5,4]];

    // Pyramid: offset to the side, partially outside NDC
    const pyramidVertices = [{x:0.5,y:0.8,z:0},{x:0.9,y:-0.4,z:0.5},{x:0.1,y:-0.4,z:0.5},{x:0.1,y:-0.4,z:-0.5},{x:0.9,y:-0.4,z:-0.5}];
    const pyramidFaces = [[0,1,2],[0,2,3],[0,3,4],[0,4,1],[2,1,4,3]];

    // NDC box wireframe
    const ndcBoxVerts = [
        {x:-1,y:-1,z:-1},{x:1,y:-1,z:-1},{x:1,y:1,z:-1},{x:-1,y:1,z:-1},
        {x:-1,y:-1,z:1},{x:1,y:-1,z:1},{x:1,y:1,z:1},{x:-1,y:1,z:1}
    ];
    const ndcBoxEdges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

    function getShadingColor(nx, ny, nz, type) {
        let lx = 0.5, ly = 0.8, lz = 0.5;
        let llen = Math.sqrt(lx*lx + ly*ly + lz*lz);
        lx /= llen; ly /= llen; lz /= llen;
        let dot = Math.max(0.1, nx * lx + ny * ly + nz * lz);
        if (type === 'cube') return `rgb(${Math.round(50+(239-50)*dot)},${Math.round(20+(68-20)*dot)},${Math.round(20+(68-20)*dot)})`;
        if (type === 'pyramid') return `rgb(${Math.round(20+(34-20)*dot)},${Math.round(50+(197-50)*dot)},${Math.round(20+(94-20)*dot)})`;
        return `rgb(${Math.round(100*dot)},${Math.round(100*dot)},${Math.round(100*dot)})`;
    }

    function pointInTriangle(px, py, v0, v1, v2) {
        let dX = px - v2.x, dY = py - v2.y;
        let dX21 = v2.x - v1.x, dY12 = v1.y - v2.y;
        let D = dY12 * (v0.x - v2.x) + dX21 * (v0.y - v2.y);
        let s = dY12 * dX + dX21 * dY;
        let t = (v2.y - v0.y) * dX + (v0.x - v2.x) * dY;
        if (D < 0) return s <= 0 && t <= 0 && s + t >= D;
        return s >= 0 && t >= 0 && s + t <= D;
    }

    function getZ(px, py, v0, v1, v2) {
        let dX21 = v2.x - v1.x, dY12 = v1.y - v2.y;
        let D = dY12*(v0.x - v2.x) + dX21*(v0.y - v2.y);
        if (Math.abs(D) < 1e-6) return v0.z;
        let s = dY12*(px - v2.x) + dX21*(py - v2.y);
        let t = (v2.y - v0.y)*(px - v2.x) + (v0.x - v2.x)*(py - v2.y);
        return (s/D)*v0.z + (t/D)*v1.z + (1 - s/D - t/D)*v2.z;
    }

    const svg = document.getElementById('canvas');
    function resize() {
        const aspect = svg.clientWidth / svg.clientHeight;
        const height = 4; const width = height * aspect;
        svg.setAttribute('viewBox', `${-width/2} ${-height/2} ${width} ${height}`);
        renderAll();
    }
    window.addEventListener('resize', resize);

    function renderAll() {
        const meshGroup = svg.querySelector('.mesh-group');
        const axesGroup = svg.querySelector('.axes-group');
        const gridGroup = svg.querySelector('.grid-group');
        meshGroup.innerHTML = ''; axesGroup.innerHTML = ''; gridGroup.innerHTML = '';

        // Grid
        const gridSize = 2, step = 0.5;
        for (let i = -gridSize; i <= gridSize; i += step) {
            [[{x:i,y:0,z:-gridSize},{x:i,y:0,z:gridSize}],[{x:-gridSize,y:0,z:i},{x:gridSize,y:0,z:i}]].forEach(([a,b]) => {
                let p1 = project(a.x, a.y, a.z), p2 = project(b.x, b.y, b.z);
                let el = document.createElementNS("http://www.w3.org/2000/svg", "line");
                el.setAttribute('x1',p1.x); el.setAttribute('y1',p1.y); el.setAttribute('x2',p2.x); el.setAttribute('y2',p2.y);
                el.setAttribute('stroke','var(--mafs-grid)'); el.setAttribute('stroke-width','0.005');
                gridGroup.appendChild(el);
            });
        }

        let renderFaces = [];
        const rasterSub = Math.min(1, Math.max(0, animProgress));

        const allData = [
            { type: 'cube', v: cubeVertices, f: cubeFaces },
            { type: 'pyramid', v: pyramidVertices, f: pyramidFaces }
        ];

        // Scale vertices to visual space
        allData.forEach(obj => {
            obj.f.forEach(face => {
                let pts3d = face.map(i => ({
                    x: obj.v[i].x * VS,
                    y: obj.v[i].y * VS,
                    z: obj.v[i].z * VS
                }));

                let v0 = pts3d[0], v1 = pts3d[1], v2 = pts3d[2];
                let ux = v1.x-v0.x, uy = v1.y-v0.y, uz = v1.z-v0.z;
                let vx = v2.x-v0.x, vy = v2.y-v0.y, vz = v2.z-v0.z;
                let nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
                let len = Math.sqrt(nx*nx+ny*ny+nz*nz) || 1;
                let color = getShadingColor(nx/len, ny/len, nz/len, obj.type);

                let p2d = pts3d.map(p => project(p.x, p.y, p.z));
                let avgZ = p2d.reduce((s,p) => s+p.z, 0) / p2d.length;

                renderFaces.push({ pts3d, p2d, avgZ, color, isBackfacing: false, type: obj.type, opacity: 1.0 });
            });
        });

        // NDC box wireframe faces (semi-transparent)
        const ndcFaces = [[0,1,2,3],[4,5,6,7],[0,4,7,3],[1,5,6,2],[3,2,6,7],[0,1,5,4]];
        ndcFaces.forEach(face => {
            let pts3d = face.map(i => ({ x: ndcBoxVerts[i].x*VS, y: ndcBoxVerts[i].y*VS, z: ndcBoxVerts[i].z*VS }));
            let p2d = pts3d.map(p => project(p.x, p.y, p.z));
            let avgZ = p2d.reduce((s,p) => s+p.z, 0) / p2d.length;
            renderFaces.push({ pts3d, p2d, avgZ, color: 'rgba(245, 158, 11, 0.08)', isBackfacing: false, type: 'ndcbox', opacity: 0.5 });
        });

        // ==========================================
        // RASTERIZATION ENGINE
        // ==========================================
        const W = 40, H = 30;
        const sW = VS, sH = VS;

        if (rasterSub > 0.01) {
            let framebuffer = new Array(W*H).fill(null);
            let zbuffer = new Array(W*H).fill(Infinity);

            // OpenGL NDC uses near = -1 and far = +1, so the smaller z value is closer.
            renderFaces.forEach(f => {
                if (f.type === 'ndcbox' || f.type === 'screen' || f.isBackfacing) return;
                for (let i = 1; i < f.pts3d.length - 1; i++) {
                    let p0 = f.pts3d[0], p1 = f.pts3d[i], p2 = f.pts3d[i+1];
                    if (!p0 || !p1 || !p2) continue;
                    let toGX = x => Math.floor(((x + sW) / (2*sW)) * W);
                    let toGY = y => Math.floor(((y + sH) / (2*sH)) * H);
                    let minX = Math.max(0, Math.min(W-1, toGX(Math.min(p0.x,p1.x,p2.x))));
                    let maxX = Math.max(0, Math.min(W-1, toGX(Math.max(p0.x,p1.x,p2.x))));
                    let minY = Math.max(0, Math.min(H-1, toGY(Math.min(p0.y,p1.y,p2.y))));
                    let maxY = Math.max(0, Math.min(H-1, toGY(Math.max(p0.y,p1.y,p2.y))));
                    for (let y = minY; y <= maxY; y++) {
                        for (let x = minX; x <= maxX; x++) {
                            let px = (x/W)*2*sW - sW + (sW/W);
                            let py = (y/H)*2*sH - sH + (sH/H);
                            if (pointInTriangle(px, py, p0, p1, p2)) {
                                let pz = getZ(px, py, p0, p1, p2);
                                if (pz < zbuffer[y*W+x]) {
                                    zbuffer[y*W+x] = pz;
                                    framebuffer[y*W+x] = f.color;
                                }
                            }
                        }
                    }
                }
            });

            // Draw the viewport framebuffer as pixels.
            let activePixels = Math.floor(rasterSub * W * H);
            let half_dw = sW/W, half_dh = sH/H;
            let pz_screen = -VS - 0.08;
            let pz_screen_bg = -VS - 0.09;

            // Viewport background
            let screenPoly = [
                {x:-sW, y:-sH, z:pz_screen_bg}, {x:sW, y:-sH, z:pz_screen_bg},
                {x:sW, y:sH, z:pz_screen_bg}, {x:-sW, y:sH, z:pz_screen_bg}
            ];
            let p2d_s = screenPoly.map(p => project(p.x, p.y, p.z));
            renderFaces.push({ p2d: p2d_s, avgZ: p2d_s.reduce((s,p)=>s+p.z,0)/4, color: 'rgba(59,130,246,0.05)', isBackfacing: false, type: 'screen', opacity: 1.0, renderLayer: 1 });

            for (let i = 0; i < activePixels; i++) {
                let px_idx = i % W, py_idx = Math.floor(i / W);
                let px = (px_idx/W)*2*sW - sW + half_dw;
                let py = (py_idx/H)*2*sH - sH + half_dh;
                let isHit = framebuffer[i] !== null;
                let color = isHit ? framebuffer[i] : 'rgba(148,163,184,0.10)';
                let padW = half_dw * 0.95, padH = half_dh * 0.95;
                let pts3d = [
                    {x:px-padW, y:py-padH, z:pz_screen}, {x:px+padW, y:py-padH, z:pz_screen},
                    {x:px+padW, y:py+padH, z:pz_screen}, {x:px-padW, y:py+padH, z:pz_screen}
                ];
                let p2d = pts3d.map(p => project(p.x, p.y, p.z));
                let avgZ = p2d.reduce((s,p)=>s+p.z,0)/4;
                renderFaces.push({ p2d, avgZ, color, isBackfacing: false, type: 'pixel', opacity: 1.0, renderLayer: 2 });
            }
        }

        // Sort & render
        renderFaces.sort((a, b) => {
            const layerA = a.renderLayer || 0;
            const layerB = b.renderLayer || 0;
            if (layerA !== layerB) return layerA - layerB;
            return a.avgZ - b.avgZ;
        });
        renderFaces.forEach(data => {
            if (data.isBackfacing) return;
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            if (data.type === 'ndcbox') {
                poly.setAttribute('class', 'face');
                poly.setAttribute('stroke', 'rgba(245,158,11,0.4)');
                poly.setAttribute('stroke-width', '0.005');
            } else if (data.type === 'pixel') {
                poly.setAttribute('stroke', 'rgba(255,255,255,0.1)');
                poly.setAttribute('stroke-width', '0.002');
            } else {
                poly.setAttribute('class', 'face');
            }
            poly.setAttribute('points', data.p2d.map(p => `${p.x},${p.y}`).join(' '));
            poly.setAttribute('fill', data.color);
            if (data.opacity < 1.0) poly.style.opacity = data.opacity;
            meshGroup.appendChild(poly);
        });

        // NDC box edges
        ndcBoxEdges.forEach(([a,b]) => {
            let p1 = project(ndcBoxVerts[a].x*VS, ndcBoxVerts[a].y*VS, ndcBoxVerts[a].z*VS);
            let p2 = project(ndcBoxVerts[b].x*VS, ndcBoxVerts[b].y*VS, ndcBoxVerts[b].z*VS);
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
            line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
            line.setAttribute('stroke','rgba(245,158,11,0.6)'); line.setAttribute('stroke-width','0.008');
            line.setAttribute('stroke-dasharray','0.04 0.02');
            meshGroup.appendChild(line);
        });

        // Axes
        const axScale = 1.5;
        const colors = { x: '#ef4444', y: '#22c55e', z: '#3b82f6' };
        [{v:{x:axScale,y:0,z:0},l:'x'},{v:{x:0,y:axScale,z:0},l:'y'},{v:{x:0,y:0,z:axScale},l:'z'}].forEach(p => {
            let o = project(0,0,0), t = project(p.v.x, p.v.y, p.v.z);
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1',o.x); line.setAttribute('y1',o.y);
            line.setAttribute('x2',t.x); line.setAttribute('y2',t.y);
            line.setAttribute('stroke',colors[p.l]); line.setAttribute('stroke-width','0.015');
            line.setAttribute('marker-end',`url(#arrow-${p.l})`);
            axesGroup.appendChild(line);
            let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x',t.x+0.3); text.setAttribute('y',t.y+0.3);
            text.setAttribute('class','axis-label'); text.setAttribute('style',`fill:${colors[p.l]}`);
            text.textContent = p.l.toUpperCase();
            axesGroup.appendChild(text);
        });
    }

    setTimeout(resize, 0);
</script>
</body>
</html>
