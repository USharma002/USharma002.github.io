<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Space</title>
<link rel="stylesheet" href="tf.css?v=4">
</head>
<body>
<div class="row" id="ctrl"></div>
<div class="stage"><div class="pane"><div class="readout" id="ro"></div><canvas id="cv"></canvas><div class="hint">Drag to rotate the view</div><div class="label" id="lab"></div></div></div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
const { models, cam } = SCENE;
const L = cam.L, E = cam.E;
// M_view = R^T T(-E): E is the camera position, R has the camera axes r, u, -f as columns.
const RT = [...L.view.slice(0, 3), 0, ...L.view.slice(4, 7), 0, ...L.view.slice(8, 11), 0, 0, 0, 0, 1];
// Axis and angle of R^T, so the rotation can be shown as R_A(e*theta) (Lengyel 4.22).
const ang = Math.acos(Math.max(-1, Math.min(1, (RT[0] + RT[5] + RT[10] - 1) / 2)));
const axis = TF.norm([RT[9] - RT[6], RT[2] - RT[8], RT[4] - RT[1]]);
function RA(th) {
    const c = Math.cos(th), s = Math.sin(th), [x, y, z] = axis, k = 1 - c;
    return [c + k * x * x, k * x * y - s * z, k * x * z + s * y, 0,
        k * x * y + s * z, c + k * y * y, k * y * z - s * x, 0,
        k * x * z - s * y, k * y * z + s * x, c + k * z * z, 0, 0, 0, 0, 1];
}
const stageM = (s, e = 1) => s === 0 ? TF.I() : s === 1 ? TF.T(-E[0] * e, -E[1] * e, -E[2] * e) : TF.mul(RA(ang * e), TF.T(-E[0], -E[1], -E[2]));
let step = 0, sc = 0;                                 // sc: continuous step in [0, 2]
const Mof = s => { if (s <= 0) return TF.I(); const [k, e] = TF.segOf(s, 2); return stageM(k + 1, e); };

// The view stays fixed while the scene moves, so the camera can be seen arriving at the origin.
const v = new TF.View($('cv'), { extent: 12.5, yaw: -0.6, pitch: 0.42, offY: 25, target: [0.5, 0, -2], draw: dv => {
    const M = Mof(sc), P = p => TF.xf(M, p);
    const done = sc > 1.97;                                  // camera axes have landed on x, y, z
    // fixed axes at the origin, drawn lighter: the camera's axes end up exactly on them
    if (!done) dv.axes(TF.I(), 2.6, { alpha: 0.4, names: ['x', 'y', 'z'] });
    if (sc < 0.97) dv.dot([0, 0, 0], C.fg, { r: 3, label: 'O' });
    dv.grid(7, 1, 0, M);                                     // the world grid moves with the scene
    dv.axes(M, 2.2, { faint: true, names: ['', '', ''] });   // world axes, carried along with the scene
    models.forEach(m => dv.mesh(TF.mapMesh(m.world, P), m.name));
    const camW = TF.mul(M, L.toWorld);
    SCENE.cameraLines(dv, camW, C.fg, 2.2);
    dv.axes(camW, 2.6, { names: done ? ['x = r', 'y = u', 'z = −f'] : ['r', 'u', '−f'] });   // the camera's own axes
    if (sc < 0.5) dv.dot(TF.xf(camW, [0, 0, 0]), C.fg, { label: 'E', r: 3 });   // the camera position, before it moves
    dv.line(TF.xf(camW, [0, 0, 0]), P(cam.C), TF.alpha(C.fg, 0.35), { dash: [4, 4] });
} });
TF.onTheme(() => v.render());

const labs = [
    'World space: the camera is at the point <i>E</i>',
    'Translated by −<i>E</i>: the camera is at the origin',
    'Rotated by <i>R</i><sup>T</sup>: camera space, looking down −<i>z</i>'];
function readout() {
    $('lab').innerHTML = labs[step];
    $('ro').innerHTML = `<span>E = ${TF.vecHTML(E)}</span><span>M<sub>view</sub> = R<sup>T</sup>T(−E) = ${TF.matHTML(L.view, 4, 4, 2)}</span>`;
}
const anim = TF.animator(() => sc, x => sc = x, () => v.render(), 900);
function go(s) { step = s; readout(); anim(s); }
TF.seg($('ctrl'), ['World space', 'Move camera to origin', 'Align camera axes'], 0, go);
readout();
// ?sc=<number> opens at that point of the animation (for checking intermediate frames)
{ const q = parseFloat(new URLSearchParams(location.search).get('sc')); if (isFinite(q)) { sc = q; v.render(); } }
</script>
</body>
</html>
