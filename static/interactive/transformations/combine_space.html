<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendering Pipeline</title>
<link rel="stylesheet" href="tf.css?v=4">
<style>
    #tbl { border-collapse: collapse; }
    #tbl td { padding: 0 8px; text-align: right; }
    #tbl td:first-child { text-align: left; font-family: system-ui, sans-serif; color: var(--muted); }
    #tbl tr.cur td { color: var(--hi); font-weight: 600; }
</style>
</head>
<body>
<div class="row" id="ctrl"></div>
<div class="stage"><div class="pane"><div class="readout"><table id="tbl"></table></div><canvas id="cv"></canvas><div class="hint" id="hint">Drag to rotate the view</div><div class="label" id="lab"></div></div></div>
<script src="tf.js?v=4"></script>
<script src="scene.js?v=4"></script>
<script>
const { $, C } = TF;
const { models, cam } = SCENE;
const VP = { X: 0, Y: 0, W: 640, H: 480, N: 0, F: 1 };
const e0 = 1 / Math.tan(cam.fov * TF.deg / 2), rr = cam.n / e0, tt = cam.a * cam.n / e0;
const Mf = TF.frustum(-rr, rr, -tt, tt, cam.n, cam.f);
const Mv = cam.L.view;
const model = models[0], Pobj = model.mesh.v[16];        // the top corner of the house's chimney
const Pw = TF.xf(model.M, Pobj), Pc = TF.xf(Mv, Pw), Pclip = TF.apply(Mf, Pc), Pn = TF.divide(Pclip);
const Pwin = [VP.W / 2 * Pn[0] + VP.X + VP.W / 2, VP.H / 2 * Pn[1] + VP.Y + VP.H / 2, (VP.F - VP.N) / 2 * Pn[2] + (VP.F + VP.N) / 2];
let step = 0, sc = 0, uo = [-0.6, 0.42];                // sc: continuous step in [0, 4]; uo: user orbit
// Rotation part R^T of M_view as an axis and angle, so it can be applied gradually (Lengyel 4.22).
const RT = [...Mv.slice(0, 3), 0, ...Mv.slice(4, 7), 0, ...Mv.slice(8, 11), 0, 0, 0, 0, 1];
const ang = Math.acos(Math.max(-1, Math.min(1, (RT[0] + RT[5] + RT[10] - 1) / 2)));
const axis = TF.norm([RT[9] - RT[6], RT[2] - RT[8], RT[4] - RT[1]]);
function RA(th) {
    const c = Math.cos(th), s = Math.sin(th), [x, y, z] = axis, k = 1 - c;
    return [c + k * x * x, k * x * y - s * z, k * x * z + s * y, 0, k * x * y + s * z, c + k * y * y, k * y * z - s * x, 0,
        k * x * z - s * y, k * y * z + s * x, c + k * z * z, 0, 0, 0, 0, 1];
}
const E = cam.E, lerp1 = (a, b, t) => a + (b - a) * t, lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
// Model transform of the house at progress e: scale, rotation angle and offset grow from the identity.
const houseM = e => TF.mul(TF.T(...TF.scl(model.t, e)), TF.Ry(model.r * e), TF.S(...model.s.map(x => lerp1(1, x, e))));
const WORLD = { extent: 8.6, target: [-2, 3.2, 3.2] };
const camTarget = M => TF.scl(TF.add(TF.xf(M, cam.C), TF.xf(M, E)), 0.5);
// Window rectangle on the canvas, and the view extent that makes the NDC square land on it.
const winScale = dv => Math.min((dv.W - 80) / VP.W, (dv.H - 70) / VP.H);
const winExtent = dv => 2 * Math.min(dv.W, dv.H) / (2.2 * VP.W * winScale(dv));

const v = new TF.View($('cv'), { yaw: uo[0], pitch: uo[1], offY: 25, onOrbit: (y, p) => { if (sc < 3) uo = [y, p]; }, draw: dv => {
    if (sc >= 4) return drawWindow(dv);
    const [k, e] = TF.segOf(sc, 4);
    dv.yaw = uo[0]; dv.pitch = uo[1]; dv.persp = 0.08;
    let M, Mh = model.M, fade = 1, camA = 1;
    if (k === 0) {                                   // object -> world: the house is placed, the rest fades in
        M = TF.I(); Mh = houseM(e); fade = e;
        dv.extent = lerp1(1.9, WORLD.extent, e); dv.target = lerp3([0, 0.2, 0], WORLD.target, e);
        if (e < 0.5) dv.grid(2, 0.5, -0.5); else dv.grid(7, 1, 0);
        dv.axes(Mh, 0.95, { alpha: 1 - 0.4 * e });   // the house's own axes
        if (e > 0.02) dv.axes(TF.I(), 2.2, { faint: true, alpha: 0.45 * e });
        camA = e;
    } else if (k === 1) {                            // world -> camera: T(-E), then R^T, applied gradually
        M = TF.mul(RA(ang * e), TF.T(...TF.scl(E, -e)));
        dv.extent = lerp1(WORLD.extent, 9.5, e); dv.target = lerp3(WORLD.target, camTarget(M), Math.min(1, e * 2));
        dv.grid(7, 1, 0, M);                        // the world grid moves with the scene
        dv.axes(TF.I(), lerp1(2.2, 2, e), { alpha: lerp1(0.45, 1, e) });
    } else if (k === 2) {                            // camera -> NDC: (1-e)I + e M_frustum, divide by w
        M = TF.mul(TF.lerp(TF.I(), TF.mul(TF.ZFLIP, Mf), e), Mv);   // NDC drawn left-handed, see tf.js
        dv.extent = lerp1(9.5, 1.9, e); dv.target = lerp3(camTarget(Mv), [0, 0, 0], e);
        dv.axes(e < 0.5 ? TF.I() : TF.ZFLIP, lerp1(2, 1.3, e));
        camA = Math.max(0, 1 - 2 * e);               // the camera point goes to infinity
    } else {                                         // NDC -> window: face the x-y plane, flatten z, scale y by H/W
        M = TF.mul(TF.S(1, lerp1(1, VP.H / VP.W, e), lerp1(1, 0.02, e)), TF.ZFLIP, Mf, Mv);
        dv.yaw = lerp1(uo[0], 0, e); dv.pitch = lerp1(uo[1], 0, e); dv.persp = lerp1(0.08, 0, e);
        dv.extent = lerp1(1.9, winExtent(dv), e); dv.target = [0, 0, 0];
        dv.axes(TF.ZFLIP, 1.3, { alpha: 1 - e });
        camA = 0;
    }
    const P = p => TF.xf(M, p);
    models.forEach(m => {
        const wm = m === model ? TF.mapMesh(m.mesh, p => TF.xf(Mh, p)) : m.world;
        const cm = TF.mapMesh(wm, p => TF.xf(Mv, p));             // camera space, for shading after the view transform
        const o = { fade: m === model ? 1 : fade, normals: k >= 2 ? cm : undefined };
        if (o.fade > 0.02) dv.mesh(TF.mapMesh(wm, P), m.name, o);
    });
    if (k > 0 || e > 0.02) {
        // view frustum, near to far plane
        const kk = cam.f / cam.n, a = k === 0 ? e : 1;
        const fr = [[-rr, -tt, -cam.n], [rr, -tt, -cam.n], [rr, tt, -cam.n], [-rr, tt, -cam.n], [-rr * kk, -tt * kk, -cam.f], [rr * kk, -tt * kk, -cam.f], [rr * kk, tt * kk, -cam.f], [-rr * kk, tt * kk, -cam.f]];
        dv.glass(fr.map(p => P(TF.xf(cam.L.toWorld, p))), { alpha: a, fill: k < 2 ? 0.25 : 1 });
        if (camA > 0.02) SCENE.cameraLines(dv, TF.mul(M, cam.L.toWorld), TF.alpha(C.fg, camA), 1.2);
    }
    dv.dot(P(TF.xf(Mh, Pobj)), C.hi, { label: 'P' });
} });
function drawWindow(dv) {
    const s = winScale(dv);
    const items = models.map(m => ({ m: TF.mapMesh(m.world, p => TF.xf(Mv, p)), type: m.name }));
    const { X, Y } = dv.image(items, Mf, VP.H / VP.W, { scale: VP.W * s / 2 });
    const c = dv.ctx, x = X(Pn[0]), y = Y(Pn[1]);
    c.beginPath(); c.arc(x, y, 4, 0, 7); c.fillStyle = C.hi; c.fill();
    c.font = '12px "Source Code Pro", monospace'; c.fillStyle = C.muted; c.textAlign = 'center';
    c.fillText('(0, 0)', X(-1), Y(-1) + 14); c.fillText(`(${VP.W}, ${VP.H})`, X(1), Y(1) - 8);
}
TF.onTheme(() => v.render());

const labs = [
    'Object space',
    'World space: <i>M</i><sub>model</sub><i>P</i>',
    'Camera space: <i>M</i><sub>view</sub><i>M</i><sub>model</sub><i>P</i>',
    'NDC: <i>M</i><sub>frustum</sub>, then ÷<i>w</i> (left-handed, +<i>z</i> into the screen)',
    `Window space: viewport ${VP.W} × ${VP.H}`];
function readout() {
    const rows = [['object', [...Pobj, 1]], ['world', [...Pw, 1]], ['camera', [...Pc, 1]], ['clip', Pclip], ['NDC', Pn], ['window', Pwin]];
    const cur = [[0], [1], [2], [3, 4], [5]][step];
    $('tbl').innerHTML = rows.map((r, i) => `<tr class="${cur.includes(i) ? 'cur' : ''}"><td>${r[0]}</td>${r[1].map(x => `<td>${TF.num(x, 3)}</td>`).join('')}</tr>`).join('');
    $('lab').innerHTML = labs[step];
    $('hint').style.display = step === 4 ? 'none' : '';
    v.cv.classList.toggle('flat', step === 4);
}
const anim = TF.animator(() => sc, x => sc = x, () => v.render(), 900);
TF.seg($('ctrl'), ['Object space', 'World space', 'Camera space', 'NDC', 'Window space'], 0, s => { step = s; readout(); anim(s); });
readout();
// ?sc=<number> opens at that point of the animation (for checking intermediate frames)
{ const q = parseFloat(new URLSearchParams(location.search).get('sc')); if (isFinite(q)) { sc = q; v.render(); } }
</script>
</body>
</html>
