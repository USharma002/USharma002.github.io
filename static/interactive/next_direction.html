<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sampling the next direction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; user-select: none; margin-top: 4px; }
  svg text { font-family: var(--serif); font-size: 13px; }
  svg .t { font-size: 14px; }
  svg .m { font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div class="row">
  <div class="grp">material <div class="seg" id="mat"><button data-v="diffuse" class="on">diffuse</button><button data-v="glossy">glossy</button></div></div>
  <button id="again">resample</button>
</div>
<svg id="svg" viewBox="0 0 760 222"></svg>
<div class="hint">Blue: how much light the material sends to the camera from each direction, <i>f</i><sub>r</sub> cos <i>θ</i>. Orange rays found a light (fainter where the material reflects little of it), grey rays found nothing. Noise is the relative standard error of a one-sample estimate, computed exactly.</div>
<script src="/interactive/pt/embed.js"></script>
<script>
// 2D cross-section of the reflection integral at one shading point:
//   L_r = ∫ f_r(θ) L_i(θ) cos θ dθ  over θ in (−π/2, π/2), θ measured from the normal.
// Two lights: a small bright one and a large dim one. The BSDF is either Lambertian or a glossy lobe.
// The same 16-sample experiment is shown for three sampling densities side by side. For each density p(θ)
// the variance of one sample, ∫ (f L cos)² / p dθ − L_r², is computed by quadrature.
const svg = document.getElementById('svg');
const D = Math.PI / 180, NS = 16, Q = 4000;
const LIGHTS = [{ c: -38 * D, w: 4 * D, L: 12 }, { c: 42 * D, w: 13 * D, L: 1.6 }];
const IN = -55 * D;                                  // direction the camera ray came from
const STR = [['uniform', 'uniform directions'], ['light', 'sample the lights (NEE)'], ['bsdf', 'sample the BSDF']];
let mat = 'diffuse', smp = {};

const Li = t => { for (const l of LIGHTS) if (Math.abs(t - l.c) <= l.w) return l.L; return 0; };
const lobeN = (() => { let s = 0; for (let i = 0; i < Q; i++) { const t = -Math.PI / 2 + Math.PI * (i + 0.5) / Q; s += Math.max(0, Math.cos(t + IN)) ** 40 * Math.PI / Q; } return s; })();
const fr = t => mat === 'diffuse' ? 0.5 / 2 : 0.85 * Math.max(0, Math.cos(t + IN)) ** 40 / lobeN / Math.max(0.05, Math.cos(t));   // glossy lobe about the mirror direction −IN
const integrand = t => fr(t) * Li(t) * Math.cos(t);
const lightPow = LIGHTS.map(l => l.L * 2 * l.w), lightSum = lightPow.reduce((a, b) => a + b, 0);
let bTab = null;                                     // tabulated BSDF·cos density for the current material
function buildB() {
  const w = []; let s = 0;
  for (let i = 0; i < Q; i++) { const t = -Math.PI / 2 + Math.PI * (i + 0.5) / Q, v = fr(t) * Math.cos(t); w.push(v); s += v; }
  bTab = { w, s, max: Math.max(...w), cdf: w.reduce((a, v, i) => (a.push((i ? a[i - 1] : 0) + v), a), []) };
}
function pdf(t, s) {
  if (s === 'uniform') return 1 / Math.PI;
  if (s === 'light') { let p = 0; LIGHTS.forEach((l, i) => { if (Math.abs(t - l.c) <= l.w) p += lightPow[i] / lightSum / (2 * l.w); }); return p; }
  const i = Math.min(Q - 1, Math.max(0, Math.floor((t + Math.PI / 2) / Math.PI * Q))); return bTab.w[i] / bTab.s * Q / Math.PI;
}
function sample(s) {
  if (s === 'uniform') return -Math.PI / 2 + Math.PI * Math.random();
  if (s === 'light') { let u = Math.random() * lightSum, i = 0; while (u > lightPow[i]) u -= lightPow[i++]; const l = LIGHTS[i]; return l.c + (2 * Math.random() - 1) * l.w; }
  const u = Math.random() * bTab.s; let lo = 0, hi = Q - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (bTab.cdf[m] >= u) hi = m; else lo = m + 1; }
  return -Math.PI / 2 + Math.PI * (lo + Math.random()) / Q;
}
function noise(s) {                                  // relative standard error of one sample
  let I = 0, m2 = 0;
  for (let i = 0; i < Q; i++) {
    const t = -Math.PI / 2 + Math.PI * (i + 0.5) / Q, g = integrand(t), p = pdf(t, s), dt = Math.PI / Q;
    I += g * dt; if (p > 0) m2 += g * g / p * dt;
  }
  return Math.sqrt(Math.max(0, m2 - I * I)) / I;
}
function resample() { for (const [s] of STR) smp[s] = Array.from({ length: NS }, () => sample(s)); draw(); }
function el(tag, a, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
const P = (r, t, cx, cy) => [cx + r * Math.sin(t), cy - r * Math.cos(t)];
function draw() {
  const c = PT.c, cy = 150, R = 96;
  svg.textContent = '';
  const ns = STR.map(([s]) => noise(s)), nmax = Math.max(...ns), best = ns.indexOf(Math.min(...ns));
  STR.forEach(([s, name], k) => {
    const cx = 127 + k * 253;
    el('text', { x: cx, y: 16, 'text-anchor': 'middle', class: 't', fill: c.text, 'font-weight': k === best ? 700 : 300 }, name);
    // material lobe f_r cos θ, scaled to its own maximum
    let d = '';
    for (let i = 0; i <= 180; i++) { const t = -Math.PI / 2 + Math.PI * i / 180, [x, y] = P(R * 0.62 * fr(t) * Math.cos(t) / bTab.max, t, cx, cy); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); }
    el('path', { d: d + 'Z', fill: PT.alpha(c.accent2, 0.16), stroke: c.accent2, 'stroke-width': 1.2 });
    // sampled directions
    let hits = 0;
    smp[s].forEach(t => {
      const [x, y] = P(R, t, cx, cy), hit = Li(t) > 0;
      if (hit) { hits++; el('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: c.accent, 'stroke-width': 1.6, opacity: (0.22 + 0.78 * fr(t) * Math.cos(t) / bTab.max).toFixed(2) }); }
      else el('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: c.muted, 'stroke-width': 0.8, opacity: 0.55 });
    });
    // surface, camera ray, lights
    el('line', { x1: cx - R - 14, y1: cy, x2: cx + R + 14, y2: cy, stroke: c.text, 'stroke-width': 2, 'stroke-linecap': 'round' });
    const [ix, iy] = P(R * 0.98, IN, cx, cy);
    el('line', { x1: ix, y1: iy, x2: cx, y2: cy, stroke: c.text, 'stroke-width': 1.4, 'stroke-dasharray': '6 4' });
    LIGHTS.forEach(l => {
      const [x0, y0] = P(R + 6, l.c - l.w, cx, cy), [x1, y1] = P(R + 6, l.c + l.w, cx, cy);
      el('path', { d: `M${x0},${y0} A${R + 6},${R + 6} 0 0 1 ${x1},${y1}`, fill: 'none', stroke: c.accent, 'stroke-width': l.L > 5 ? 7 : 3.5 });
    });
    el('circle', { cx, cy, r: 3, fill: c.text });
    if (k === 0) {
      const a = P(R + 32, LIGHTS[0].c, cx, cy), b = P(R + 32, LIGHTS[1].c, cx, cy);
      el('text', { x: a[0] - 4, y: a[1] + 2, 'text-anchor': 'middle', fill: c.accent }, 'small, bright');
      el('text', { x: b[0] + 8, y: b[1] + 2, 'text-anchor': 'middle', fill: c.accent }, 'large, dim');
      el('text', { x: ix - 12, y: iy - 7, 'text-anchor': 'middle', fill: c.muted }, 'camera');
    }
    // result: how many samples found light, and the noise as a bar
    el('text', { x: cx, y: cy + 24, 'text-anchor': 'middle', fill: c.muted }, `${hits} of ${NS} samples find light`);
    const bw = 110, bx = cx - 62, by = cy + 40;
    el('text', { x: bx - 6, y: by + 8, 'text-anchor': 'end', fill: c.muted }, 'noise');
    el('rect', { x: bx, y: by, width: bw, height: 9, fill: c.faint });
    el('rect', { x: bx, y: by, width: Math.max(1.5, bw * ns[k] / nmax), height: 9, fill: k === best ? c.c3 : c.muted });
    el('text', { x: bx + bw + 8, y: by + 9, class: 'm', fill: c.text }, ns[k].toFixed(2));
  });
}
document.querySelectorAll('#mat button').forEach(b => b.onclick = () => {
  mat = b.dataset.v; document.querySelectorAll('#mat button').forEach(x => x.classList.toggle('on', x === b)); buildB(); resample();
});
document.getElementById('again').onclick = resample;
{ const q = new URLSearchParams(location.search); if (q.get('mat') === 'glossy') { mat = 'glossy'; document.querySelectorAll('#mat button').forEach(x => x.classList.toggle('on', x.dataset.v === mat)); } }
PT.onTheme(draw);
buildB(); resample();
</script>
</body>
</html>
