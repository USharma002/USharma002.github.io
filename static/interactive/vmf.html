<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vMF Widget (Synced)</title>
    <style>
        body {
            margin: 0;
            background-color: #e0e4e8;
            font-family: 'Segoe UI', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #vmf-widget {
            width: 850px;
            height: 420px;
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: flex;
            overflow: hidden;
            border: 1px solid #333;
        }

        #sidebar {
            width: 170px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            z-index: 10;
        }

        h2 { 
            margin: 0 0 12px 0; 
            font-size: 1rem; 
            color: #ff9f1c;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #ff9f1c;
            padding-bottom: 6px;
            display: inline-block;
        }
        
        p { font-size: 0.7rem; color: #aaa; line-height: 1.5; margin-bottom: 10px; }

        #viz-container {
            flex-grow: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            background: #000;
        }

        #main-view-wrapper {
            flex: 1.3;
            position: relative;
            background: #252525;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            cursor: grab; /* Add cursor here since OrbitControls is gone */
        }
        #main-view-wrapper:active { cursor: grabbing; }
        
        #main-label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            pointer-events: none;
            color: #ff9f1c;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid rgba(255, 159, 28, 0.3);
            z-index: 5;
        }

        #grid-wrapper {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            align-content: center; 
        }

        .sub-plot {
            position: relative;
            background: #252525;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
            cursor: grab;
            width: 100%;
            aspect-ratio: 1 / 1; 
        }
        
        .sub-plot:active { cursor: grabbing; }
        
        .sub-label {
            position: absolute;
            bottom: 3px; left: 3px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 4px;
            border-radius: 3px;
            pointer-events: none;
            font-family: monospace;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #regen-btn {
            margin-top: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #ddd;
            border: 1px solid #444;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            font-weight: 600;
        }
        
        #regen-btn:hover {
            background: #ff9f1c;
            color: #111;
            border-color: #ff9f1c;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="vmf-widget">
        <div id="sidebar">
            <h2>vMF Mix</h2>
            <p><strong>Interactive Mixture</strong><br>Von Mises-Fisher distribution on sphere.</p>
            <p><strong>Main:</strong><br>Composite density.</p>
            <p><strong>Grid (3x2):</strong><br>6 Components.<br>Border Color = Weight.</p>
            <p style="color:#888; font-style:italic; margin-top:10px;">Drag <strong>any</strong> sphere to rotate all views synchronously.</p>
            <button id="regen-btn" onclick="window.location.reload()">Regenerate</button>
        </div>

        <div id="viz-container">
            <div id="main-view-wrapper">
                <div id="main-label">Mixture Model</div>
            </div>
            <div id="grid-wrapper"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        // Note: OrbitControls removed to ensure unified object rotation logic

        // --- CONFIG ---
        const N_COMPONENTS = 6; 

        function generateMixture() {
            const components = [];
            let totalWeight = 0;

            for (let i = 0; i < N_COMPONENTS; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = Math.sin(phi) * Math.cos(theta);
                const y = Math.sin(phi) * Math.sin(theta);
                const z = Math.cos(phi);
                
                const kappa = 5 + Math.random() * 45;
                const w = Math.random();
                totalWeight += w;

                components.push({
                    mu: new THREE.Vector3(x, y, z),
                    kappa: kappa,
                    weight: w
                });
            }

            components.forEach(c => c.weight /= totalWeight);
            return components;
        }

        const mixtureData = generateMixture();

        // --- SHADER ---
        const vertexShader = `
            varying vec3 vNormal;
            void main() {
                vNormal = normal; 
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec3 vNormal;
            
            #define MAX_COMPS 6
            uniform vec3 uMu[MAX_COMPS];
            uniform float uKappa[MAX_COMPS];
            uniform float uWeights[MAX_COMPS];
            uniform int uCount;
            uniform int uIsSingle;
            
            vec3 magmaMap(float t) {
                t = clamp(t, 0.0, 1.0);
                vec3 c0 = vec3(0.001, 0.001, 0.014); // Dark
                vec3 c1 = vec3(0.188, 0.043, 0.357); // Purple
                vec3 c2 = vec3(0.549, 0.094, 0.424); // Magenta
                vec3 c3 = vec3(0.988, 0.553, 0.255); // Orange
                vec3 c4 = vec3(0.996, 0.878, 0.545); // Yellow
                
                if (t < 0.25) return mix(c0, c1, t / 0.25);
                if (t < 0.50) return mix(c1, c2, (t - 0.25) / 0.25);
                if (t < 0.75) return mix(c2, c3, (t - 0.50) / 0.25);
                return mix(c3, c4, (t - 0.75) / 0.25);
            }

            void main() {
                vec3 n = normalize(vNormal);
                float val = 0.0;
                
                for(int i = 0; i < MAX_COMPS; i++) {
                    if(i >= uCount) break;
                    float dotProd = dot(n, uMu[i]);
                    float influence = exp(uKappa[i] * (dotProd - 1.0));
                    
                    if (uIsSingle == 1) val += influence;
                    else val += uWeights[i] * influence;
                }

                // Tone mapping
                float intensity = clamp(pow(val * 0.6, 0.45), 0.0, 1.0);
                vec3 color = magmaMap(intensity);
                
                vec3 lightDir = normalize(vec3(0.5, 1.0, 1.0));
                float diff = 0.4 + 0.6 * max(dot(n, lightDir), 0.0);
                
                gl_FragColor = vec4(color * diff, 1.0);
            }
        `;

        // --- SCENE CLASS ---
        class VMFScene {
            constructor(container, data, isMain = false, componentIndex = -1) {
                this.container = container;
                this.data = data;
                this.isMain = isMain;
                this.idx = componentIndex;
                this.init();
            }

            init() {
                this.scene = new THREE.Scene();
                
                // Ensure non-zero dims for initial calc
                const width = Math.max(10, this.container.clientWidth);
                const height = Math.max(10, this.container.clientHeight);

                const aspect = width / height;
                this.camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 100);
                this.camera.position.z = 2.9;

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.container.appendChild(this.renderer.domElement);

                // Uniform Data Setup
                const uMu = [], uKappa = [], uWeights = [];
                if (this.isMain) {
                    this.data.forEach(c => { uMu.push(c.mu); uKappa.push(c.kappa); uWeights.push(c.weight); });
                } else {
                    const c = this.data[this.idx];
                    uMu.push(c.mu); uKappa.push(c.kappa); uWeights.push(c.weight);
                    for(let k=1; k<N_COMPONENTS; k++) { uMu.push(new THREE.Vector3(0,1,0)); uKappa.push(1); uWeights.push(0); }
                }

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        uMu: { value: uMu },
                        uKappa: { value: uKappa },
                        uWeights: { value: uWeights },
                        uCount: { value: this.isMain ? N_COMPONENTS : 1 },
                        uIsSingle: { value: this.isMain ? 0 : 1 }
                    },
                    vertexShader, fragmentShader
                });

                const geometry = new THREE.SphereGeometry(1, 40, 40);
                this.sphere = new THREE.Mesh(geometry, material);
                this.scene.add(this.sphere);

                // Setup unified mouse rotation for ALL views (Main or Sub)
                this.setupMouseRotation();
                
                // Layout adjustment
                new ResizeObserver(() => this.handleResize()).observe(this.container);
            }

            setupMouseRotation() {
                let isDragging = false;
                let prev = { x: 0, y: 0 };
                
                const onDown = (e) => {
                    isDragging = true;
                    prev = { x: e.clientX, y: e.clientY };
                    this.container.style.cursor = 'grabbing';
                };
                
                const onMove = (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - prev.x;
                    const dy = e.clientY - prev.y;
                    
                    // Rotate this sphere
                    this.sphere.rotation.y += dx * 0.015;
                    this.sphere.rotation.x += dy * 0.015;
                    
                    // SYNC Logic:
                    // 1. Update all Grid Scenes
                    if (window.vmfScenes) {
                        window.vmfScenes.forEach(s => s.setRotation(this.sphere.rotation));
                    }
                    // 2. Update Main Scene (if this isn't the main scene)
                    if (window.mainScene && this !== window.mainScene) {
                        window.mainScene.setRotation(this.sphere.rotation);
                    }
                    
                    prev = { x: e.clientX, y: e.clientY };
                };
                
                const onUp = () => { isDragging = false; this.container.style.cursor = 'grab'; };

                this.renderer.domElement.addEventListener('mousedown', onDown);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }

            handleResize() {
                const w = this.container.clientWidth;
                const h = this.container.clientHeight;
                if(w > 0 && h > 0) {
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                }
            }

            render() {
                this.renderer.render(this.scene, this.camera);
            }
            
            setRotation(rot) {
                // Directly copy rotation from the source
                this.sphere.rotation.copy(rot);
            }
        }

        // --- APP INIT ---
        const mainWrapper = document.getElementById('main-view-wrapper');
        const gridWrapper = document.getElementById('grid-wrapper');
        const scenes = [];
        window.vmfScenes = scenes;

        const maxWeight = Math.max(...mixtureData.map(d => d.weight));

        // 1. DOM Gen
        const gridElements = mixtureData.map((comp, index) => {
            const div = document.createElement('div');
            div.className = 'sub-plot';
            
            const label = document.createElement('div');
            label.className = 'sub-label';
            label.innerHTML = `w:${comp.weight.toFixed(2)}`;
            div.appendChild(label);

            const normW = comp.weight / maxWeight;
            const col = `rgba(255, 159, 28, ${0.4 + normW * 0.6})`;
            div.style.border = `${1 + normW * 3}px solid ${col}`;
            
            gridWrapper.appendChild(div);
            return { div, comp, index };
        });

        // 2. Post-Layout Init
        setTimeout(() => {
            const mainPlot = new VMFScene(mainWrapper, mixtureData, true);
            window.mainScene = mainPlot;

            gridElements.forEach(item => {
                scenes.push(new VMFScene(item.div, mixtureData, false, item.index));
            });

            function animate() {
                requestAnimationFrame(animate);
                mainPlot.render();
                scenes.forEach(s => s.render());
            }
            animate();
            
        }, 0);

    </script>
</body>
</html>
