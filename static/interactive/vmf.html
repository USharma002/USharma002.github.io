<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>von Mises–Fisher mixture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; margin-top: 6px; }
  #main { width: 300px; height: 300px; cursor: grab; touch-action: none; }
  .cap { font-size: 13px; color: var(--muted); }
  table { border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 10px 3px 0; vertical-align: middle; }
  td canvas { width: 54px; height: 54px; cursor: grab; touch-action: none; }
  input[type=range] { width: 110px; }
  @media (max-width: 620px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="row">
  <div class="seg"><button id="rand">random directions</button><button id="reset">equal weights</button></div>
  <span class="hint">drag any sphere to rotate all of them</span>
</div>
<div class="wrap">
  <div><canvas id="main"></canvas><div class="cap" id="sum"></div></div>
  <table id="tab"></table>
</div>
<script src="/interactive/pt/embed.js"></script>
<script>
// Mixture V(ω) = Σ λ_k v(ω | μ_k, κ_k),  v = κ / (4π sinh κ) · exp(κ μ·ω).
// Each sphere is rendered per pixel on a 2D canvas (orthographic view of the unit sphere).
const K = 4;
let comps = [], rot = { a: 0.4, b: -0.3 };
const mainC = document.getElementById('main'), tab = document.getElementById('tab');
function randDir() { const z = 2 * Math.random() - 1, p = 2 * Math.PI * Math.random(), s = Math.sqrt(1 - z * z); return [s * Math.cos(p), s * Math.sin(p), z]; }
function init(randomOnly) {
  if (!randomOnly) comps = Array.from({ length: K }, (_, i) => ({ mu: randDir(), kappa: [6, 15, 40, 100][i], w: 1 }));
  else comps.forEach(c => c.mu = randDir());
}
// log-domain evaluation keeps large κ stable: v = κ/(2π(1−e^{−2κ})) · exp(κ(μ·ω − 1))
const vmf = (c, w) => c.kappa / (2 * Math.PI * (1 - Math.exp(-2 * c.kappa))) * Math.exp(c.kappa * (c.mu[0] * w[0] + c.mu[1] * w[1] + c.mu[2] * w[2] - 1));
function lambdas() { const s = comps.reduce((a, c) => a + c.w, 0) || 1; return comps.map(c => c.w / s); }

function hexRGB(h) { if (h.startsWith('rgb')) return h.match(/\d+/g).map(Number); const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function render(canvas, size, list, lam) {
  const ctx = PT.fit(canvas, size, size), dpr = canvas.width / size, S = canvas.width;
  const img = ctx.createImageData(S, S), D = img.data;
  const lo = hexRGB(PT.c.faint), mid = hexRGB(PT.c.accent2), hi = hexRGB(PT.c.accent), bg = hexRGB(PT.c.bg);
  const ca = Math.cos(rot.a), sa = Math.sin(rot.a), cb = Math.cos(rot.b), sb = Math.sin(rot.b);
  // peak value for colour scaling: the largest density over the sphere is attained near a lobe centre
  let peak = 0;
  for (const [i, c] of list.entries()) peak = Math.max(peak, lam[i] * vmf(c, c.mu) + list.reduce((s, d, j) => j === i ? s : s + lam[j] * vmf(d, c.mu), 0));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = (2 * (x + 0.5) / S - 1) * 1.04, v = (1 - 2 * (y + 0.5) / S) * 1.04, r2 = u * u + v * v, o = 4 * (y * S + x);
    if (r2 > 1) { D[o + 3] = 0; continue; }
    const z = Math.sqrt(1 - r2);
    // view-space normal (u, v, z) -> world: rotate by b about x, then by a about y
    const y1 = v * cb - z * sb, z1 = v * sb + z * cb;
    const w = [u * ca + z1 * sa, y1, -u * sa + z1 * ca];
    let val = 0; for (let i = 0; i < list.length; i++) val += lam[i] * vmf(list[i], w);
    const t = Math.pow(Math.min(1, val / peak), 0.3), sh = 0.55 + 0.45 * Math.max(0, 0.35 * u + 0.45 * v + 0.82 * z);
    let col;
    if (t < 0.5) { const s = t / 0.5; col = lo.map((l, k) => l + (mid[k] - l) * s); }
    else { const s = (t - 0.5) / 0.5; col = mid.map((m, k) => m + (hi[k] - m) * s); }
    const edge = Math.min(1, (1 - Math.sqrt(r2)) * S / 2);       // antialias the rim
    for (let k = 0; k < 3; k++) D[o + k] = col[k] * sh * edge + bg[k] * (1 - edge);
    D[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
let queued = false;
function drawAll() {
  if (queued) return; queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const lam = lambdas();
    render(mainC, 300, comps, lam);
    comps.forEach((c, i) => render(document.getElementById('c' + i), 54, [c], [1]));
    comps.forEach((c, i) => { document.getElementById('lv' + i).textContent = lam[i].toFixed(2); });
    document.getElementById('sum').textContent = `mixture of ${K} lobes, λ normalized to sum to 1`;
  });
}
function buildTable() {
  let h = '<tr><td></td><td class="muted">weight λ</td><td></td><td class="muted">concentration κ</td><td></td></tr>';
  comps.forEach((c, i) => {
    h += `<tr><td><canvas id="c${i}"></canvas></td>
      <td><input type="range" min="0" max="1" step="0.01" value="${c.w}" data-i="${i}" data-k="w"></td><td class="num" id="lv${i}"></td>
      <td><input type="range" min="0" max="2.3" step="0.01" value="${Math.log10(c.kappa)}" data-i="${i}" data-k="kappa"></td><td class="num" id="kv${i}">${c.kappa.toFixed(0)}</td></tr>`;
  });
  tab.innerHTML = h;
  tab.querySelectorAll('input').forEach(r => r.oninput = () => {
    const c = comps[+r.dataset.i];
    if (r.dataset.k === 'w') c.w = +r.value; else { c.kappa = 10 ** +r.value; document.getElementById('kv' + r.dataset.i).textContent = c.kappa.toFixed(c.kappa < 10 ? 1 : 0); }
    drawAll();
  });
  tab.querySelectorAll('canvas').forEach(dragTo);
}
function dragTo(el) {
  let p = null;
  el.addEventListener('pointerdown', e => { p = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
  el.addEventListener('pointermove', e => { if (!p) return; rot.a += (e.clientX - p[0]) * 0.012; rot.b = Math.max(-1.5, Math.min(1.5, rot.b + (e.clientY - p[1]) * 0.012)); p = [e.clientX, e.clientY]; drawAll(); });
  el.addEventListener('pointerup', () => { p = null; el.style.cursor = 'grab'; });
}
document.getElementById('rand').onclick = () => { init(true); drawAll(); };
document.getElementById('reset').onclick = () => { comps.forEach(c => c.w = 1); buildTable(); drawAll(); };
dragTo(mainC);
PT.onTheme(drawAll);
init(); buildTable(); drawAll();
</script>
</body>
</html>
