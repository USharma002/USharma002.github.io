<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Square-to-sphere mappings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  .panes { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); justify-content: center; gap: 28px; margin-top: 6px; }
  canvas { width: 100%; aspect-ratio: 1; touch-action: none; }
  #uv { cursor: crosshair; }
  #sph { cursor: grab; }
  .cap { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .def { font-family: var(--mono); font-size: 12.5px; margin: 6px 0 2px; }
</style>
</head>
<body>
<div class="seg" id="maps">
  <button data-m="cyl" class="on">cylindrical</button><button data-m="hemi">uniform hemisphere</button><button data-m="cos">cosine (concentric disk)</button><button data-m="latlong">lat-long</button><button data-m="octa">octahedral</button>
</div>
<div class="def" id="def"></div>
<div class="panes">
  <div><div class="cap">unit square (u, v), hover a cell</div><canvas id="uv"></canvas></div>
  <div><div class="cap">image on the sphere, drag to rotate</div><canvas id="sph"></canvas></div>
</div>
<div class="readout" id="readout"></div>
<script src="/interactive/pt/embed.js"></script>
<script>
// A sampler maps uniform (u,v) in [0,1]^2 to a direction ω. If (u,v) is uniform, the density of ω is
// p(ω) = 1 / |J|, where |J| = |∂ω/∂u × ∂ω/∂v| is the area stretch of the map (computed here by finite differences).
const PI = Math.PI;
const M = {
  cyl:    { def: 'z = 1 − 2v,  φ = 2πu,  ω = (√(1−z²) cos φ, √(1−z²) sin φ, z)        area preserving: |J| = 4π', f: (u, v) => { const z = 1 - 2 * v, r = Math.sqrt(Math.max(0, 1 - z * z)), p = 2 * PI * u; return [r * Math.cos(p), r * Math.sin(p), z]; } },
  hemi:   { def: 'cos θ = v,  φ = 2πu        area preserving on the hemisphere: |J| = 2π', f: (u, v) => { const z = v, r = Math.sqrt(Math.max(0, 1 - z * z)), p = 2 * PI * u; return [r * Math.cos(p), r * Math.sin(p), z]; } },
  cos:    { def: '(x, y) = concentric disk(u, v),  z = √(1 − x² − y²)        |J| = π / cos θ, so p(ω) = cos θ / π', f: (u, v) => {
            const a = 2 * u - 1, b = 2 * v - 1; let r, p;
            if (a === 0 && b === 0) { r = 0; p = 0; } else if (a * a > b * b) { r = a; p = PI / 4 * (b / a); } else { r = b; p = PI / 2 - PI / 4 * (a / b); }
            const x = r * Math.cos(p), y = r * Math.sin(p); return [x, y, Math.sqrt(Math.max(0, 1 - x * x - y * y))]; } },
  latlong:{ def: 'θ = πv,  φ = 2πu        |J| = 2π² sin θ: cells crowd together at the poles', f: (u, v) => { const t = PI * v, p = 2 * PI * u; return [Math.sin(t) * Math.cos(p), Math.sin(t) * Math.sin(p), Math.cos(t)]; } },
  octa:   { def: 'unfold the octahedron |x| + |y| + |z| = 1 onto the square, then normalize        |J| varies by about 2×', f: (u, v) => {
            let x = 2 * u - 1, y = 2 * v - 1, z = 1 - Math.abs(x) - Math.abs(y);
            if (z < 0) { const t = x; x = (1 - Math.abs(y)) * Math.sign(t || 1); y = (1 - Math.abs(t)) * Math.sign(y || 1); }
            const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; } }
};
const G = 16, uv = document.getElementById('uv'), sph = document.getElementById('sph'), out = document.getElementById('readout');
let key = 'cyl', hov = null, yaw = 0.7, pitch = 0.5, uctx, sctx, S;

function jac(f, u, v) {
  const e = 1e-4, cl = t => Math.min(1 - e, Math.max(e, t)); u = cl(u); v = cl(v);
  const a = f(u + e, v), b = f(u - e, v), c = f(u, v + e), d = f(u, v - e);
  const du = a.map((x, i) => (x - b[i]) / (2 * e)), dv = c.map((x, i) => (x - d[i]) / (2 * e));
  return Math.hypot(du[1] * dv[2] - du[2] * dv[1], du[2] * dv[0] - du[0] * dv[2], du[0] * dv[1] - du[1] * dv[0]);
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function cellColor(i, j, shade) {
  const c = PT.c, A = hexRGB(c.faint), B = hexRGB(c.accent2), t = (i + j) & 1 ? 0.55 : 0.12;
  const rgb = A.map((a, k) => (a + (B[k] - a) * t) * shade);
  return `rgb(${rgb.map(x => Math.max(0, Math.min(255, x | 0))).join(',')})`;
}
function layout() { S = uv.getBoundingClientRect().width; uctx = PT.fit(uv, S, S); sctx = PT.fit(sph, S, S); draw(); }
function draw() {
  if (!uctx) return;
  const c = PT.c, f = M[key].f, cw = S / G;
  document.getElementById('def').textContent = M[key].def;
  // square
  uctx.clearRect(0, 0, S, S);
  for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) { uctx.fillStyle = cellColor(i, j, 1); uctx.fillRect(i * cw, (G - 1 - j) * cw, cw + 0.5, cw + 0.5); }
  if (hov) { uctx.fillStyle = c.accent; uctx.fillRect(hov.i * cw, (G - 1 - hov.j) * cw, cw, cw); }
  uctx.strokeStyle = c.muted; uctx.strokeRect(0.5, 0.5, S - 1, S - 1);
  // sphere: project the image of every cell, painter-sorted
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), R = S * 0.36;
  const P = w => { const x1 = w[0] * cy - w[1] * sy, y1 = w[0] * sy + w[1] * cy, z = w[2];
    const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp; return [S / 2 + x1 * R, S / 2 - z2 * R, y2]; };
  sctx.clearRect(0, 0, S, S);
  sctx.strokeStyle = c.border; sctx.beginPath(); sctx.arc(S / 2, S / 2, R, 0, 2 * PI); sctx.stroke();
  const N = 3, faces = [];                                    // subdivide each cell so curved images stay smooth
  for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) {
    const u0 = (i + a / N) / G, v0 = (j + b / N) / G, d = 1 / (G * N);
    const q = [f(u0, v0), f(u0 + d, v0), f(u0 + d, v0 + d), f(u0, v0 + d)], p = q.map(P);
    const cx = q.reduce((s, w) => s.map((x, k) => x + w[k] / 4), [0, 0, 0]), l = Math.hypot(...cx) || 1;
    const nz = p.reduce((s, x) => s + x[2], 0) / 4;
    faces.push({ i, j, p, z: nz, shade: 0.75 + 0.25 * Math.max(0, -nz / l) });
  }
  faces.sort((a, b) => b.z - a.z);
  for (const F of faces) {
    sctx.fillStyle = hov && F.i === hov.i && F.j === hov.j ? c.accent : cellColor(F.i, F.j, F.shade);
    sctx.beginPath(); F.p.forEach(([x, y], k) => k ? sctx.lineTo(x, y) : sctx.moveTo(x, y)); sctx.closePath(); sctx.fill();
    sctx.strokeStyle = sctx.fillStyle; sctx.lineWidth = 0.6; sctx.stroke();
  }
  // world axes
  [[[1.25, 0, 0], 'x'], [[0, 1.25, 0], 'y'], [[0, 0, 1.25], 'z']].forEach(([w, n]) => {
    const o = P([0, 0, 0]), e = P(w); sctx.strokeStyle = c.muted; sctx.lineWidth = 1; sctx.beginPath(); sctx.moveTo(o[0], o[1]); sctx.lineTo(e[0], e[1]); sctx.stroke();
    sctx.fillStyle = c.muted; sctx.font = 'italic 13px Merriweather, serif'; sctx.fillText(n, e[0] + 4, e[1] + 4);
  });
  if (hov) {
    const w = f(hov.u, hov.v), J = jac(f, hov.u, hov.v);
    out.innerHTML = `<span class="k">(u, v) =</span> (${hov.u.toFixed(2)}, ${hov.v.toFixed(2)})&ensp;<span class="k">ω =</span> (${w.map(x => x.toFixed(2)).join(', ')})&ensp;<span class="k">|J| =</span> <span class="acc">${J.toFixed(3)}</span>&ensp;<span class="k">p(ω) = 1/|J| =</span> <span class="acc">${(1 / J).toFixed(4)}</span>`;
  } else out.innerHTML = '<span class="k">hover the square to read the area stretch |J| and the resulting density p(ω)</span>';
}
uv.addEventListener('pointermove', e => {
  const r = uv.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = 1 - (e.clientY - r.top) / r.height;
  if (u < 0 || u >= 1 || v < 0 || v >= 1) return;
  const i = Math.min(G - 1, u * G | 0), j = Math.min(G - 1, v * G | 0);
  hov = { i, j, u, v }; draw();
});
uv.addEventListener('pointerleave', () => { hov = null; draw(); });
let drag = null;
sph.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; sph.setPointerCapture(e.pointerId); });
sph.addEventListener('pointermove', e => { if (!drag) return; yaw += (e.clientX - drag[0]) * 0.01; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - drag[1]) * 0.01)); drag = [e.clientX, e.clientY]; draw(); });
sph.addEventListener('pointerup', () => drag = null);
document.querySelectorAll('#maps button').forEach(b => b.onclick = () => {
  key = b.dataset.m; document.querySelectorAll('#maps button').forEach(x => x.classList.toggle('on', x === b)); hov = null; draw();
});
PT.onTheme(draw);
new ResizeObserver(layout).observe(uv);
layout();
</script>
</body>
</html>
