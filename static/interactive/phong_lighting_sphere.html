<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg: #ffffff;
  --text: #374151;
  --text-sub: #6b7280;
  --accent: #f39c12;
  --border: #d1d5db;
}

html, body { 
  margin: 0; 
  padding: 0; 
  width: 100%; 
  height: 100%; 
  background: var(--bg); 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  color: var(--text); 
  overflow: hidden; /* Avoids unwanted scrollbars inside the iframe */
}

body { 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  box-sizing: border-box; 
  padding: 16px;
}

.shell {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-around; /* Spreads out perfectly to 100% width */
  width: 100%;
  height: 100%;
  gap: 20px;
  box-sizing: border-box;
}

.canvas-box {
  flex: 1 1 280px; /* Adapts to width */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  max-width: 420px; /* Keeps canvas from becoming pixelated/blurry */
  width: 100%;
}

canvas { 
  display: block; 
  width: 100%; 
  height: auto; 
  aspect-ratio: 420 / 360; 
  cursor: crosshair; 
  background: transparent; 
}

.hint { 
  font-size: 11.5px; 
  text-align: center; 
  color: var(--text-sub); 
  margin: 10px 0 0; 
}

.controls { 
  flex: 1 1 280px; 
  width: 100%; 
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.row { display: flex; align-items: center; gap: 8px; }
.row label { font-size: 13px; width: 85px; color: var(--text-sub); flex-shrink: 0; }
.row input[type=range] { flex: 1; margin: 0; cursor: pointer; }
.row .val { font-size: 13px; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

.toggle-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toggle-row label.head { font-size: 13px; width: 85px; color: var(--text-sub); flex-shrink: 0; }
.toggle-row label.opt { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; margin-right: 8px; }

/* Responsive break for small/mobile iframes */
@media (max-width: 640px) {
  html, body { overflow: hidden; height: 100%; }
  .shell { flex-direction: column; justify-content: center; flex-wrap: nowrap; gap: 10px; }
  .canvas-box { flex: 1 1 auto; min-height: 0; width: 100%; }
  canvas { max-width: 100%; max-height: 220px; height: auto; width: auto; margin: 0 auto; }
  .controls { flex: 0 0 auto; width: 100%; max-width: 320px; }
}
</style>
</head>
<body>

<div class="shell">
  <!-- Wrapped canvas and text together so they act as one flex block -->
  <div class="canvas-box">
    <canvas id="c" width="420" height="360"></canvas>
    <p class="hint">drag on sphere to move light</p>
  </div>

  <div class="controls">
    <div class="row">
      <label>Ambient (k&#8336;)</label>
      <input type="range" id="ka" min="0" max="0.5" step="0.01" value="0.08">
      <span class="val" id="ka-v">0.08</span>
    </div>
    <div class="row">
      <label>Diffuse (k&#8339;)</label>
      <input type="range" id="kd" min="0" max="1" step="0.01" value="0.72">
      <span class="val" id="kd-v">0.72</span>
    </div>
    <div class="row">
      <label>Specular (k&#8347;)</label>
      <input type="range" id="ks" min="0" max="1" step="0.01" value="0.55">
      <span class="val" id="ks-v">0.55</span>
    </div>
    <div class="row">
      <label>Shininess (&#945;)</label>
      <input type="range" id="alpha" min="1" max="256" step="1" value="48">
      <span class="val" id="alpha-v">48</span>
    </div>
    <div class="toggle-row">
      <label class="head">Model</label>
      <label class="opt"><input type="radio" name="mdl" value="phong" checked> Phong</label>
      <label class="opt"><input type="radio" name="mdl" value="blinn"> Blinn-Phong</label>
    </div>
  </div>
</div>

<script>
/* ── Theme detection ── */
function detectTheme(){
  try{
    const s=window.parent.document.body?getComputedStyle(window.parent.document.body):null;
    if(!s)return;
    const rgb=s.backgroundColor.match(/\d+/g);
    if(!rgb)return;
    const bright=(parseInt(rgb[0])*299+parseInt(rgb[1])*587+parseInt(rgb[2])*114)/1000;
    const dark=bright<128;
    const r=document.documentElement.style;
    r.setProperty('--bg',dark?'transparent':'transparent'); // Force transparent for iframes
    r.setProperty('--text',dark?'#e5e7eb':'#374151');
    r.setProperty('--text-sub',dark?'#9ca3af':'#6b7280');
    r.setProperty('--border',dark?'#444':'#d1d5db');
    draw();
  }catch(e){}
}
setInterval(detectTheme,1000);
detectTheme();

/* ── Vector helpers ── */
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vadd(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vsub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vscale(a,s){return[a[0]*s,a[1]*s,a[2]*s];}
function vnorm(a){const l=Math.sqrt(dot(a,a))||1e-9;return vscale(a,1/l);}

/* ── Canvas setup ── */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;
const CX=W/2, CY=H/2-10, R=130;

/* ── Light direction (unit vector toward light) ── */
let lightDir=vnorm([0.5,0.6,0.65]);

/* ── Material base color (blog's orange) ── */
const BASE=[0.9,0.35,0.18];

function draw(){
  const ka=+document.getElementById('ka').value;
  const kd=+document.getElementById('kd').value;
  const ks=+document.getElementById('ks').value;
  const al=+document.getElementById('alpha').value;
  const blinn=document.querySelector('input[name="mdl"]:checked').value==='blinn';
  const L=lightDir;
  const V=[0,0,1]; // view direction

  const img=ctx.createImageData(W,H);
  const d=img.data;

  for(let py=0;py<H;py++){
    for(let px=0;px<W;px++){
      const x=px-CX, y=CY-py;
      const r2=x*x+y*y;
      if(r2>R*R){continue;} // transparent

      const z=Math.sqrt(R*R-r2);
      const N=[x/R,y/R,z/R];
      const ndl=Math.max(0,dot(N,L));

      // Ambient
      const amb=vscale(BASE,ka);
      // Diffuse
      const dif=vscale(BASE,kd*ndl);
      // Specular
      let sp=0;
      if(ndl>0){
        if(blinn){
          const H_=vnorm(vadd(L,V));
          sp=Math.pow(Math.max(0,dot(N,H_)),al);
        }else{
          // r = 2(N·L)N - L
          const ref=vsub(vscale(N,2*ndl),L);
          sp=Math.pow(Math.max(0,dot(ref,V)),al);
        }
      }
      const spec=[ks*sp,ks*sp,ks*sp];

      let col=vadd(vadd(amb,dif),spec);
      // Gamma correction
      col=col.map(c=>Math.pow(Math.min(1,Math.max(0,c)),1/2.2));

      const i=(py*W+px)*4;
      d[i]=Math.round(col[0]*255);
      d[i+1]=Math.round(col[1]*255);
      d[i+2]=Math.round(col[2]*255);
      d[i+3]=255;
    }
  }

  ctx.clearRect(0,0,W,H);
  ctx.putImageData(img,0,0);

  // Light indicator — project onto sphere edge
  const lx=CX+lightDir[0]*R*1.18;
  const ly=CY-lightDir[1]*R*1.18;
  ctx.beginPath();
  ctx.arc(lx,ly,7,0,Math.PI*2);
  ctx.fillStyle='#f1c40f';
  ctx.fill();
  ctx.strokeStyle='#e67e22';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // Light direction line
  ctx.beginPath();
  ctx.moveTo(CX+lightDir[0]*R*0.98,CY-lightDir[1]*R*0.98);
  ctx.lineTo(lx,ly);
  ctx.strokeStyle='rgba(241,196,15,0.5)';
  ctx.lineWidth=1;
  ctx.stroke();
}

/* ── Interaction: drag to move light ── */
let dragging=false;

function updateLight(ex,ey){
  const rect=canvas.getBoundingClientRect();
  const mx=((ex-rect.left)/rect.width)*2-1;
  const my=-(((ey-rect.top)/rect.height)*2-1);
  const r2=mx*mx+my*my;
  let lx=mx,ly=my,lz;
  if(r2>1){const r=Math.sqrt(r2);lx/=r;ly/=r;lz=0.05;}
  else{lz=Math.sqrt(1-r2);}
  lightDir=vnorm([lx,ly,lz]);
  draw();
}

canvas.addEventListener('mousedown',e=>{dragging=true;updateLight(e.clientX,e.clientY);});
window.addEventListener('mousemove',e=>{if(dragging)updateLight(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>{dragging=false;});
canvas.addEventListener('touchstart',e=>{dragging=true;updateLight(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
window.addEventListener('touchmove',e=>{if(dragging&&e.touches.length)updateLight(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
window.addEventListener('touchend',()=>{dragging=false;});

/* ── Slider binding ── */
function bind(id,outId,dec){
  const el=document.getElementById(id),out=document.getElementById(outId);
  el.addEventListener('input',()=>{out.textContent=parseFloat(el.value).toFixed(dec);draw();});
}
bind('ka','ka-v',2);bind('kd','kd-v',2);bind('ks','ks-v',2);bind('alpha','alpha-v',0);
document.querySelectorAll('input[name="mdl"]').forEach(r=>r.addEventListener('change',draw));

draw();
</script>
</body>
</html>
