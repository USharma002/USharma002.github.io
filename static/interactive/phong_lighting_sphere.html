<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phong Lighting on a Sphere</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
    :root {
        --card-bg: #ffffff;
        --text: #374151;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #e65100;
        --mono: "Source Code Pro", ui-monospace, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root { --card-bg: #2d2d2d; --text: #e4e4e4; --muted: #a3a3a3; --border: #404040; --accent: #ffa726; }
    }
    html { background: transparent; }
    body { margin: 0; padding: 6px 4px; font-family: 'Merriweather', Georgia, serif; font-weight: 300; font-size: 14px; background: transparent; color: var(--text); }
    .wrap { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; justify-content: center; }
    .view { flex: 0 0 auto; }
    canvas { display: block; width: 340px; height: 340px; cursor: crosshair; touch-action: none; }
    .controls { flex: 1 1 300px; max-width: 380px; min-width: 0; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row .lab { font-size: 13px; color: var(--muted); width: 7.5em; flex-shrink: 0; }
    .row input[type=range] { flex: 1; min-width: 80px; margin: 0; accent-color: var(--muted); }
    .row .val { font-family: var(--mono); font-size: 13px; min-width: 3em; text-align: right; }
    button { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 0; border: 1px solid var(--muted); background: transparent; color: var(--text); cursor: pointer; }
    button:hover { border-color: var(--text); }
    button.on { background: var(--text); border-color: var(--text); color: var(--card-bg); }
    .seg button + button { margin-left: -1px; }
    .readout { font-family: var(--mono); font-size: 12px; line-height: 1.55; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; white-space: pre; overflow-x: auto; }
    .hint { font-size: 12px; color: var(--muted); font-style: italic; margin: 4px 0 0; text-align: center; }
    @media (max-width: 560px) {
        canvas { width: 210px; height: 210px; }
        .row { margin-bottom: 4px; }
        .readout { font-size: 11px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="view">
        <canvas id="c"></canvas>
        <p class="hint">drag to move the light &middot; hover to probe a pixel</p>
    </div>
    <div class="controls">
        <div class="row"><span class="lab">Model</span>
            <span class="seg" id="mdl"><button data-m="phong" class="on">Phong</button><button data-m="blinn">Blinn-Phong</button></span>
        </div>
        <div class="row"><span class="lab">ambient k<sub>a</sub></span><input type="range" id="ka" min="0" max="0.5" step="0.01" value="0.08"><span class="val" id="ka-v"></span></div>
        <div class="row"><span class="lab">diffuse k<sub>d</sub></span><input type="range" id="kd" min="0" max="1" step="0.01" value="0.72"><span class="val" id="kd-v"></span></div>
        <div class="row"><span class="lab">specular k<sub>s</sub></span><input type="range" id="ks" min="0" max="1" step="0.01" value="0.55"><span class="val" id="ks-v"></span></div>
        <div class="row"><span class="lab" id="exp-lab">shininess &alpha;</span><input type="range" id="alpha" min="1" max="256" step="1" value="48"><span class="val" id="alpha-v"></span></div>
        <div class="readout" id="readout"></div>
    </div>
</div>
<script>
/* Per-pixel Phong / Blinn-Phong on a unit sphere seen by an orthographic camera.
   All vectors are unit length and point away from the surface:
     N = sphere normal, L = toward the light (directional), V = (0,0,1) toward the viewer.
   I = ka*C + kd*max(N.L,0)*C + ks*S,  S = max(R.V,0)^a (Phong, R = 2(N.L)N - L)
                                       S = max(N.H,0)^a (Blinn, H = normalize(L+V)),  S = 0 if N.L <= 0.
   C is the material colour; light intensities are 1. Display = linear value ^ (1/2.2). */
let colors = {};
function readColors() {
    const cs = getComputedStyle(document.documentElement);
    ['--text', '--muted', '--border', '--accent', '--card-bg'].forEach(k => colors[k.slice(2)] = cs.getPropertyValue(k).trim());
}
function detectTheme() {
    try {
        if (window.parent === window) throw 0;   // standalone: CSS media query decides
        const bg = getComputedStyle(window.parent.document.body).backgroundColor;
        document.documentElement.style.background = bg;
        const rgb = bg.match(/\d+/g);
        if (rgb) {
            const dark = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 128;
            const set = (k, v) => document.documentElement.style.setProperty(k, v);
            set('--card-bg', dark ? '#2d2d2d' : '#ffffff');
            set('--text', dark ? '#e4e4e4' : '#374151');
            set('--muted', dark ? '#a3a3a3' : '#6b7280');
            set('--border', dark ? '#404040' : '#e5e7eb');
            set('--accent', dark ? '#ffa726' : '#e65100');
        }
    } catch (e) {}
    readColors();
    overlay();
}

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1e-9; return [a[0] / l, a[1] / l, a[2] / l]; };
const f3 = (a) => '(' + a.map(x => (x >= 0 ? ' ' : '') + x.toFixed(2)).join(',') + ')';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BASE = [0.9, 0.35, 0.18];       // material colour C (linear)
const V = [0, 0, 1];
let L = norm([0.5, 0.6, 0.65]);
let blinn = false;
let probe = null;                     // [nx, ny] on the unit disk, or null
let img = null, W = 0, Hc = 0, CX = 0, CY = 0, R = 0, dpr = 1;
const $ = id => document.getElementById(id);

function params() {
    return { ka: +$('ka').value, kd: +$('kd').value, ks: +$('ks').value, a: +$('alpha').value };
}

// Shade one normal. Returns the linear terms actually used for the pixel.
function shade(N, p) {
    const NL = dot(N, L);
    const diffCos = Math.max(NL, 0);
    let S = 0, X = 0, aux = null;
    if (blinn) {
        const H = norm([L[0] + V[0], L[1] + V[1], L[2] + V[2]]);
        X = dot(N, H); aux = H;
    } else {
        const Rv = [2 * NL * N[0] - L[0], 2 * NL * N[1] - L[1], 2 * NL * N[2] - L[2]];
        X = dot(Rv, V); aux = Rv;
    }
    if (NL > 0) S = Math.pow(Math.max(X, 0), p.a);
    return { NL, X, S, aux };
}

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const css = canvas.getBoundingClientRect().width || 340;
    W = Hc = Math.round(css * dpr);
    canvas.width = W; canvas.height = Hc;
    CX = W / 2; CY = Hc / 2; R = W * 0.40;
    render();
}

function render() {
    const p = params();
    img = ctx.createImageData(W, Hc);
    const d = img.data;
    for (let py = 0; py < Hc; py++) {
        const y = (CY - (py + 0.5)) / R;
        for (let px = 0; px < W; px++) {
            const x = ((px + 0.5) - CX) / R;
            const r2 = x * x + y * y;
            if (r2 > 1) continue;
            const N = [x, y, Math.sqrt(1 - r2)];
            const s = shade(N, p);
            const i = (py * W + px) * 4;
            for (let c = 0; c < 3; c++) {
                const lin = p.ka * BASE[c] + p.kd * Math.max(s.NL, 0) * BASE[c] + p.ks * s.S;
                d[i + c] = Math.round(255 * Math.pow(Math.min(1, Math.max(0, lin)), 1 / 2.2));
            }
            d[i + 3] = 255;
        }
    }
    overlay();
}

// Light marker: where the user's pointer maps to (inverse of lightFromPoint).
function lightToPoint() {
    const rxy = Math.hypot(L[0], L[1]);
    const th = Math.acos(Math.max(-1, Math.min(1, L[2])));          // angle from V
    const d = th <= Math.PI / 2 ? Math.sin(th) : 1 + (th - Math.PI / 2) / (Math.PI / 2);
    const ux = rxy > 1e-6 ? L[0] / rxy : 0, uy = rxy > 1e-6 ? L[1] / rxy : 0;
    return [CX + ux * d * R, CY - uy * d * R];
}
function lightFromPoint(cx, cy) {
    const mx = (cx - CX) / R, my = (CY - cy) / R;
    let d = Math.hypot(mx, my);
    if (d < 1e-6) { L = [0, 0, 1]; return; }
    d = Math.min(d, 1.98);
    const th = d <= 1 ? Math.asin(d) : Math.PI / 2 + (d - 1) * Math.PI / 2;  // past the rim: light moves behind the sphere
    L = norm([mx / Math.hypot(mx, my) * Math.sin(th), my / Math.hypot(mx, my) * Math.sin(th), Math.cos(th)]);
}

function overlay() {
    if (!img) return;
    ctx.putImageData(img, 0, 0);
    ctx.save();
    ctx.lineWidth = 1 * dpr;
    // silhouette
    ctx.strokeStyle = colors.border;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 2 * Math.PI); ctx.stroke();
    // light marker
    const [lx, ly] = lightToPoint();
    ctx.strokeStyle = colors.text; ctx.fillStyle = L[2] >= 0 ? colors['card-bg'] : 'transparent';
    ctx.setLineDash(L[2] >= 0 ? [] : [3 * dpr, 3 * dpr]);
    ctx.beginPath(); ctx.arc(lx, ly, 6 * dpr, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = colors.text;
    ctx.font = `italic ${12 * dpr}px Merriweather, Georgia, serif`;
    ctx.fillText(L[2] >= 0 ? 'light' : 'light (behind)', lx + 9 * dpr, ly - 8 * dpr);
    // probe marker
    if (probe) {
        const px = CX + probe[0] * R, py = CY - probe[1] * R;
        ctx.strokeStyle = colors.text;
        ctx.beginPath(); ctx.moveTo(px - 6 * dpr, py); ctx.lineTo(px + 6 * dpr, py); ctx.moveTo(px, py - 6 * dpr); ctx.lineTo(px, py + 6 * dpr); ctx.stroke();
    }
    ctx.restore();
    readout();
}

function readout() {
    const p = params();
    const q = probe || [0, 0];
    const N = [q[0], q[1], Math.sqrt(Math.max(0, 1 - q[0] * q[0] - q[1] * q[1]))];
    const s = shade(N, p);
    const amb = p.ka, dif = p.kd * Math.max(s.NL, 0), spc = p.ks * s.S;
    const lines = [
        `l = ${f3(L)}   v = (0, 0, 1)`,
        `${probe ? 'probe' : 'center'} n = ${f3(N)}`,
        `n·l = ${s.NL.toFixed(3)}`,
        blinn ? `h = ${f3(s.aux)}   n·h = ${s.X.toFixed(3)}`
              : `r = 2(n·l)n − l = ${f3(s.aux)}   r·v = ${s.X.toFixed(3)}`,
        `ambient  k_a            = ${amb.toFixed(3)} × C`,
        `diffuse  k_d max(0,n·l) = ${dif.toFixed(3)} × C`,
        `specular k_s ${blinn ? 'max(0,n·h)' : 'max(0,r·v)'}^${p.a} = ${spc.toFixed(3)}${s.NL <= 0 ? '  (0 since n·l ≤ 0)' : ''}`
    ];
    $('readout').textContent = lines.join('\n');
}

function evPoint(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * Hc / r.height];
}
let dragging = false;
canvas.addEventListener('pointerdown', e => { dragging = true; canvas.setPointerCapture(e.pointerId); const [x, y] = evPoint(e); lightFromPoint(x, y); render(); });
canvas.addEventListener('pointermove', e => {
    const [x, y] = evPoint(e);
    if (dragging) { lightFromPoint(x, y); render(); return; }
    const nx = (x - CX) / R, ny = (CY - y) / R;
    probe = nx * nx + ny * ny <= 1 ? [nx, ny] : null;
    overlay();
});
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointerleave', () => { if (!dragging) { probe = null; overlay(); } });

function bind(id, dec) {
    const el = $(id), out = $(id + '-v');
    const upd = () => { out.textContent = (+el.value).toFixed(dec); };
    upd();
    el.addEventListener('input', () => { upd(); render(); });
}
bind('ka', 2); bind('kd', 2); bind('ks', 2); bind('alpha', 0);
document.querySelectorAll('#mdl button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#mdl button').forEach(x => x.classList.toggle('on', x === b));
    blinn = b.dataset.m === 'blinn';
    $('exp-lab').innerHTML = blinn ? 'shininess &beta;' : 'shininess &alpha;';
    render();
});
window.addEventListener('resize', resize);

readColors();
resize();
(function(){var f=function(){detectTheme();setTimeout(detectTheme,350);};try{if(window.parent!==window)new MutationObserver(f).observe(window.parent.document.body,{attributes:true,attributeFilter:['class']});}catch(e){}matchMedia('(prefers-color-scheme: dark)').addEventListener('change',f);})();
detectTheme();
</script>
</body>
</html>
