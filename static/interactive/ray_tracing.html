<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Path Tracer: Combined Features</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: white; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; width: 300px;
            background: rgba(20, 20, 20, 0.95); padding: 15px;
            border-radius: 8px; border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 10; user-select: none;
        }
        
        #previewContainer {
            position: absolute; top: 20px; right: 20px;
            background: #000; border: 2px solid #444;
            border-radius: 4px; overflow: hidden;
        }
        #previewCanvas { display: block; width: 192px; height: 192px; image-rendering: pixelated; }
        .preview-label { 
            background: rgba(0,0,0,0.8); 
            color: #aaa; 
            font-size: 10px; 
            text-align: center; 
            padding: 4px 0; 
        }
        
        #pixelHighlight {
            position: absolute;
            border: 2px solid yellow;
            pointer-events: none;
            display: none;
            box-sizing: border-box;
        }

        h3 { margin: 0 0 12px 0; font-size: 16px; color: #eee; border-bottom: 1px solid #444; padding-bottom: 8px; }
        
        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        button {
            flex: 1; background: #3a3a3a; color: #ccc; border: 1px solid #555;
            padding: 10px; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: 600;
            transition: 0.2s;
        }
        button:hover { background: #555; color: white; }
        button.active { background: #2980b9; color: white; border-color: #3498db; }
        
        .controls { margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
        .control-row { display: flex; gap: 5px; margin-top: 8px; }
        .step-btn { font-weight: bold; background: #2c3e50; }
        
        .status { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.4; }
        .status strong { color: #f39c12; }
        
        label { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin-top: 8px; }
        
        .timeline-info { 
            background: #222; padding: 8px; border-radius: 4px; margin-top: 10px;
            font-size: 11px; text-align: center; color: #aaa;
        }
        .timeline-info span { color: #f39c12; font-weight: bold; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui">
        <h3>Path Tracer Workbench</h3>
        
        <div class="btn-group">
            <button id="btnVis" class="active" onclick="setMode('VISUAL')">Visual Scan</button>
            <button id="btnDebug" onclick="setMode('DEBUG')">Timeline Debug</button>
            <button id="btnAccum" onclick="setMode('ACCUMULATE')">Fast Render</button>
        </div>

        <div class="status">
            <div>Mode: <span id="modeDisp">Visual Scan</span></div>
            <div>Pixel: <span id="pixelDisp">0,0</span></div>
            <div>Event: <span id="eventDisp">Ready</span></div>
            <div id="sppDisplay" style="display:none;">Samples: <span id="sppDisp">0</span></div>
        </div>

        <div class="controls" id="visControls">
            <button onclick="stepOnePixel()" style="width:100%;">▶ Trace Next Pixel</button>
            <label>
                <input type="checkbox" id="chkAuto" onchange="toggleAuto()"> Auto-Scan (Fast)
            </label>
            <label>
                <input type="checkbox" id="chkCulling" onchange="toggleCulling()" checked> Enable Backface Culling
            </label>
        </div>

        <div class="controls" id="debugControls" style="display:none;">
            <div style="background: #2a2a2a; padding: 8px; border-radius: 4px; margin-bottom: 8px;">
                <div style="font-size: 11px; color: #aaa; margin-bottom: 4px;">Select Pixel to Trace:</div>
                <div style="display: flex; gap: 5px; margin-bottom: 6px;">
                    <input type="number" id="pixelX" min="0" max="63" value="32" style="width: 50%; padding: 6px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 12px;">
                    <input type="number" id="pixelY" min="0" max="63" value="32" style="width: 50%; padding: 6px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 12px;">
                </div>
                <div style="font-size: 10px; color: #666; margin-bottom: 6px;">Click preview canvas or frustum to select</div>
            </div>
            
            <button onclick="generateNewPath()" style="width:100%; margin-bottom:8px; background:#444;">Generate Ray for Selected Pixel</button>
            
            <div style="background: #2a2a2a; padding: 8px; border-radius: 4px; margin-bottom: 8px;">
                <div style="font-size: 11px; color: #aaa; margin-bottom: 4px;">Final Color Preview:</div>
                <div id="colorPreview" style="width: 100%; height: 30px; border-radius: 4px; border: 1px solid #555; background: #000;"></div>
                <div id="colorText" style="font-size: 10px; color: #aaa; text-align: center; margin-top: 4px;">RGB(0.00, 0.00, 0.00)</div>
            </div>
            
            <div class="control-row">
                <button class="step-btn" onclick="stepTimeline(-1)">◀ Prev</button>
                <button class="step-btn" onclick="stepTimeline(1)">Next ▶</button>
            </div>
            
            <div class="timeline-info">
                Step: <span id="stepCount">0</span> / <span id="maxSteps">0</span>
            </div>
            
            <label>
                <input type="checkbox" id="chkCullingDebug" onchange="toggleCulling()" checked> Enable Backface Culling
            </label>
            
            <button onclick="toggleCameraEdit()" id="btnCamEdit" style="width:100%; margin-top:8px; background:#2c3e50;">Edit Camera Transform</button>
            
            <div id="camEditPanel" style="display:none; background: #222; padding: 8px; border-radius: 4px; margin-top: 8px;">
                <div style="font-size: 11px; color: #aaa; margin-bottom: 6px;">Position:</div>
                <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                    <input type="number" id="camPosX" step="0.5" style="width: 33%; padding: 4px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 11px;" placeholder="X">
                    <input type="number" id="camPosY" step="0.5" style="width: 33%; padding: 4px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 11px;" placeholder="Y">
                    <input type="number" id="camPosZ" step="0.5" style="width: 33%; padding: 4px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 11px;" placeholder="Z">
                </div>
                <div style="font-size: 11px; color: #aaa; margin-bottom: 6px;">Rotation (degrees):</div>
                <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                    <input type="number" id="camRotX" step="5" style="width: 33%; padding: 4px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 11px;" placeholder="X">
                    <input type="number" id="camRotY" step="5" style="width: 33%; padding: 4px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 11px;" placeholder="Y">
                    <input type="number" id="camRotZ" step="5" style="width: 33%; padding: 4px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 3px; font-size: 11px;" placeholder="Z">
                </div>
                <button onclick="applyCameraTransform()" style="width:100%; padding: 6px; background: #27ae60; margin-bottom: 4px;">✓ Apply</button>
                <button onclick="resetCamera()" style="width:100%; padding: 6px; background: #c0392b;">↺ Reset</button>
            </div>
        </div>
    </div>

    <div id="previewContainer">
        <canvas id="previewCanvas" width="64" height="64" style="cursor: crosshair;"></canvas>
        <div id="pixelHighlight"></div>
        <div class="preview-label">64×64 Output (Click to select pixel)</div>
    </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ==========================================
   SCENE SETUP
   ========================================== */
const scene = new THREE.Scene();
const viewerCam = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
viewerCam.position.set(10, 8, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x111111);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(viewerCam, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;

// Lights (Visualization only)
const ambient = new THREE.AmbientLight(0xffffff, 0.1);
scene.add(ambient);
const spotLight = new THREE.SpotLight(0xffffff, 1000);
spotLight.position.set(5, 20, 15);
spotLight.angle = 0.6;
spotLight.penumbra = 0.5;
spotLight.castShadow = true;
spotLight.shadow.bias = -0.001;
scene.add(spotLight);

/* ==========================================
   CORNELL BOX GEOMETRY
   ========================================== */
const worldObjects = [];
const matWhite = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
const matRed   = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.8 });
const matGreen = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.8 });
const matLight = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 });

function createPlane(w, h, mat, pos, rot, type='wall') {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    mesh.position.copy(pos);
    mesh.rotation.set(rot.x, rot.y, rot.z);
    mesh.receiveShadow = true;
    scene.add(mesh);
    mesh.updateMatrixWorld();
    worldObjects.push({ 
        mesh, type, color: mat.color, 
        emission: type==='light' ? new THREE.Color(10, 10, 10) : new THREE.Color(0,0,0) 
    });
}

function createBox(w, h, d, mat, pos, rotY) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.copy(pos);
    mesh.rotation.y = rotY;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    mesh.updateMatrixWorld();
    worldObjects.push({ mesh, type:'mesh', color: mat.color, emission: new THREE.Color(0,0,0) });
}

// Build Cornell Box
createPlane(10, 10, matWhite, new THREE.Vector3(0, 0, 0),  new THREE.Vector3(-Math.PI/2, 0, 0)); // Floor
createPlane(10, 10, matWhite, new THREE.Vector3(0, 10, 0), new THREE.Vector3(Math.PI/2, 0, 0));  // Ceiling
createPlane(10, 10, matWhite, new THREE.Vector3(0, 5, -5), new THREE.Vector3(0, 0, 0));          // Back
createPlane(10, 10, matRed,   new THREE.Vector3(-5, 5, 0), new THREE.Vector3(0, Math.PI/2, 0));  // Left
createPlane(10, 10, matGreen, new THREE.Vector3(5, 5, 0),  new THREE.Vector3(0, -Math.PI/2, 0)); // Right
createPlane(3, 3, matLight,   new THREE.Vector3(0, 9.9, 0), new THREE.Vector3(Math.PI/2, 0, 0), 'light'); // Light
createBox(3, 3, 3, matWhite, new THREE.Vector3(-1.5, 1.5, -1), 0.3);
createBox(3, 6, 3, matWhite, new THREE.Vector3(2, 3, 1.5), -0.3);

/* ==========================================
   VIRTUAL CAMERA & IMAGE PLANE
   ========================================== */
const R_W = 64, R_H = 64;

// Virtual Camera
const vCam = new THREE.PerspectiveCamera(40, 1, 0.5, 2);
vCam.position.set(0, 5, 16);
vCam.lookAt(0, 5, 0);
vCam.updateMatrixWorld();

// Camera Helper
const camHelper = new THREE.CameraHelper(vCam);
camHelper.setColors(
    new THREE.Color(0x444444), 
    new THREE.Color(0x666666), 
    new THREE.Color(0x888888), 
    new THREE.Color(0xffffff), 
    new THREE.Color(0x888888)
);
scene.add(camHelper);

// Image Plane Texture
const size = R_W * R_H;
const data = new Uint8Array(4 * size);
for (let i = 0; i < size; i++) { 
    data[i*4]=0; data[i*4+1]=0; data[i*4+2]=0; data[i*4+3]=255; 
}

const texture = new THREE.DataTexture(data, R_W, R_H);
texture.needsUpdate = true;
texture.minFilter = THREE.NearestFilter;
texture.magFilter = THREE.NearestFilter;
texture.flipY = false; // Don't flip - we handle orientation in NDC

// Image Plane Mesh
const dist = vCam.far;
const vFOV = THREE.MathUtils.degToRad(vCam.fov);
const planeHeight = 2 * Math.tan(vFOV / 2) * dist;
const planeWidth = planeHeight * vCam.aspect;

const imgPlaneGeo = new THREE.PlaneGeometry(planeWidth, planeHeight);
const imgPlaneMat = new THREE.MeshBasicMaterial({ 
    map: texture, 
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.9
});
const imgPlane = new THREE.Mesh(imgPlaneGeo, imgPlaneMat);
imgPlane.position.set(0, 0, -dist);
imgPlane.scale.y = -1; // Flip vertically to match screen space orientation
vCam.add(imgPlane);
scene.add(vCam);

/* ==========================================
   BACKFACE CULLING CONTROL
   ========================================== */
let cullingEnabled = true;

window.toggleCulling = () => {
    const visCheckbox = document.getElementById('chkCulling');
    const debugCheckbox = document.getElementById('chkCullingDebug');
    
    // Get the state from whichever checkbox exists and was changed
    if(visCheckbox && debugCheckbox) {
        cullingEnabled = mode === 'VISUAL' ? visCheckbox.checked : debugCheckbox.checked;
    } else {
        cullingEnabled = visCheckbox?.checked ?? debugCheckbox?.checked ?? true;
    }
    
    // Update both checkboxes to stay in sync
    if(visCheckbox) visCheckbox.checked = cullingEnabled;
    if(debugCheckbox) debugCheckbox.checked = cullingEnabled;
    
    // Update all materials
    worldObjects.forEach(obj => {
        obj.mesh.material.side = cullingEnabled ? THREE.FrontSide : THREE.DoubleSide;
        obj.mesh.material.needsUpdate = true;
    });
};

/* ==========================================
   PIXEL SELECTION FOR TIMELINE DEBUG
   ========================================== */
let selectedPixelX = 32;
let selectedPixelY = 32;

function updatePixelHighlight() {
    const highlight = document.getElementById('pixelHighlight');
    const canvas = document.getElementById('previewCanvas');
    const rect = canvas.getBoundingClientRect();
    
    const pixelWidth = rect.width / R_W;
    const pixelHeight = rect.height / R_H;
    
    highlight.style.left = (selectedPixelX * pixelWidth) + 'px';
    highlight.style.top = (selectedPixelY * pixelHeight) + 'px';
    highlight.style.width = pixelWidth + 'px';
    highlight.style.height = pixelHeight + 'px';
    highlight.style.display = mode === 'DEBUG' ? 'block' : 'none';
}

function setupPixelSelection() {
    // Click on preview canvas
    canvas2d.addEventListener('click', (e) => {
        if(mode !== 'DEBUG') return;
        
        const rect = canvas2d.getBoundingClientRect();
        const scaleX = R_W / rect.width;
        const scaleY = R_H / rect.height;
        
        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);
        
        if(x >= 0 && x < R_W && y >= 0 && y < R_H) {
            selectedPixelX = x;
            selectedPixelY = y;
            document.getElementById('pixelX').value = x;
            document.getElementById('pixelY').value = y;
            updatePixelHighlight();
            generateNewPath();
        }
    });

    // Click on frustum plane
    const raycasterClick = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
        if(mode !== 'DEBUG') return;
        
        // Skip if clicking on UI elements
        if(e.target.closest('#ui') || e.target.closest('#previewContainer')) return;
        
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        raycasterClick.setFromCamera(mouse, viewerCam);
        const intersects = raycasterClick.intersectObject(imgPlane, false);
        
        if(intersects.length > 0) {
            const uv = intersects[0].uv;
            // Account for vertical flip
            const x = Math.floor(uv.x * R_W);
            const y = Math.floor((1 - uv.y) * R_H);
            
            if(x >= 0 && x < R_W && y >= 0 && y < R_H) {
                selectedPixelX = x;
                selectedPixelY = y;
                document.getElementById('pixelX').value = x;
                document.getElementById('pixelY').value = y;
                updatePixelHighlight();
                generateNewPath();
            }
        }
    });
}

/* ==========================================
   RAY TRACING ENGINE
   ========================================== */
const raycaster = new THREE.Raycaster();
const MAX_BOUNCES = 3;
const accumBuffer = new Float32Array(size * 3);
const countBuffer = new Float32Array(size);

// 2D Preview Canvas
const canvas2d = document.getElementById('previewCanvas');
const ctx2d = canvas2d.getContext('2d');

function syncPreviewCanvas() {
    const imgData = ctx2d.createImageData(R_W, R_H);
    imgData.data.set(data);
    ctx2d.putImageData(imgData, 0, 0);
}

function intersect(ray) {
    raycaster.ray.copy(ray);
    const hits = raycaster.intersectObjects(worldObjects.map(o => o.mesh), false);
    if (hits.length > 0) {
        const hit = hits[0];
        const objData = worldObjects.find(o => o.mesh === hit.object);
        let normal = hit.face.normal.clone().applyQuaternion(hit.object.quaternion).normalize();
        if (normal.dot(ray.direction) > 0) normal.negate();
        return { point: hit.point, normal: normal, obj: objData };
    }
    return null;
}

function getRay(px, py) {
    // NDC: flip Y so (0,0) is top-left, (R_W-1, R_H-1) is bottom-right
    const ndcX = (px / R_W) * 2 - 1;
    const ndcY = -((py / R_H) * 2 - 1); // Negative to flip Y axis
    
    const ray = new THREE.Ray();
    ray.origin.setFromMatrixPosition(vCam.matrixWorld);
    ray.direction.set(ndcX, ndcY, 0.5).unproject(vCam).sub(ray.origin).normalize();
    return ray;
}

function tracePath(ray, depth) {
    if (depth > MAX_BOUNCES) return new THREE.Color(0,0,0);
    const hit = intersect(ray);
    if (!hit) return new THREE.Color(0,0,0);
    
    // If we hit a light, return its emission directly (don't multiply by material color)
    if (hit.obj.type === 'light') return hit.obj.emission.clone();

    const rand = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    if (rand.dot(hit.normal) < 0) rand.negate();
    const nextDir = new THREE.Vector3().copy(hit.normal).add(rand).normalize();
    
    const incoming = tracePath(new THREE.Ray(hit.point.clone().addScaledVector(hit.normal, 0.01), nextDir), depth+1);
    return hit.obj.color.clone().multiply(incoming);
}

function updatePixelTexture(px, py, r, g, b) {
    const idx = (py * R_W + px) * 4;
    data[idx] = Math.min(1, r) * 255;
    data[idx+1] = Math.min(1, g) * 255;
    data[idx+2] = Math.min(1, b) * 255;
    data[idx+3] = 255;
    texture.needsUpdate = true;
    syncPreviewCanvas();
}

/* ==========================================
   VISUALIZATION ASSETS
   ========================================== */
const debugGroup = new THREE.Group();
scene.add(debugGroup);

const sphereGeo = new THREE.SphereGeometry(0.6, 16, 8, 0, Math.PI*2, 0, Math.PI/2);
const bsdfMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.15 });

function visualizeRay(start, end, color) {
    const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
    const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
    debugGroup.add(new THREE.Line(geo, mat));
    
    const dot = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.15), new THREE.MeshBasicMaterial({color: color}));
    dot.position.copy(end);
    debugGroup.add(dot);
}

/* ==========================================
   MODE 1: VISUAL SCAN (Fast Pixel-by-Pixel)
   ========================================== */
let currentPx = 0;
let currentPy = 0;
let isAuto = false;
let mode = 'VISUAL';

window.stepOnePixel = () => {
    debugGroup.clear();

    const ray = getRay(currentPx + 0.5, currentPy + 0.5);
    
    let currRay = ray;
    let throughput = new THREE.Color(1,1,1);
    let finalColor = new THREE.Color(0,0,0);
    let hitLight = false;

    for(let i=0; i<=MAX_BOUNCES; i++) {
        const hit = intersect(currRay);
        const end = hit ? hit.point : currRay.origin.clone().addScaledVector(currRay.direction, 10);
        
        visualizeRay(currRay.origin, end, 0xfbc531);

        if(!hit) break;
        
        if(hit.obj.type === 'light') {
            finalColor = hit.obj.emission.clone().multiply(throughput);
            hitLight = true;
            break;
        }

        throughput.multiply(hit.obj.color);
        
        const rand = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
        if (rand.dot(hit.normal) < 0) rand.negate();
        const nextDir = new THREE.Vector3().copy(hit.normal).add(rand).normalize();
        currRay = new THREE.Ray(hit.point.clone().addScaledVector(hit.normal, 0.01), nextDir);
    }

    updatePixelTexture(currentPx, currentPy, finalColor.r, finalColor.g, finalColor.b);

    document.getElementById('pixelDisp').innerText = `${currentPx}, ${currentPy}`;
    document.getElementById('eventDisp').innerText = hitLight ? 
        `Radiance: ${finalColor.r.toFixed(1)},${finalColor.g.toFixed(1)},${finalColor.b.toFixed(1)}` : "Shadow";

    currentPx++;
    if(currentPx >= R_W) {
        currentPx = 0;
        currentPy++;
        if(currentPy >= R_H) currentPy = 0;
    }
}

window.toggleAuto = () => {
    isAuto = document.getElementById('chkAuto').checked;
    if(isAuto && mode === 'VISUAL') loopVisual();
}

function loopVisual() {
    if(!isAuto || mode !== 'VISUAL') return;
    stepOnePixel();
    setTimeout(() => requestAnimationFrame(loopVisual), 5); // Fast scan
}

/* ==========================================
   MODE 2: TIMELINE DEBUG (Step-by-Step)
   ========================================== */
let timeline = [];
let currentStepIndex = 0;

// Compute full path with recursive color tracking
function computePathRecursive(ray, depth, pathHistory) {
    const hit = intersect(ray);
    
    if (!hit) {
        pathHistory.push({ 
            type: 'miss', 
            start: ray.origin.clone(), 
            end: ray.origin.clone().addScaledVector(ray.direction, 10),
            color: new THREE.Color(0, 0, 0),
            bounce: depth
        });
        return new THREE.Color(0, 0, 0);
    }
    
    pathHistory.push({ 
        type: 'travel', 
        start: ray.origin.clone(), 
        end: hit.point,
        bounce: depth
    });
    
    pathHistory.push({ 
        type: 'hit', 
        pos: hit.point, 
        normal: hit.normal, 
        obj: hit.obj,
        bounce: depth
    });
    
    if (hit.obj.type === 'light') {
        const lightColor = hit.obj.emission.clone();
        pathHistory.push({ 
            type: 'light_hit', 
            pos: hit.point,
            color: lightColor,
            bounce: depth
        });
        return lightColor;
    }
    
    if (depth >= MAX_BOUNCES) {
        pathHistory.push({ 
            type: 'max_depth', 
            pos: hit.point,
            color: new THREE.Color(0, 0, 0),
            bounce: depth
        });
        return new THREE.Color(0, 0, 0);
    }
    
    // Sample BSDF
    const rand = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    if (rand.dot(hit.normal) < 0) rand.negate();
    const nextDir = new THREE.Vector3().copy(hit.normal).add(rand).normalize();
    
    pathHistory.push({ 
        type: 'bsdf', 
        pos: hit.point, 
        normal: hit.normal, 
        outDir: nextDir,
        bounce: depth
    });
    
    const nextRay = new THREE.Ray(hit.point.clone().addScaledVector(hit.normal, 0.01), nextDir);
    const incomingColor = computePathRecursive(nextRay, depth + 1, pathHistory);
    const returnColor = hit.obj.color.clone().multiply(incomingColor);
    
    // Mark return event
    pathHistory.push({ 
        type: 'return', 
        pos: hit.point,
        color: returnColor,
        bounce: depth,
        text: `Return: RGB(${returnColor.r.toFixed(2)}, ${returnColor.g.toFixed(2)}, ${returnColor.b.toFixed(2)})`
    });
    
    return returnColor;
}

window.generateNewPath = () => {
    debugGroup.clear();
    timeline = [];
    currentStepIndex = 0;

    // Use selected pixel
    const ray = getRay(selectedPixelX + 0.5, selectedPixelY + 0.5);
    
    timeline.push({ type: 'start', ray: ray.clone() });
    
    const pathHistory = [];
    const finalColor = computePathRecursive(ray, 0, pathHistory);
    
    timeline.push(...pathHistory);
    
    timeline.push({ 
        type: 'final', 
        color: finalColor,
        text: `Final: RGB(${finalColor.r.toFixed(2)}, ${finalColor.g.toFixed(2)}, ${finalColor.b.toFixed(2)})`
    });

    // Update color preview
    const colorPreview = document.getElementById('colorPreview');
    const colorText = document.getElementById('colorText');
    
    // Gamma correct for display
    const displayR = Math.pow(Math.min(finalColor.r, 1), 1/2.2);
    const displayG = Math.pow(Math.min(finalColor.g, 1), 1/2.2);
    const displayB = Math.pow(Math.min(finalColor.b, 1), 1/2.2);
    
    colorPreview.style.background = `rgb(${displayR*255}, ${displayG*255}, ${displayB*255})`;
    colorText.innerText = `Pixel (${selectedPixelX}, ${selectedPixelY}): RGB(${finalColor.r.toFixed(2)}, ${finalColor.g.toFixed(2)}, ${finalColor.b.toFixed(2)})`;
    
    // Show if path hit light or is in shadow
    if(finalColor.r === 0 && finalColor.g === 0 && finalColor.b === 0) {
        colorText.innerText += ' - Shadow/Miss';
        colorText.style.color = '#ff6b6b';
    } else {
        colorText.style.color = '#4cd137';
    }

    document.getElementById('maxSteps').innerText = timeline.length;
    document.getElementById('stepCount').innerText = 0;
    document.getElementById('eventDisp').innerText = `Pixel (${selectedPixelX}, ${selectedPixelY}) - ` + 
        (finalColor.r === 0 && finalColor.g === 0 && finalColor.b === 0 ? "No Light" : "Light Found!");
    
    stepTimeline(1);
};

window.stepTimeline = (dir) => {
    const newIndex = Math.min(Math.max(currentStepIndex + dir, 0), timeline.length);
    if (newIndex === currentStepIndex) return;
    
    currentStepIndex = newIndex;
    document.getElementById('stepCount').innerText = currentStepIndex;
    
    debugGroup.clear();
    
    let statusText = "";

    for(let i=0; i<currentStepIndex; i++) {
        const event = timeline[i];
        
        if (event.type === 'travel') {
            // Color ray by its eventual return color if available
            let rayColor = 0xfbc531; // Default yellow
            
            // Look ahead for return event at same bounce level
            for(let j=i+1; j<timeline.length; j++) {
                if(timeline[j].type === 'return' && timeline[j].bounce === event.bounce) {
                    const col = timeline[j].color;
                    rayColor = new THREE.Color(col.r, col.g, col.b);
                    break;
                }
            }
            
            const geo = new THREE.BufferGeometry().setFromPoints([event.start, event.end]);
            const mat = new THREE.LineBasicMaterial({ color: rayColor, linewidth: 2 });
            debugGroup.add(new THREE.Line(geo, mat));
            statusText = `Ray Bounce ${event.bounce}`;
        }
        else if (event.type === 'hit') {
            const dot = new THREE.Mesh(
                new THREE.BoxGeometry(0.15,0.15,0.15), 
                new THREE.MeshBasicMaterial({color:0xe74c3c})
            );
            dot.position.copy(event.pos);
            debugGroup.add(dot);
            statusText = `Hit ${event.obj.type === 'light' ? 'Light' : 'Surface'}`;
        }
        else if (event.type === 'bsdf') {
            if (i === currentStepIndex - 1) {
                const hemi = new THREE.Mesh(sphereGeo, bsdfMat);
                hemi.position.copy(event.pos);
                const up = new THREE.Vector3(0, 1, 0);
                hemi.quaternion.setFromUnitVectors(up, event.normal);
                debugGroup.add(hemi);

                const arrowN = new THREE.ArrowHelper(event.normal, event.pos, 1.0, 0x00a8ff, 0.3, 0.1);
                debugGroup.add(arrowN);
                const arrowS = new THREE.ArrowHelper(event.outDir, event.pos, 0.8, 0xfbc531, 0.3, 0.1);
                debugGroup.add(arrowS);
                statusText = "BSDF Sampling";
            }
        }
        else if (event.type === 'return') {
            if (i === currentStepIndex - 1) {
                statusText = event.text;
                
                // Visualize return color
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.3, 16, 16),
                    new THREE.MeshBasicMaterial({ color: event.color })
                );
                sphere.position.copy(event.pos);
                debugGroup.add(sphere);
            }
        }
        else if (event.type === 'final') {
            if (i === currentStepIndex - 1) {
                statusText = event.text;
            }
        }
        else if (event.type === 'light_hit') {
            statusText = "Hit Light Source";
        }
    }
    document.getElementById('eventDisp').innerText = statusText || "Start";
};

/* ==========================================
   CAMERA TRANSFORM EDITING (Blender-style)
   ========================================== */
const defaultCamPos = { x: 0, y: 5, z: 16 };
const defaultCamRot = { x: 0, y: 0, z: 0 };

// Interactive gizmo setup
const gizmoGroup = new THREE.Group();
scene.add(gizmoGroup);

// Create transform gizmo arrows
function createGizmo() {
    gizmoGroup.clear();
    
    const arrowLength = 2;
    const arrowColor = { x: 0xff0000, y: 0x00ff00, z: 0x0000ff };
    
    // Position arrows
    const arrowX = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), vCam.position, arrowLength, arrowColor.x, 0.4, 0.2);
    const arrowY = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), vCam.position, arrowLength, arrowColor.y, 0.4, 0.2);
    const arrowZ = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), vCam.position, arrowLength, arrowColor.z, 0.4, 0.2);
    
    arrowX.userData = { axis: 'x', type: 'position' };
    arrowY.userData = { axis: 'y', type: 'position' };
    arrowZ.userData = { axis: 'z', type: 'position' };
    
    gizmoGroup.add(arrowX, arrowY, arrowZ);
    gizmoGroup.visible = false;
}

createGizmo();

let isDragging = false;
let dragAxis = null;
let dragType = null;
let dragStart = new THREE.Vector2();
let camStartPos = new THREE.Vector3();
let camStartRot = new THREE.Euler();

// Click on camera helper to show gizmo
const camClickRaycaster = new THREE.Raycaster();
window.addEventListener('click', (e) => {
    if(e.target.closest('#ui') || e.target.closest('#previewContainer')) return;
    
    const mouse = new THREE.Vector2(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1
    );
    
    camClickRaycaster.setFromCamera(mouse, viewerCam);
    
    // Check if clicked on gizmo arrows
    if(gizmoGroup.visible) {
        const gizmoIntersects = camClickRaycaster.intersectObjects(gizmoGroup.children, true);
        if(gizmoIntersects.length > 0) {
            const obj = gizmoIntersects[0].object;
            let arrow = obj;
            while(arrow && !arrow.userData.axis) arrow = arrow.parent;
            if(arrow && arrow.userData.axis) {
                isDragging = true;
                dragAxis = arrow.userData.axis;
                dragType = arrow.userData.type;
                dragStart.set(e.clientX, e.clientY);
                camStartPos.copy(vCam.position);
                camStartRot.copy(vCam.rotation);
                controls.enabled = false;
                return;
            }
        }
    }
    
    // Check if clicked near camera position (show/hide gizmo)
    const camSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5));
    camSphere.position.copy(vCam.position);
    const camIntersects = camClickRaycaster.intersectObject(camSphere);
    if(camIntersects.length > 0 && camIntersects[0].distance < 2) {
        gizmoGroup.visible = !gizmoGroup.visible;
        if(!gizmoGroup.visible) controls.enabled = true;
    } else if(!isDragging) {
        gizmoGroup.visible = false;
        controls.enabled = true;
    }
});

window.addEventListener('mousemove', (e) => {
    if(!isDragging) return;
    
    const delta = new THREE.Vector2(
        e.clientX - dragStart.x,
        e.clientY - dragStart.y
    );
    
    if(dragType === 'position') {
        const scale = 0.01;
        if(dragAxis === 'x') vCam.position.x = camStartPos.x + delta.x * scale;
        if(dragAxis === 'y') vCam.position.y = camStartPos.y - delta.y * scale;
        if(dragAxis === 'z') vCam.position.z = camStartPos.z - delta.y * scale;
    }
    
    vCam.updateMatrixWorld();
    camHelper.update();
    createGizmo();
    
    // Update input fields if panel is open
    if(document.getElementById('camEditPanel').style.display !== 'none') {
        document.getElementById('camPosX').value = vCam.position.x.toFixed(2);
        document.getElementById('camPosY').value = vCam.position.y.toFixed(2);
        document.getElementById('camPosZ').value = vCam.position.z.toFixed(2);
    }
});

window.addEventListener('mouseup', () => {
    if(isDragging) {
        isDragging = false;
        controls.enabled = true;
        if(mode === 'DEBUG') generateNewPath();
    }
});

window.toggleCameraEdit = () => {
    const panel = document.getElementById('camEditPanel');
    const btn = document.getElementById('btnCamEdit');
    const isVisible = panel.style.display !== 'none';
    
    panel.style.display = isVisible ? 'none' : 'block';
    btn.style.background = isVisible ? '#2c3e50' : '#27ae60';
    
    if(!isVisible) {
        // Populate current values
        document.getElementById('camPosX').value = vCam.position.x.toFixed(2);
        document.getElementById('camPosY').value = vCam.position.y.toFixed(2);
        document.getElementById('camPosZ').value = vCam.position.z.toFixed(2);
        
        const euler = new THREE.Euler().setFromQuaternion(vCam.quaternion, 'XYZ');
        document.getElementById('camRotX').value = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
        document.getElementById('camRotY').value = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
        document.getElementById('camRotZ').value = THREE.MathUtils.radToDeg(euler.z).toFixed(1);
    }
};

window.applyCameraTransform = () => {
    const px = parseFloat(document.getElementById('camPosX').value) || 0;
    const py = parseFloat(document.getElementById('camPosY').value) || 0;
    const pz = parseFloat(document.getElementById('camPosZ').value) || 0;
    
    const rx = THREE.MathUtils.degToRad(parseFloat(document.getElementById('camRotX').value) || 0);
    const ry = THREE.MathUtils.degToRad(parseFloat(document.getElementById('camRotY').value) || 0);
    const rz = THREE.MathUtils.degToRad(parseFloat(document.getElementById('camRotZ').value) || 0);
    
    vCam.position.set(px, py, pz);
    vCam.rotation.set(rx, ry, rz);
    vCam.updateMatrixWorld();
    camHelper.update();
    createGizmo();
    
    // Regenerate path if in debug mode
    if(mode === 'DEBUG') {
        generateNewPath();
    }
};

window.resetCamera = () => {
    vCam.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);
    vCam.rotation.set(0, 0, 0);
    vCam.lookAt(0, 5, 0);
    vCam.updateMatrixWorld();
    camHelper.update();
    createGizmo();
    
    // Update input fields
    document.getElementById('camPosX').value = defaultCamPos.x.toFixed(2);
    document.getElementById('camPosY').value = defaultCamPos.y.toFixed(2);
    document.getElementById('camPosZ').value = defaultCamPos.z.toFixed(2);
    
    const euler = new THREE.Euler().setFromQuaternion(vCam.quaternion, 'XYZ');
    document.getElementById('camRotX').value = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
    document.getElementById('camRotY').value = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
    document.getElementById('camRotZ').value = THREE.MathUtils.radToDeg(euler.z).toFixed(1);
    
    // Regenerate path if in debug mode
    if(mode === 'DEBUG') {
        generateNewPath();
    }
};

/* ==========================================
   MODE 3: FAST RENDER (Accumulation)
   ========================================== */
let frameCount = 0;

function loopAccumulate() {
    if(mode !== 'ACCUMULATE') return;

    const batchSize = (R_W * R_H) / 4;
    
    for(let i=0; i<batchSize; i++) {
        const px = Math.floor(Math.random() * R_W);
        const py = Math.floor(Math.random() * R_H);
        
        const ray = getRay(px + Math.random(), py + Math.random());
        const col = tracePath(ray, 0);
        
        const idx = py * R_W + px;
        
        accumBuffer[idx*3] += col.r;
        accumBuffer[idx*3+1] += col.g;
        accumBuffer[idx*3+2] += col.b;
        countBuffer[idx]++;
        
        const count = countBuffer[idx];
        const r = accumBuffer[idx*3] / count;
        const g = accumBuffer[idx*3+1] / count;
        const b = accumBuffer[idx*3+2] / count;
        
        const texIdx = idx * 4;
        data[texIdx] = Math.pow(r, 1/2.2) * 255;
        data[texIdx+1] = Math.pow(g, 1/2.2) * 255;
        data[texIdx+2] = Math.pow(b, 1/2.2) * 255;
        data[texIdx+3] = 255;
    }
    
    texture.needsUpdate = true;
    frameCount++;
    document.getElementById('sppDisp').innerText = frameCount;
    
    syncPreviewCanvas();

    requestAnimationFrame(loopAccumulate);
}

/* ==========================================
   UI & MODE SWITCHING
   ========================================== */
window.setMode = (m) => {
    mode = m;
    
    document.getElementById('btnVis').classList.toggle('active', m==='VISUAL');
    document.getElementById('btnDebug').classList.toggle('active', m==='DEBUG');
    document.getElementById('btnAccum').classList.toggle('active', m==='ACCUMULATE');
    
    document.getElementById('visControls').style.display = m==='VISUAL' ? 'block' : 'none';
    document.getElementById('debugControls').style.display = m==='DEBUG' ? 'block' : 'none';
    document.getElementById('sppDisplay').style.display = m==='ACCUMULATE' ? 'block' : 'none';
    
    const modeNames = {'VISUAL': 'Visual Scan', 'DEBUG': 'Timeline Debug', 'ACCUMULATE': 'Fast Render'};
    document.getElementById('modeDisp').innerText = modeNames[m];

    debugGroup.clear();
    gizmoGroup.visible = false;
    updatePixelHighlight();

    if(m === 'DEBUG') {
        generateNewPath();
    } else if(m === 'ACCUMULATE') {
        accumBuffer.fill(0);
        countBuffer.fill(0);
        data.fill(0);
        for(let i=0; i<R_W*R_H; i++) data[i*4+3]=255;
        texture.needsUpdate = true;
        syncPreviewCanvas();
        frameCount = 0;
        loopAccumulate();
    }
}

window.addEventListener('resize', () => {
    viewerCam.aspect = window.innerWidth / window.innerHeight;
    viewerCam.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Setup pixel selection and input listeners
setupPixelSelection();

setTimeout(() => {
    const pixelXInput = document.getElementById('pixelX');
    const pixelYInput = document.getElementById('pixelY');
    
    if(pixelXInput) {
        pixelXInput.addEventListener('change', () => {
            selectedPixelX = Math.max(0, Math.min(R_W-1, parseInt(pixelXInput.value) || 0));
            pixelXInput.value = selectedPixelX;
            updatePixelHighlight();
            if(mode === 'DEBUG') generateNewPath();
        });
    }
    
    if(pixelYInput) {
        pixelYInput.addEventListener('change', () => {
            selectedPixelY = Math.max(0, Math.min(R_H-1, parseInt(pixelYInput.value) || 0));
            pixelYInput.value = selectedPixelY;
            updatePixelHighlight();
            if(mode === 'DEBUG') generateNewPath();
        });
    }
}, 100);

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, viewerCam);
}
animate();

</script>
