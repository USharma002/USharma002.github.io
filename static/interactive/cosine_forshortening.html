<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lambert's cosine law</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; touch-action: none; user-select: none; }
  svg text { font-family: var(--serif); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .m { font-style: italic; font-size: 17px; }
  .s { font-size: 13px; }
  .handle { cursor: grab; }
</style>
</head>
<body>
<div class="readout" id="readout"></div>
<svg id="svg" viewBox="0 0 760 300"></svg>
<div class="hint">drag the light around the hemisphere</div>
<script src="/interactive/pt/embed.js"></script>
<script>
// A beam of fixed width w meets the surface at angle theta from the normal.
// Its footprint is w / cos(theta), so the power per unit area (irradiance) scales with cos(theta).
const svg = document.getElementById('svg'), out = document.getElementById('readout');
const OX = 330, OY = 250, R = 190, W = 46, D2R = Math.PI / 180;
let th = 45;                                   // angle from the normal, degrees, -88..88

function el(tag, a, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
function draw() {
  const c = PT.c, t = th * D2R, cos = Math.cos(t);
  svg.textContent = '';
  // surface, hemisphere, normal
  el('line', { x1: 60, y1: OY, x2: 600, y2: OY, stroke: c.muted, 'stroke-width': 1.3 });
  for (let x = 70; x < 600; x += 16) el('line', { x1: x, y1: OY, x2: x - 10, y2: OY + 10, stroke: c.border });
  el('path', { d: `M${OX - R},${OY} A${R},${R} 0 0 1 ${OX + R},${OY}`, fill: 'none', stroke: c.border, 'stroke-dasharray': '4 4' });
  el('line', { x1: OX, y1: OY, x2: OX, y2: OY - 130, stroke: c.muted, 'stroke-dasharray': '4 4' });
  el('path', { d: `M${OX},${OY - 136} l-5,9 h10z`, fill: c.muted });
  el('text', { x: OX + 10, y: OY - 128, class: 'm', fill: c.muted }, 'n');
  // beam: a band of width W along the direction to the light
  const dx = Math.sin(t), dy = -Math.cos(t);          // unit vector from the surface point to the light
  const px = Math.cos(t), py = Math.sin(t);           // perpendicular to it
  const Lx = OX + R * dx, Ly = OY + R * dy;
  const half = W / 2, foot = W / cos / 2;             // half footprint along the surface
  el('path', { d: `M${Lx - px * half},${Ly - py * half} L${Lx + px * half},${Ly + py * half} L${OX + foot},${OY} L${OX - foot},${OY}Z`,
               fill: PT.alpha(c.accent, 0.18), stroke: PT.alpha(c.accent, 0.55), 'stroke-width': 1 });
  // footprint on the surface, opacity = irradiance
  el('rect', { x: OX - foot, y: OY - 3, width: 2 * foot, height: 6, fill: PT.alpha(c.accent, 0.25 + 0.75 * cos) });
  // width labels
  el('text', { x: Lx - px * (half + 14) , y: Ly - py * (half + 14) + 4, 'text-anchor': 'middle', class: 's', fill: c.text }, 'w');
  el('text', { x: OX, y: OY + 28, 'text-anchor': 'middle', class: 's', fill: c.text }, 'w / cos θ');
  // angle arc
  const ar = 52, a0 = -90 * D2R, a1 = (th - 90) * D2R;
  if (Math.abs(th) > 1) {
    el('path', { d: `M${OX + ar * Math.cos(a0)},${OY + ar * Math.sin(a0)} A${ar},${ar} 0 0 ${th > 0 ? 1 : 0} ${OX + ar * Math.cos(a1)},${OY + ar * Math.sin(a1)}`,
                 fill: 'none', stroke: c.text, 'stroke-width': 1.2 });
    const am = (th / 2 - 90) * D2R;
    el('text', { x: OX + (ar + 14) * Math.cos(am), y: OY + (ar + 14) * Math.sin(am) + 5, 'text-anchor': 'middle', class: 'm', fill: c.text }, 'θ');
  }
  // light
  el('circle', { cx: Lx, cy: Ly, r: 10, fill: c.accent, class: 'handle', id: 'h' });
  // irradiance bar
  const bx = 660, bh = 180, by = OY - bh;
  el('rect', { x: bx, y: by, width: 16, height: bh, fill: 'none', stroke: c.muted });
  el('rect', { x: bx, y: by + bh * (1 - cos), width: 16, height: bh * cos, fill: c.accent });
  el('text', { x: bx + 24, y: by + 5, class: 's', fill: c.muted }, '1');
  el('text', { x: bx + 24, y: OY + 4, class: 's', fill: c.muted }, '0');
  el('text', { x: bx + 8, y: OY + 28, 'text-anchor': 'middle', class: 's', fill: c.muted }, 'E / E₀');
  out.innerHTML = `<span class="k">θ =</span> ${Math.abs(th).toFixed(0)}°&emsp;<span class="k">cos θ =</span> <span class="acc">${cos.toFixed(3)}</span>&emsp;<span class="k">footprint =</span> ${(1 / cos).toFixed(2)} w&emsp;<span class="k">irradiance =</span> <span class="acc">${cos.toFixed(3)}</span> × E₀`;
}
function pointer(e) {
  const r = svg.getBoundingClientRect(), s = 760 / r.width;
  const x = (e.clientX - r.left) * s - OX, y = (e.clientY - r.top) * s - OY;
  th = Math.max(-85, Math.min(85, Math.atan2(x, -y) / D2R));
  draw();
}
let drag = false;
svg.addEventListener('pointerdown', e => { drag = true; svg.setPointerCapture(e.pointerId); pointer(e); });
svg.addEventListener('pointermove', e => { if (drag) pointer(e); });
svg.addEventListener('pointerup', () => drag = false);
PT.onTheme(draw);
draw();
</script>
</body>
</html>
