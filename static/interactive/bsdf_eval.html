<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSDF viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; padding: 6px 8px; }
  #view { position: relative; flex: 1; min-height: 0; }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl { cursor: grab; touch-action: none; }
  #gl:active { cursor: grabbing; }
  #ov { pointer-events: none; }
  #bar { display: inline-block; width: 90px; height: 9px; vertical-align: middle; margin: 0 5px; }
  i { font-family: var(--serif); }
</style>
</head>
<body>
<div class="row">
  <select id="mat"></select>
  <div class="grp"><span><i>θ</i><sub>o</sub></span> <input type="range" id="ang" min="0" step="1" value="9"><b id="angVal"></b></div>
  <div class="seg" id="scale"><button data-s="lin" class="on">linear</button><button data-s="log">log</button></div>
  <div class="seg"><button id="sample">sample 200</button><button id="clear">clear</button></div>
</div>
<div id="view"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div class="readout"><span id="lo"></span><span id="bar"></span><span id="hi"></span> <span class="k">sr⁻¹</span>&emsp;<span class="k">∫ <i>f</i><sub>s</sub> |cos <i>θ</i><sub>i</sub>| d<i>ω</i><sub>i</sub> ≈</span> <span id="alb"></span></div>
<div class="hint">Height and colour show <i>f</i><sub>s</sub>(<i>ω</i><sub>i</sub>, <i>ω</i><sub>o</sub>) over the projected hemisphere of <i>ω</i><sub>i</sub>, for the fixed <i>ω</i><sub>o</sub> (arrow); transmission hangs below the disk. Samples are drawn with density ∝ <i>f</i><sub>s</sub> |cos <i>θ</i><sub>i</sub>|. Tabulated with Mitsuba 3. Drag to orbit, ctrl + scroll to zoom.</div>
<script src="/interactive/bsdf_slices.js"></script>
<script src="/interactive/pt/embed.js"></script>
<script>
// Height field of a BSDF slice over the unit disk. A direction w_i = (x, y, z) sits at (x, y): the hemisphere
// projected onto the surface plane, so disk area is projected solid angle and the volume under the surface is
// the albedo. Data: f_s on a (theta, phi) grid, phi in [0, pi], mirrored about the plane of incidence.
const D = BSDF_DATA, R = D.rows, C = D.cols, FC = 2 * C - 1;            // FC columns around the full circle
const DT = Math.PI / 2 / R, DP = Math.PI / (C - 1), H = 0.85, DECADES = 3;
const $ = id => document.getElementById(id);
const glc = $('gl'), ov = $('ov');
const gl = glc.getContext('webgl', { antialias: true, alpha: true });
let logScale = false, mat = D.materials[0], si = 9, sheets = [], fmax = 1, pts = [];
const cam = { az: -1.15, el: 0.5, dist: 3.9 };

// ---- data -----------------------------------------------------------------------------------------------
function decode(s) {                    // -> Float32Array R*C of f_s
  if (!s) return null;
  if (s.f) return s.f;
  const b = atob(s.q), f = new Float32Array(R * C);
  for (let i = 0; i < f.length; i++) { const t = b.charCodeAt(i) / 255; f[i] = s.max * t * t * t * t; }
  return s.f = f;
}
const norm = f => logScale ? Math.max(0, 1 + Math.log10(Math.max(f, 1e-30) / fmax) / DECADES) : f / fmax;
const VIR = ['#440154', '#482878', '#3e4a89', '#31688e', '#26828e', '#1f9e89', '#35b779', '#6ece58', '#b5de2b', '#fde725']
  .map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255));
function viridis(t) {
  t = Math.min(1, Math.max(0, t)) * (VIR.length - 1);
  const i = Math.min(VIR.length - 2, Math.floor(t)), u = t - i;
  return VIR[i].map((v, k) => v + (VIR[i + 1][k] - v) * u);
}
function fAt(f, th, ph) {               // bilinear lookup, ph in [0, 2 pi)
  if (ph > Math.PI) ph = 2 * Math.PI - ph;
  const r = Math.min(R - 1, th / DT), c = Math.min(C - 1, ph / DP);
  const r0 = Math.floor(r), c0 = Math.floor(c), r1 = Math.min(R - 1, r0 + 1), c1 = Math.min(C - 1, c0 + 1), u = r - r0, v = c - c0;
  return (f[r0 * C + c0] * (1 - v) + f[r0 * C + c1] * v) * (1 - u) + (f[r1 * C + c0] * (1 - v) + f[r1 * C + c1] * v) * u;
}
function albedo(f) {                    // integral of f cos(theta) over the hemisphere
  let s = 0;
  for (let r = 0; r < R; r++) {
    const w = Math.sin(r * DT) * Math.cos(r * DT) * DT * DP;
    for (let c = 0; c < C; c++) s += f[r * C + c] * w * (c === 0 || c === C - 1 ? 1 : 2);
  }
  return s;
}

// ---- WebGL ----------------------------------------------------------------------------------------------
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, 'attribute vec3 p; attribute vec3 c; uniform mat4 m; uniform float ps; varying vec3 vc; void main(){ vc = c; gl_Position = m * vec4(p, 1.0); gl_PointSize = ps; }'));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, 'precision mediump float; varying vec3 vc; uniform vec4 u; void main(){ gl_FragColor = u.a > 0.0 ? vec4(u.rgb * u.a, u.a) : vec4(vc, 1.0); }'));
gl.linkProgram(prog); gl.useProgram(prog);
const aP = gl.getAttribLocation(prog, 'p'), aC = gl.getAttribLocation(prog, 'c');
const uM = gl.getUniformLocation(prog, 'm'), uU = gl.getUniformLocation(prog, 'u'), uPS = gl.getUniformLocation(prog, 'ps');
const buf = () => gl.createBuffer();
const B = { pos: [buf(), buf()], col: [buf(), buf()], tri: buf(), wire: buf(), grid: buf(), pts: buf() };
let nTri = 0, nWire = 0, nGrid = 0;

(function staticBuffers() {
  const tri = [], wire = [];
  for (let r = 0; r < R - 1; r++) for (let c = 0; c < FC - 1; c++) {
    const a = r * FC + c, b = a + 1, d = a + FC, e = d + 1;
    tri.push(a, d, b, b, d, e);
  }
  for (let c = 0; c < FC - 1; c++) wire.push((R - 1) * FC + c, (R - 1) * FC + c + 1);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, B.tri); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(tri), gl.STATIC_DRAW); nTri = tri.length;
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, B.wire); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(wire), gl.STATIC_DRAW); nWire = wire.length;
  const g = [];                                                        // polar grid on the plane z = 0
  for (let k = 1; k <= 6; k++) for (let i = 0; i < 96; i++) {
    const rad = Math.sin(k * Math.PI / 12);
    const a = i / 96 * 2 * Math.PI, b = (i + 1) / 96 * 2 * Math.PI;
    g.push(rad * Math.cos(a), rad * Math.sin(a), 0, rad * Math.cos(b), rad * Math.sin(b), 0);
  }
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * Math.PI; g.push(0, 0, 0, Math.cos(a), Math.sin(a), 0); }
  for (let i = 0; i < 36; i++) { const a = i / 36 * 2 * Math.PI; g.push(Math.cos(a), Math.sin(a), 0, 1.03 * Math.cos(a), 1.03 * Math.sin(a), 0); }
  gl.bindBuffer(gl.ARRAY_BUFFER, B.grid); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(g), gl.STATIC_DRAW); nGrid = g.length / 3;
})();

function buildSheets() {
  const s = mat.slices[si];
  sheets = [{ f: decode(s.r), sign: 1 }];
  if (s.t) sheets.push({ f: decode(s.t), sign: -1 });
  fmax = Math.max(...sheets.map(sh => sh.f.reduce((m, v) => Math.max(m, v), 0)));
  sheets.forEach((sh, k) => {
    const pos = new Float32Array(R * FC * 3), col = new Float32Array(R * FC * 3);
    for (let r = 0; r < R; r++) for (let c = 0; c < FC; c++) {
      const th = r * DT, ph = c * DP, t = norm(sh.f[r * C + (c < C ? c : FC - 1 - c)]), i = (r * FC + c) * 3, rgb = viridis(t);
      pos[i] = Math.sin(th) * Math.cos(ph); pos[i + 1] = Math.sin(th) * Math.sin(ph); pos[i + 2] = sh.sign * H * t;
      col[i] = rgb[0]; col[i + 1] = rgb[1]; col[i + 2] = rgb[2];
    }
    // diffuse shading from a fixed light, so the relief of the surface reads without a wireframe
    const at = (r, c) => (r * FC + ((c % (FC - 1)) + FC - 1) % (FC - 1)) * 3, LD = [-0.35, -0.4, 0.85];
    for (let r = 0; r < R; r++) for (let c = 0; c < FC; c++) {
      const a = at(Math.min(R - 1, r + 1), c), b = at(Math.max(0, r - 1), c), e = at(r, c + 1), f = at(r, c - 1);
      const ux = pos[a] - pos[b], uy = pos[a + 1] - pos[b + 1], uz = pos[a + 2] - pos[b + 2];
      const vx = pos[e] - pos[f], vy = pos[e + 1] - pos[f + 1], vz = pos[e + 2] - pos[f + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = Math.hypot(nx, ny, nz);
      const d = l > 1e-9 ? Math.abs(nx * LD[0] + ny * LD[1] + nz * LD[2]) / l : LD[2];
      const sh = 0.5 + 0.5 * d / LD[2] * 0.92, i = (r * FC + c) * 3;
      col[i] *= sh; col[i + 1] *= sh; col[i + 2] *= sh;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, B.pos[k]); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, B.col[k]); gl.bufferData(gl.ARRAY_BUFFER, col, gl.DYNAMIC_DRAW);
    // sampling table: probability of a cell is f * cos(theta) * (solid angle of the cell)
    const cdf = new Float64Array(R * C); let acc = 0;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      acc += sh.f[r * C + c] * Math.sin(r * DT) * Math.cos(r * DT) * (c === 0 || c === C - 1 ? 0.5 : 1);
      cdf[r * C + c] = acc;
    }
    sh.cdf = cdf; sh.alb = albedo(sh.f);
  });
  uploadPts();
  $('angVal').textContent = D.thetaO[si] + '°';
  $('lo').textContent = logScale ? (fmax / 10 ** DECADES).toPrecision(2) : '0';
  $('hi').textContent = fmax.toPrecision(3);
  $('alb').innerHTML = sheets.length > 1
    ? `${(sheets[0].alb + sheets[1].alb).toFixed(2)} <span class="k">(reflected ${sheets[0].alb.toFixed(2)}, transmitted ${sheets[1].alb.toFixed(2)})</span>`
    : sheets[0].alb.toFixed(2);
  requestDraw();
}
function uploadPts() {
  const a = new Float32Array(pts.length * 3);
  pts.forEach((p, i) => {
    const sh = sheets[Math.min(p.k, sheets.length - 1)];
    a[i * 3] = Math.sin(p.th) * Math.cos(p.ph); a[i * 3 + 1] = Math.sin(p.th) * Math.sin(p.ph);
    a[i * 3 + 2] = sh.sign * (H * norm(fAt(sh.f, p.th, p.ph)) + 0.004);
  });
  gl.bindBuffer(gl.ARRAY_BUFFER, B.pts); gl.bufferData(gl.ARRAY_BUFFER, a, gl.DYNAMIC_DRAW);
}
function sample(n) {
  const tot = sheets.reduce((s, sh) => s + sh.alb, 0);
  for (let j = 0; j < n; j++) {
    let k = 0; if (sheets.length > 1 && Math.random() * tot > sheets[0].alb) k = 1;
    const cdf = sheets[k].cdf, u = Math.random() * cdf[cdf.length - 1];
    let lo = 0, hi = cdf.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] >= u) hi = m; else lo = m + 1; }
    const r = Math.floor(lo / C), c = lo - r * C;
    const th = Math.min(Math.PI / 2 - 1e-3, Math.max(0, (r + Math.random() - 0.5) * DT));
    let ph = Math.min(Math.PI, Math.max(0, (c + Math.random() - 0.5) * DP));
    if (Math.random() < 0.5) ph = 2 * Math.PI - ph;
    pts.push({ k, th, ph });
  }
  uploadPts(); requestDraw();
}

// ---- camera ---------------------------------------------------------------------------------------------
let M = new Float32Array(16), W = 1, Hpx = 1;
function updateMatrix() {
  const tz = sheets.length > 1 ? 0 : 0.2, ce = Math.cos(cam.el), se = Math.sin(cam.el), ca = Math.cos(cam.az), sa = Math.sin(cam.az);
  const fwd = [-ce * ca, -ce * sa, -se], right = [-sa, ca, 0], up = [-se * ca, -se * sa, ce];   // right = fwd x z, up = right x fwd
  const eye = [cam.dist * ce * ca, cam.dist * ce * sa, tz + cam.dist * se];
  const f = 1 / Math.tan(0.24), asp = W / Hpx, n = 0.1, fa = 50, sx = asp < 1.5 ? f * asp / 1.5 : f;       // keep the disk in view when narrow
  const V = [right, up, fwd.map(v => -v)].map(a => [a[0], a[1], a[2], -(a[0] * eye[0] + a[1] * eye[1] + a[2] * eye[2])]);
  const P = [[sx / asp, 0, 0, 0], [0, sx, 0, 0], [0, 0, (fa + n) / (n - fa), 2 * fa * n / (n - fa)], [0, 0, -1, 0]];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    let s = 0; for (let k = 0; k < 3; k++) s += P[i][k] * V[k][j];
    if (j === 3) s += P[i][3];
    M[j * 4 + i] = s;
  }
}
function project(p) {
  const x = M[0] * p[0] + M[4] * p[1] + M[8] * p[2] + M[12], y = M[1] * p[0] + M[5] * p[1] + M[9] * p[2] + M[13], w = M[3] * p[0] + M[7] * p[1] + M[11] * p[2] + M[15];
  return [(x / w + 1) / 2 * W, (1 - y / w) / 2 * Hpx];
}

// ---- drawing --------------------------------------------------------------------------------------------
let pending = false;
function requestDraw() { if (!pending && PT.visible) { pending = true; requestAnimationFrame(draw); } }
function bind(posBuf, colBuf) {
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 0, 0);
  if (colBuf) { gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.enableVertexAttribArray(aC); gl.vertexAttribPointer(aC, 3, gl.FLOAT, false, 0, 0); }
  else { gl.disableVertexAttribArray(aC); gl.vertexAttrib3f(aC, 0, 0, 0); }
}
const rgb01 = (c, a) => { const m = PT.alpha(c, 1).match(/[\d.]+/g); return [m[0] / 255, m[1] / 255, m[2] / 255, a]; };
function draw() {
  pending = false;
  const c = PT.c, dpr = Math.min(window.devicePixelRatio || 1, 2);
  updateMatrix();
  gl.viewport(0, 0, glc.width, glc.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniformMatrix4fv(uM, false, M); gl.uniform1f(uPS, 2 * dpr);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1);
  sheets.forEach((sh, k) => {
    gl.uniform4f(uU, 0, 0, 0, 0); bind(B.pos[k], B.col[k]);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, B.tri); gl.drawElements(gl.TRIANGLES, nTri, gl.UNSIGNED_SHORT, 0);
  });
  gl.disable(gl.POLYGON_OFFSET_FILL);
  sheets.forEach((sh, k) => {
    gl.uniform4fv(uU, rgb01(c.muted, 0.6)); bind(B.pos[k], null);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, B.wire); gl.drawElements(gl.LINES, nWire, gl.UNSIGNED_SHORT, 0);
  });
  gl.disable(gl.DEPTH_TEST);
  gl.uniform4f(uU, 1, 1, 1, 0.22); bind(B.grid, null); gl.drawArrays(gl.LINES, 0, nGrid);
  gl.uniform4fv(uU, rgb01(c.muted, 0.35)); gl.drawArrays(gl.LINES, 0, nGrid);
  gl.enable(gl.DEPTH_TEST);
  if (pts.length) { gl.uniform4f(uU, 1, 1, 1, 0.95); bind(B.pts, null); gl.drawArrays(gl.POINTS, 0, pts.length); }
  overlay(c);
}
function overlay(c) {
  const g = PT.fit(ov, W, Hpx);
  g.clearRect(0, 0, W, Hpx);
  g.font = "11px 'Source Code Pro', monospace"; g.textAlign = 'center'; g.textBaseline = 'middle';
  const halo = (s, p) => { g.lineWidth = 3; g.strokeStyle = PT.alpha(c.bg, 0.75); g.lineJoin = 'round'; g.strokeText(s, p[0], p[1]); g.fillText(s, p[0], p[1]); };
  // theta_i along the spoke nearest the viewer, phi_i around the rim
  const a = Math.round(cam.az / (Math.PI / 6)) * (Math.PI / 6);
  g.fillStyle = c.text;
  for (let k = 1; k <= 5; k++) { const rad = Math.sin(k * Math.PI / 12); halo(String(k * 15), project([rad * Math.cos(a), rad * Math.sin(a), 0])); }
  g.fillStyle = c.muted;
  for (let k = -5; k <= 6; k++) { const ph = k * Math.PI / 6; g.fillText(String(k * 30), ...project([1.1 * Math.cos(ph), 1.1 * Math.sin(ph), 0])); }
  // surface normal
  const o = project([0, 0, 0]), nz = project([0, 0, 0.45]);
  g.strokeStyle = g.fillStyle = c.text; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(o[0], o[1]); g.lineTo(nz[0], nz[1]); g.stroke();
  g.font = "italic 300 13px Merriweather, Georgia, serif"; halo('n', [nz[0] + 8, nz[1] - 4]);
  // fixed direction: arrow from the origin
  const to = D.thetaO[si] * Math.PI / 180, d = [Math.sin(to), 0, Math.cos(to)];
  const p0 = project([0, 0, 0]), p1 = project(d.map(v => v * 1.1)), dx = p1[0] - p0[0], dy = p1[1] - p0[1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  g.strokeStyle = g.fillStyle = c.accent; g.lineWidth = 1.8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0] - ux * 8, p1[1] - uy * 8); g.stroke();
  g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p1[0] - ux * 11 - uy * 4.5, p1[1] - uy * 11 + ux * 4.5); g.lineTo(p1[0] - ux * 11 + uy * 4.5, p1[1] - uy * 11 - ux * 4.5); g.closePath(); g.fill();
  g.font = "italic 300 15px Merriweather, Georgia, serif";
  g.fillText('ω', p1[0] + ux * 14, p1[1] + uy * 14);
  g.font = "300 10px Merriweather, Georgia, serif"; g.fillText('o', p1[0] + ux * 14 + 8, p1[1] + uy * 14 + 5);
}
function resize() {
  const r = $('view').getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); Hpx = Math.max(1, r.height);
  glc.width = Math.round(W * dpr); glc.height = Math.round(Hpx * dpr);
  requestDraw();
}
function colourBar() {
  const stops = []; for (let i = 0; i <= 10; i++) stops.push(`rgb(${viridis(i / 10).map(v => Math.round(v * 255)).join(',')})`);
  $('bar').style.background = `linear-gradient(to right, ${stops.join(',')})`;
}

// ---- controls -------------------------------------------------------------------------------------------
D.materials.forEach((m, i) => { const o = document.createElement('option'); o.value = i; o.textContent = m.name; $('mat').appendChild(o); });
$('ang').max = D.thetaO.length - 1;
$('mat').onchange = e => { mat = D.materials[+e.target.value]; pts = []; buildSheets(); };
$('ang').oninput = e => { si = +e.target.value; pts = []; buildSheets(); };
document.querySelectorAll('#scale button').forEach(b => b.onclick = () => {
  logScale = b.dataset.s === 'log'; document.querySelectorAll('#scale button').forEach(x => x.classList.toggle('on', x === b)); buildSheets();
});
$('sample').onclick = () => sample(200);
$('clear').onclick = () => { pts = []; uploadPts(); requestDraw(); };
let drag = null;
glc.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; glc.setPointerCapture(e.pointerId); });
glc.addEventListener('pointerup', () => { drag = null; });
glc.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.az -= (e.clientX - drag[0]) * 0.008;
  cam.el = Math.max(-1.2, Math.min(1.5, cam.el + (e.clientY - drag[1]) * 0.008));
  drag = [e.clientX, e.clientY]; requestDraw();
});
glc.addEventListener('wheel', e => {
  if (!e.ctrlKey && !document.fullscreenElement) return;       // plain scrolling stays with the page
  e.preventDefault(); cam.dist = Math.max(2.2, Math.min(9, cam.dist * Math.exp(e.deltaY * 0.0015))); requestDraw();
}, { passive: false });
{ const q = new URLSearchParams(location.search);              // deep link: ?m=3&a=12&log=1
  if (q.get('m')) { mat = D.materials[+q.get('m')]; $('mat').value = q.get('m'); }
  if (q.get('a')) si = +q.get('a');
  if (q.get('log')) document.querySelector('[data-s=log]').click();
  if (q.get('el')) cam.el = +q.get('el'); }
$('ang').value = si;
PT.onTheme(requestDraw);
PT.onVisible(v => { if (v) requestDraw(); });
new ResizeObserver(resize).observe($('view'));
colourBar(); resize(); buildSheets();
{ const n = +new URLSearchParams(location.search).get('n'); if (n) sample(n); }
</script>
</body>
</html>
