<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BVH construction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  .panes { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-top: 6px; }
  #cv { width: 100%; aspect-ratio: 1.55; cursor: crosshair; }
  #tree { width: 100%; aspect-ratio: 1; }
  .cap { font-size: 13px; color: var(--muted); }
  @media (max-width: 600px) { .panes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="row">
  <div class="seg" id="heur"><button data-h="midpoint">spatial midpoint</button><button data-h="median" class="on">object median</button><button data-h="sah">SAH</button></div>
  <div class="seg"><button id="prev">◀</button><button id="play">build</button><button id="next">▶</button></div>
  <button id="scene">new scene</button>
</div>
<div class="panes">
  <canvas id="cv"></canvas>
  <div><svg id="tree"></svg><div class="cap">hover a box, a triangle or a tree node</div></div>
</div>
<div class="readout" id="readout"></div>
<script src="/interactive/pt/embed.js"></script>
<script>
// Top-down BVH build over 2D triangles. Each node splits along the longer axis of its box.
//  midpoint: split the box in half; median: half the primitives on each side;
//  SAH: the split minimising P(L)·N_L + P(R)·N_R, with P = perimeter ratio
//  (in 2D the chance that a random line crosses a convex box is proportional to its perimeter).
const cv = document.getElementById('cv'), tree = document.getElementById('tree'), out = document.getElementById('readout');
const SW = 1.55, NT = 16;
let tris = [], root = null, steps = [], cur = -1, heur = 'median', timer = 0, hoverNode = -1, hoverTri = -1, ctx, W, H;

const box = () => ({ x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 });
const grow = (b, c) => { b.x0 = Math.min(b.x0, c.x0); b.y0 = Math.min(b.y0, c.y0); b.x1 = Math.max(b.x1, c.x1); b.y1 = Math.max(b.y1, c.y1); return b; };
const perim = b => 2 * Math.max(0, b.x1 - b.x0) + 2 * Math.max(0, b.y1 - b.y0);

function newScene() {
  tris = [];
  for (let i = 0; i < NT; i++) {
    const cx = 0.08 + Math.random() * (SW - 0.16), cy = 0.08 + Math.random() * 0.84, s = 0.05 + Math.random() * 0.06;
    const p = Array.from({ length: 3 }, () => [cx + (Math.random() - 0.5) * 2 * s, cy + (Math.random() - 0.5) * 2 * s]);
    const b = box(); p.forEach(([x, y]) => grow(b, { x0: x, y0: y, x1: x, y1: y }));
    tris.push({ p, b, c: [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2] });
  }
  build();
}
function build() {
  let id = 0; steps = [];
  const mk = (ix, d) => {
    const n = { id: id++, d, ix, b: box(), l: null, r: null };
    ix.forEach(i => grow(n.b, tris[i].b));
    steps.push(n);                                     // a node appears when it is created
    if (ix.length <= 1) return n;
    const ax = n.b.x1 - n.b.x0 > n.b.y1 - n.b.y0 ? 0 : 1;
    const s = ix.slice().sort((a, b) => tris[a].c[ax] - tris[b].c[ax]);
    let k = s.length >> 1;
    if (heur === 'midpoint') {
      const mid = ax ? (n.b.y0 + n.b.y1) / 2 : (n.b.x0 + n.b.x1) / 2;
      k = s.findIndex(i => tris[i].c[ax] > mid); if (k <= 0) k = s.length >> 1;
      n.split = { ax, pos: mid };
    } else if (heur === 'sah') {
      let best = Infinity;
      for (let j = 1; j < s.length; j++) {
        const L = s.slice(0, j).reduce((b, i) => grow(b, tris[i].b), box()), R = s.slice(j).reduce((b, i) => grow(b, tris[i].b), box());
        const cost = perim(L) * j + perim(R) * (s.length - j);
        if (cost < best) { best = cost; k = j; }
      }
      n.split = { ax, pos: (tris[s[k - 1]].c[ax] + tris[s[k]].c[ax]) / 2 };
    } else n.split = { ax, pos: (tris[s[k - 1]].c[ax] + tris[s[k]].c[ax]) / 2 };
    n.l = mk(s.slice(0, k), d + 1); n.r = mk(s.slice(k), d + 1);
    return n;
  };
  root = mk(tris.map((_, i) => i), 0);
  cur = steps.length - 1;
  layoutTree(); draw();
}
const shown = n => n && n.id <= cur;
function sahCost(n) {                                  // expected boxes tested + primitives tested, per random line hitting the root
  const P0 = perim(root.b); let c = 0;
  (function rec(m) { if (!m) return; const p = perim(m.b) / P0; if (m.l) { c += p; rec(m.l); rec(m.r); } else c += p * m.ix.length; })(n);
  return c;
}
function depth(n) { return n ? (n.l ? 1 + Math.max(depth(n.l), depth(n.r)) : 0) : 0; }
function resize() { W = cv.getBoundingClientRect().width; H = W / SW; ctx = PT.fit(cv, W, H); draw(); }
function draw() {
  if (!ctx) return;
  const c = PT.c, s = W / SW, X = x => x * s, Y = y => y * H;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = c.border; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  const path = new Set(); if (hoverNode >= 0) (function f(n) { if (!n) return false; if (n.id === hoverNode || f(n.l) || f(n.r)) { path.add(n.id); return true; } return false; })(root);
  tris.forEach((t, i) => {
    ctx.beginPath(); t.p.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.closePath();
    ctx.fillStyle = i === hoverTri ? PT.alpha(c.accent, 0.55) : PT.alpha(c.text, 0.12); ctx.fill();
    ctx.strokeStyle = PT.alpha(c.text, 0.5); ctx.stroke();
  });
  (function rec(n) {
    if (!shown(n)) return;
    const on = path.has(n.id), last = n.id === cur;
    ctx.strokeStyle = on || last ? c.accent : PT.alpha(c.accent2, 0.35 + 0.65 / (1 + n.d));
    ctx.lineWidth = on || last ? 2.2 : 1.2;
    const pad = 2 * Math.max(0, 3 - n.d) / s;
    ctx.strokeRect(X(n.b.x0 - pad), Y(n.b.y0 - pad), X(n.b.x1 - n.b.x0 + 2 * pad), Y(n.b.y1 - n.b.y0 + 2 * pad));
    if (n.split && last && !shown(n.l)) {
      ctx.setLineDash([5, 4]); ctx.strokeStyle = c.accent; ctx.beginPath();
      if (n.split.ax) { ctx.moveTo(X(n.b.x0), Y(n.split.pos)); ctx.lineTo(X(n.b.x1), Y(n.split.pos)); }
      else { ctx.moveTo(X(n.split.pos), Y(n.b.y0)); ctx.lineTo(X(n.split.pos), Y(n.b.y1)); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    rec(n.l); rec(n.r);
  })(root);
  drawTree(path);
  const full = cur === steps.length - 1;
  out.innerHTML = `<span class="k">node</span> ${cur + 1}/${steps.length}&ensp;<span class="k">depth</span> ${depth(root)}&ensp;<span class="k">SAH cost (relative) =</span> <span class="acc">${full ? sahCost(root).toFixed(2) : '–'}</span>&ensp;<span class="k">vs.</span> ${NT} <span class="k">tests without a BVH</span>`;
}
let pos = {};
function layoutTree() {
  pos = {}; let leaf = 0; const nl = steps.filter(n => !n.l).length, md = depth(root);
  (function rec(n) { if (!n.l) { pos[n.id] = [(leaf++ + 0.5) / nl, n.d / Math.max(1, md)]; return; } rec(n.l); rec(n.r); pos[n.id] = [(pos[n.l.id][0] + pos[n.r.id][0]) / 2, n.d / Math.max(1, md)]; })(root);
}
function drawTree(path) {
  const c = PT.c, Wt = 300, Ht = 300, P = ([x, y]) => [12 + x * (Wt - 24), 14 + y * (Ht - 28)];
  tree.setAttribute('viewBox', `0 0 ${Wt} ${Ht}`);
  let h = '';
  steps.forEach(n => { if (n.l && shown(n.l)) for (const ch of [n.l, n.r]) { const [x1, y1] = P(pos[n.id]), [x2, y2] = P(pos[ch.id]); h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${path.has(ch.id) ? c.accent : c.muted}" stroke-width="${path.has(ch.id) ? 2 : 1}"/>`; } });
  steps.forEach(n => { if (!shown(n)) return; const [x, y] = P(pos[n.id]), on = path.has(n.id) || n.id === cur;
    h += `<circle data-id="${n.id}" cx="${x}" cy="${y}" r="${on ? 6 : 4.5}" fill="${n.l ? c.bg : c.accent2}" stroke="${on ? c.accent : (n.l ? c.text : c.accent2)}" stroke-width="1.6" style="cursor:pointer"/>`; });
  tree.innerHTML = h;
}
tree.addEventListener('pointerover', e => { const id = e.target.dataset && e.target.dataset.id; hoverNode = id != null ? +id : -1; hoverTri = -1; draw(); });
tree.addEventListener('pointerleave', () => { hoverNode = -1; draw(); });
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / W * SW, y = (e.clientY - r.top) / H;
  hoverTri = -1; hoverNode = -1;
  tris.forEach((t, i) => { const [a, b, cc] = t.p, s = (p, q) => (q[0] - p[0]) * (y - p[1]) - (q[1] - p[1]) * (x - p[0]); const d1 = s(a, b), d2 = s(b, cc), d3 = s(cc, a); if ((d1 >= 0 && d2 >= 0 && d3 >= 0) || (d1 <= 0 && d2 <= 0 && d3 <= 0)) hoverTri = i; });
  if (hoverTri >= 0) { const leaf = steps.find(n => !n.l && n.ix[0] === hoverTri && shown(n)); hoverNode = leaf ? leaf.id : -1; }
  else { let best = null; steps.forEach(n => { if (shown(n) && x >= n.b.x0 && x <= n.b.x1 && y >= n.b.y0 && y <= n.b.y1) best = n; }); hoverNode = best ? best.id : -1; }
  draw();
});
cv.addEventListener('pointerleave', () => { hoverTri = -1; hoverNode = -1; draw(); });
function stop() { clearTimeout(timer); timer = 0; document.getElementById('play').textContent = 'build'; document.getElementById('play').classList.remove('on'); }
document.getElementById('play').onclick = () => {
  if (timer) return stop();
  if (cur >= steps.length - 1) cur = 0;
  document.getElementById('play').textContent = 'pause'; document.getElementById('play').classList.add('on');
  const tick = () => { if (cur < steps.length - 1 && PT.visible) { cur++; draw(); timer = setTimeout(tick, 260); } else if (cur < steps.length - 1) timer = setTimeout(tick, 500); else stop(); };
  draw(); timer = setTimeout(tick, 260);
};
document.getElementById('next').onclick = () => { stop(); cur = Math.min(steps.length - 1, cur + 1); draw(); };
document.getElementById('prev').onclick = () => { stop(); cur = Math.max(0, cur - 1); draw(); };
document.getElementById('scene').onclick = () => { stop(); newScene(); };
document.querySelectorAll('#heur button').forEach(b => b.onclick = () => {
  heur = b.dataset.h; document.querySelectorAll('#heur button').forEach(x => x.classList.toggle('on', x === b)); stop(); build();
});
PT.onTheme(draw);
new ResizeObserver(resize).observe(cv);
newScene(); resize();
</script>
</body>
</html>
