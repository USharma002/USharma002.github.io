<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple importance sampling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  svg { width: 100%; height: auto; user-select: none; }
  svg text { font-family: var(--serif); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .s { font-size: 12px; }
  .m { font-style: italic; font-size: 14px; }
  table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin-top: 4px; }
  td { padding: 1px 14px 1px 0; }
  tr.cur td { color: var(--accent); }
  td.k { color: var(--muted); font-family: var(--serif); }
</style>
</head>
<body>
<div class="row">
  <div class="seg" id="heur">
    <button data-h="avg">no MIS (average)</button><button data-h="balance" class="on">balance</button><button data-h="power">power β=2</button><button data-h="max">maximum</button>
  </div>
  <div class="grp">samples from p₁ : p₂ <input type="range" id="mix" min="0" max="100" step="5" value="50"><b id="mixv"></b></div>
  <div class="seg"><button id="resample">resample</button><button id="newf">new f₁, f₂</button></div>
</div>
<svg id="svg" viewBox="0 0 760 300"></svg>
<table id="tab"></table>
<script src="/interactive/pt/embed.js"></script>
<script>
// Integrand f = f1 · f2 on [0,1]. Technique 1 samples p1 ∝ f1 (broad), technique 2 samples p2 ∝ f2 (narrow).
// Multi-sample estimator F = Σ_i (1/n_i) Σ_j w_i(X_ij) f(X_ij)/p_i(X_ij).
// Its exact variance Σ_i (1/n_i) [∫ w_i² f²/p_i − (∫ w_i f)²] is computed by quadrature for every heuristic.
const svg = document.getElementById('svg'), tab = document.getElementById('tab'), mix = document.getElementById('mix');
const N = 40, Q = 3000;
let g1, g2, Z1, Z2, I, H = 'balance', smp = [];
const gau = (x, g) => Math.exp(-0.5 * ((x - g.m) / g.s) ** 2);
const f1 = x => gau(x, g1), f2 = x => gau(x, g2), f = x => f1(x) * f2(x);
const p1 = x => f1(x) / Z1, p2 = x => f2(x) / Z2;
function counts() { const n1 = Math.round(N * (100 - +mix.value) / 100); return [n1, N - n1]; }
function weights(x, h, n1, n2) {
  const q1 = n1 * p1(x), q2 = n2 * p2(x);
  if (h === 'avg') return [n1 / N, n2 / N];
  if (h === 'max') return q1 >= q2 ? [1, 0] : [0, 1];
  const b = h === 'power' ? 2 : 1, a1 = q1 ** b, a2 = q2 ** b, s = a1 + a2 || 1;
  return [a1 / s, a2 / s];
}
function variance(h) {
  const [n1, n2] = counts(); let v = 0;
  for (const [n, p, k] of [[n1, p1, 0], [n2, p2, 1]]) {
    if (!n) continue;
    let m1 = 0, m2 = 0;
    for (let i = 0; i < Q; i++) {
      const x = (i + 0.5) / Q, w = weights(x, h, n1, n2)[k], pv = p(x);
      if (pv <= 0) continue;
      m1 += w * f(x) / Q; m2 += (w * f(x)) ** 2 / pv / Q;
    }
    v += (m2 - m1 * m1) / n;
  }
  // a technique with no samples cannot cover the part of f it was responsible for: report the bias instead
  return v;
}
function bias(h) {
  const [n1, n2] = counts(); let s = 0;
  for (let i = 0; i < Q; i++) { const x = (i + 0.5) / Q, w = weights(x, h, n1, n2); s += ((n1 ? w[0] : 0) + (n2 ? w[1] : 0)) * f(x) / Q; }
  return s - I;
}
function truncGauss(g) { for (;;) { const u = 1 - Math.random(), v = Math.random(); const x = g.m + g.s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); if (x >= 0 && x <= 1) return x; } }
function newF() {
  g1 = { m: 0.25 + 0.5 * Math.random(), s: 0.12 + 0.12 * Math.random() };
  g2 = { m: 0.15 + 0.7 * Math.random(), s: 0.02 + 0.04 * Math.random() };
  Z1 = Z2 = I = 0;
  for (let i = 0; i < Q; i++) { const x = (i + 0.5) / Q; Z1 += f1(x) / Q; Z2 += f2(x) / Q; I += f(x) / Q; }
  resample();
}
function resample() {
  const [n1, n2] = counts();
  smp = [...Array.from({ length: n1 }, () => ({ x: truncGauss(g1), t: 0 })), ...Array.from({ length: n2 }, () => ({ x: truncGauss(g2), t: 1 }))];
  draw();
}
function el(tag, at, txt) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in at) e.setAttribute(k, at[k]);
  if (txt != null) e.textContent = txt;
  svg.appendChild(e); return e;
}
function curve(fn, sc, X, Y) { let d = ''; for (let i = 0; i <= 300; i++) d += (i ? ' L' : 'M') + `${X(i / 300)},${Y(fn(i / 300) * sc)}`; return d; }
function draw() {
  const c = PT.c, [n1, n2] = counts();
  document.getElementById('mixv').textContent = `${n1} : ${n2}`;
  svg.textContent = '';
  const L = 40, R = 740, T = 14, B = 200, X = x => L + (R - L) * x;
  let pm = 0; for (let i = 0; i <= 300; i++) pm = Math.max(pm, p1(i / 300), p2(i / 300));
  const Y = y => B - (B - T) * y / (pm * 1.05);
  el('line', { x1: L, y1: B, x2: R, y2: B, stroke: c.muted });
  let fm = 0; for (let i = 0; i <= 300; i++) fm = Math.max(fm, f(i / 300));
  el('path', { d: curve(f, pm * 0.8 / fm, X, Y) + ` L${X(1)},${B} L${X(0)},${B}Z`, fill: PT.alpha(c.text, 0.12), stroke: c.text, 'stroke-width': 1.5 });
  el('path', { d: curve(p1, 1, X, Y), fill: 'none', stroke: c.accent, 'stroke-width': 2 });
  el('path', { d: curve(p2, 1, X, Y), fill: 'none', stroke: c.accent2, 'stroke-width': 2 });
  el('text', { x: R, y: T + 6, 'text-anchor': 'end', class: 'm', fill: c.accent }, 'p₁ ∝ f₁');
  el('text', { x: R, y: T + 24, 'text-anchor': 'end', class: 'm', fill: c.accent2 }, 'p₂ ∝ f₂');
  el('text', { x: R, y: T + 42, 'text-anchor': 'end', class: 'm', fill: c.text }, 'f = f₁ f₂ (scaled)');
  // sample contributions w_i f / (n_i p_i), drawn as bars below the axis
  const contrib = smp.map(s => { const w = weights(s.x, H, n1, n2)[s.t], n = s.t ? n2 : n1, p = s.t ? p2(s.x) : p1(s.x); return w * f(s.x) / (n * p); });
  const cm = Math.max(2 * I / N, ...contrib), CB = 292, CT = 222, CY = v => CB - (CB - CT) * Math.min(1, v / cm);
  el('text', { x: L - 6, y: CB, 'text-anchor': 'end', class: 's', fill: c.muted }, '0');
  el('line', { x1: L, y1: CY(I / N), x2: R, y2: CY(I / N), stroke: c.muted, 'stroke-dasharray': '4 4' });
  el('text', { x: L - 6, y: CY(I / N) + 4, 'text-anchor': 'end', class: 'm', fill: c.muted }, 'I/N');
  smp.forEach((s, i) => {
    const col = s.t ? c.accent2 : c.accent;
    el('line', { x1: X(s.x), y1: B, x2: X(s.x), y2: B + 7, stroke: col, 'stroke-width': 1.5 });
    el('line', { x1: X(s.x), y1: CB, x2: X(s.x), y2: CY(contrib[i]), stroke: col, 'stroke-width': 2, 'stroke-opacity': 0.8 });
    if (contrib[i] > cm) el('text', { x: X(s.x), y: CT - 3, 'text-anchor': 'middle', class: 's', fill: col }, '↑');
  });
  const est = contrib.reduce((a, b) => a + b, 0);
  // exact variance of every heuristic for the current allocation
  const names = { avg: 'no MIS (average)', balance: 'balance', power: 'power β=2', max: 'maximum' };
  let rows = `<tr><td class="k">heuristic</td><td class="k">Var[F]</td><td class="k">relative std. error</td><td class="k">bias</td></tr>`;
  for (const h of ['avg', 'balance', 'power', 'max']) {
    const v = variance(h), b = bias(h);
    rows += `<tr class="${h === H ? 'cur' : ''}"><td class="k">${names[h]}</td><td>${v.toExponential(2)}</td><td>${(Math.sqrt(Math.max(0, v)) / I * 100).toFixed(1)}%</td><td>${Math.abs(b) < 1e-9 * I + 1e-12 ? '0' : (b / I * 100).toFixed(1) + '%'}</td></tr>`;
  }
  tab.innerHTML = rows + `<tr><td class="k">this run</td><td colspan="3">F = ${est.toExponential(3)}&ensp;(I = ${I.toExponential(3)}, N = ${N})</td></tr>`;
}
document.querySelectorAll('#heur button').forEach(b => b.onclick = () => {
  H = b.dataset.h; document.querySelectorAll('#heur button').forEach(x => x.classList.toggle('on', x === b)); draw();
});
mix.oninput = resample;
document.getElementById('resample').onclick = resample;
document.getElementById('newf').onclick = newF;
PT.onTheme(draw);
newF();
</script>
</body>
</html>
