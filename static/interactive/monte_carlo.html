<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carlo estimate of pi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Source+Code+Pro:wght@400;700&display=swap">
<link rel="stylesheet" href="/interactive/pt/embed.css">
<style>
  body { padding: 6px 8px; }
  .panes { display: grid; grid-template-columns: 1fr 1.35fr; gap: 18px; margin-top: 6px; }
  .cap { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  canvas { width: 100%; }
  #sq { aspect-ratio: 1; }
  #gr { aspect-ratio: 1.35; }
</style>
</head>
<body>
<div class="row">
  <div class="seg"><button id="run" class="on">run</button><button id="reset">reset</button></div>
  <span class="readout" id="readout"></span>
</div>
<div class="panes">
  <div><div class="cap">uniform samples in the unit square</div><canvas id="sq"></canvas></div>
  <div><div class="cap">estimate 4 · (inside / N) against N (log scale), with π ± 2σ/√N</div><canvas id="gr"></canvas></div>
</div>
<script src="/interactive/pt/embed.js"></script>
<script>
// Estimate pi = 4 * P(point in quarter disc). Each sample is a Bernoulli trial with p = pi/4,
// so one sample of 4*[inside] has standard deviation sigma = 4 sqrt(p(1-p)) and the mean of N
// samples has standard error sigma / sqrt(N).
const sq = document.getElementById('sq'), gr = document.getElementById('gr'), out = document.getElementById('readout');
const MAXPTS = 20000, MAXN = 200000;
const pts = new Float32Array(MAXPTS * 2);
let N = 0, inside = 0, hist = [], running = true, raf = 0;
const P = Math.PI / 4, SIG = 4 * Math.sqrt(P * (1 - P));
let sctx, gctx, SW, GW, GH;

function layout() {
  SW = sq.getBoundingClientRect().width; GW = gr.getBoundingClientRect().width; GH = GW / 1.35;
  sctx = PT.fit(sq, SW, SW); gctx = PT.fit(gr, GW, GH);
  redrawSquare(); drawGraph();
}
function redrawSquare() {
  const c = PT.c;
  sctx.clearRect(0, 0, SW, SW);
  sctx.strokeStyle = c.muted; sctx.lineWidth = 1; sctx.strokeRect(0.5, 0.5, SW - 1, SW - 1);
  for (let i = 0; i < Math.min(N, MAXPTS); i++) dot(pts[2 * i], pts[2 * i + 1]);
  arc();
}
function arc() {
  sctx.strokeStyle = PT.c.text; sctx.lineWidth = 1.5;
  sctx.beginPath(); sctx.arc(0, SW, SW, -Math.PI / 2, 0); sctx.stroke();
}
function dot(x, y) {
  const inq = x * x + y * y <= 1;
  sctx.fillStyle = inq ? PT.c.accent : PT.alpha(PT.c.muted, 0.6);
  sctx.fillRect(x * SW - 1, (1 - y) * SW - 1, 2, 2);
}
function drawGraph() {
  const c = PT.c, L = 46, R = 8, T = 8, B = 26, w = GW - L - R, h = GH - T - B;
  const lo = 2.6, hi = 3.7, X = n => L + w * Math.log10(n) / Math.log10(MAXN), Y = v => T + h * (hi - Math.min(hi, Math.max(lo, v))) / (hi - lo);
  gctx.clearRect(0, 0, GW, GH);
  gctx.font = '11px "Source Code Pro", monospace'; gctx.fillStyle = c.muted; gctx.strokeStyle = c.border; gctx.lineWidth = 1;
  for (let e = 0; e <= 5; e++) { const x = X(10 ** e); gctx.beginPath(); gctx.moveTo(x, T); gctx.lineTo(x, T + h); gctx.stroke(); gctx.textAlign = 'center'; gctx.fillText('10' + '⁰¹²³⁴⁵'[e], x, GH - 8); }
  for (const v of [2.8, 3.0, 3.2, 3.4, 3.6]) { gctx.textAlign = 'right'; gctx.fillText(v.toFixed(1), L - 6, Y(v) + 4); }
  // standard-error band
  gctx.fillStyle = PT.alpha(c.accent2, 0.15); gctx.beginPath();
  for (let i = 0; i <= 100; i++) { const n = 10 ** (5.3 * i / 100); gctx.lineTo(X(n), Y(Math.PI + 2 * SIG / Math.sqrt(n))); }
  for (let i = 100; i >= 0; i--) { const n = 10 ** (5.3 * i / 100); gctx.lineTo(X(n), Y(Math.PI - 2 * SIG / Math.sqrt(n))); }
  gctx.fill();
  gctx.strokeStyle = c.accent2; gctx.setLineDash([5, 4]); gctx.beginPath(); gctx.moveTo(L, Y(Math.PI)); gctx.lineTo(L + w, Y(Math.PI)); gctx.stroke(); gctx.setLineDash([]);
  gctx.fillStyle = c.accent2; gctx.textAlign = 'left'; gctx.fillText('π', L + w - 12, Y(Math.PI) - 5);
  if (hist.length > 1) {
    gctx.strokeStyle = c.accent; gctx.lineWidth = 1.6; gctx.beginPath();
    hist.forEach(([n, v], i) => i ? gctx.lineTo(X(n), Y(v)) : gctx.moveTo(X(n), Y(v)));
    gctx.stroke();
  }
  gctx.strokeStyle = c.muted; gctx.lineWidth = 1; gctx.strokeRect(L + 0.5, T + 0.5, w, h);
}
function step() {
  raf = 0;
  if (!running || !PT.visible) return;
  const batch = Math.max(1, Math.ceil(N / 40));       // grow the batch so the log-axis advances evenly
  for (let k = 0; k < batch && N < MAXN; k++) {
    const x = Math.random(), y = Math.random();
    if (x * x + y * y <= 1) inside++;
    if (N < MAXPTS) { pts[2 * N] = x; pts[2 * N + 1] = y; dot(x, y); }
    N++;
  }
  hist.push([N, 4 * inside / N]);
  arc(); drawGraph(); readout();
  if (N >= MAXN) { setRun(false); return; }
  raf = requestAnimationFrame(step);
}
function readout() {
  const est = N ? 4 * inside / N : 0;
  out.innerHTML = `<span class="k">N =</span> ${N.toLocaleString()}&ensp;<span class="k">estimate =</span> <span class="acc">${est.toFixed(5)}</span>&ensp;<span class="k">error =</span> ${N ? (est - Math.PI).toFixed(5) : '–'}&ensp;<span class="k">σ/√N =</span> ${N ? (SIG / Math.sqrt(N)).toFixed(5) : '–'}`;
}
function setRun(v) { running = v; document.getElementById('run').classList.toggle('on', v); document.getElementById('run').textContent = v ? 'pause' : 'run'; if (v && !raf) raf = requestAnimationFrame(step); }
document.getElementById('run').onclick = () => setRun(!running || N >= MAXN ? (N >= MAXN ? (reset(), true) : true) : false);
document.getElementById('reset').onclick = () => { reset(); setRun(true); };
function reset() { N = 0; inside = 0; hist = []; redrawSquare(); drawGraph(); readout(); }
PT.onTheme(() => { redrawSquare(); drawGraph(); });
PT.onVisible(v => { if (v && running && !raf) raf = requestAnimationFrame(step); });
new ResizeObserver(layout).observe(document.body);
layout(); readout(); setRun(true);
</script>
</body>
</html>
