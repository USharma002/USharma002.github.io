baseURL = "https://example.com/" # Replace with your actual base URL
title = "Neural Notes"
theme = ["PaperMod"]

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true # Good for code highlighting if you use it
# mainsections = ["posts"] # Uncomment and adjust if you have specific main sections

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    # title = "My Site" # Optional: Override global title for this language
    [[languages.en.menu.main]]
      name = "Home"
      url = "/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Posts"
      url = "/posts/" # Assuming you have a 'posts' section
      weight = 5
    [[languages.en.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 15

[params]
  defaultTheme = "auto" # Options: "light", "dark", "auto"
  ShowReadingTime = true
  ShowShareButtons = false # Set to true if you want share buttons
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "Welcome! 👋"
    Content = "This is a minimal test PaperMod site. Will upload about Computer Vision, Computer Graphics and Deep Learning!"

  # Add a few social icons if you like, otherwise remove this section
  # [[params.socialIcons]]
  #   name = "github"
  #   url = "https://github.com/USharma002"

[outputs]
  home = ["HTML", "RSS", "JSON"] # JSON is good for search functionality in PaperMod

[markup]
  [markup.goldmark.renderer]
    unsafe = true # Usually needed for themes that allow raw HTML in markdown
  [markup.highlight]
    noClasses = false
    # style = "monokai" # Or any other Chroma style