baseURL = "https://USharma002.github.io/"
title = "USharma Notes"
theme = ["PaperMod"]

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    [[languages.en.menu.main]]
      name = "Posts"
      url = "/"
      weight = 5
    [[languages.en.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 15
    [[languages.en.menu.main]]
      name = "Archive"
      url = "/archives/"
      weight = 15
    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 20

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  paginate = 20
  ShowPageNums = true
  separator = true
  math = true
  comments = true

  [params.homeInfoParams]
    Title = "Welcome! 👋"
    Content = "This is an archive of my online notes on Computer Vision, Computer Graphics and Deep Learning!"
  
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.3
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]
  
[outputs]
  home = ["HTML", "RSS", "JSON"]
  
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  
  [markup.highlight]
    noClasses = false
  
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
