<script>
document.addEventListener('DOMContentLoaded', function() {
    var tocEl = document.querySelector('.toc');
    var content = document.querySelector('.post-content');
    if (!tocEl || !content) return;

    // 1. Build sidebar TOC from the inline TOC's HTML
    var sidebar = document.createElement('div');
    sidebar.className = 'agn-sidetoc';

    // "Contents" label
    var label = document.createElement('span');
    label.className = 'agn-sidetoc-label';
    label.textContent = 'Contents';
    sidebar.appendChild(label);

    var linksWrap = document.createElement('div');
    linksWrap.className = 'agn-sidetoc-links';
    sidebar.appendChild(linksWrap);

    // Clone the list content from PaperMod's TOC (inside .inner or details)
    var inner = tocEl.querySelector('.inner');
    if (inner) {
        var lists = inner.querySelectorAll(':scope > ul, :scope > nav');
        lists.forEach(function(el) {
            linksWrap.appendChild(el.cloneNode(true));
        });
    }

    document.body.appendChild(sidebar);

    var tocScrollTarget = null;
    var tocScrollClearTimer = null;
    var tocScrollFrame = null;
    var tocScrollObserver = null;
    var tocScrollFallbackTimer = null;
    var tocScrollFallbackTicks = 0;
    var tocScrollFallbackLimit = 12;

    // Keep TOC navigation pinned while lazy content changes the article height.
    function stopTocScrollTracking() {
        tocScrollTarget = null;
        tocScrollFallbackTicks = 0;

        if (tocScrollClearTimer) {
            clearTimeout(tocScrollClearTimer);
            tocScrollClearTimer = null;
        }

        if (tocScrollFrame) {
            cancelAnimationFrame(tocScrollFrame);
            tocScrollFrame = null;
        }

        if (tocScrollFallbackTimer) {
            clearInterval(tocScrollFallbackTimer);
            tocScrollFallbackTimer = null;
        }

        if (tocScrollObserver) {
            tocScrollObserver.disconnect();
            tocScrollObserver = null;
        }
    }

    function alignTocScrollTarget() {
        if (!tocScrollTarget || !document.contains(tocScrollTarget)) {
            stopTocScrollTracking();
            return;
        }

        var targetTop = Math.max(0, tocScrollTarget.getBoundingClientRect().top + window.scrollY - clickScrollOffset);
        if (Math.abs(window.scrollY - targetTop) > 2) {
            window.scrollTo({ top: targetTop, behavior: 'auto' });
        }
    }

    function queueTocScrollAlignment() {
        if (!tocScrollTarget) return;

        if (tocScrollFrame) {
            cancelAnimationFrame(tocScrollFrame);
        }

        tocScrollFrame = requestAnimationFrame(function() {
            tocScrollFrame = null;
            alignTocScrollTarget();
        });
    }

    function scheduleTocScrollClear() {
        if (!tocScrollTarget) return;

        if (tocScrollClearTimer) {
            clearTimeout(tocScrollClearTimer);
        }

        tocScrollClearTimer = setTimeout(function() {
            stopTocScrollTracking();
        }, 750);
    }

    function startTocScroll(target) {
        stopTocScrollTracking();
        tocScrollTarget = target;

        alignTocScrollTarget();

        if (typeof ResizeObserver !== 'undefined') {
            tocScrollObserver = new ResizeObserver(function() {
                if (!tocScrollTarget) return;
                queueTocScrollAlignment();
                scheduleTocScrollClear();
            });
            tocScrollObserver.observe(content);
            scheduleTocScrollClear();
        } else {
            tocScrollFallbackTimer = setInterval(function() {
                if (!tocScrollTarget) {
                    stopTocScrollTracking();
                    return;
                }

                alignTocScrollTarget();
                tocScrollFallbackTicks++;

                if (tocScrollFallbackTicks >= tocScrollFallbackLimit) {
                    stopTocScrollTracking();
                }
            }, 150);
        }
    }

    sidebar.addEventListener('click', function(e) {
        var anchor = e.target.closest('a[href^="#"]');
        if (!anchor) return;

        var id = anchor.getAttribute('href').slice(1);
        if (!id) return;

        var target = document.getElementById(decodeURIComponent(id));
        if (!target) return;

        e.preventDefault();
        e.stopImmediatePropagation();

        startTocScroll(target);

        history.pushState(null, null, `#${id}`);
    }, true);

    // 2. Get all headings in post-content and all links in sidebar
    var headers = Array.prototype.slice.call(content.querySelectorAll('h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]'));
    if (!headers.length) return;

    var lastActiveId = '';
    var headerHeight = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-height')) || 60);
    var activeHeaderOffset = headerHeight + 40;
    var clickScrollOffset = headerHeight + 8;
    var headerPositions = [];

    // Hide all nested lists initially
    var nestedUls = sidebar.querySelectorAll('ul ul');
    for (var i = 0; i < nestedUls.length; i++) {
        nestedUls[i].style.display = 'none';
    }

    function refreshHeaderPositions() {
        headerPositions = new Array(headers.length);
        for (var i = 0; i < headers.length; i++) {
            headerPositions[i] = {
                id: headers[i].getAttribute('id') || '',
                top: headers[i].getBoundingClientRect().top + window.scrollY
            };
        }
    }

    function findActiveHeaderId() {
        var currentId = '';
        var currentTop = window.scrollY + activeHeaderOffset;

        for (var i = 0; i < headerPositions.length; i++) {
            if (headerPositions[i].top <= currentTop) {
                currentId = headerPositions[i].id;
            } else {
                break;
            }
        }

        return currentId;
    }

    function applyActiveState(currentId) {
        if (currentId === lastActiveId) return;
        lastActiveId = currentId;

        // Clear old state.
        var highlighted = sidebar.querySelectorAll('a.active, a.semi_active');
        for (var i = 0; i < highlighted.length; i++) {
            highlighted[i].classList.remove('active', 'semi_active');
            var oldChild = highlighted[i].parentElement.querySelector(':scope > ul');
            if (oldChild) oldChild.style.display = 'none';
        }

        if (!currentId) return;

        var activeLink = sidebar.querySelector('a[href="#' + currentId + '"]');
        if (!activeLink) return;

        // Walk up and mark active parent chain.
        var el = activeLink.parentElement;
        var depth = 0;
        while (el && el !== sidebar) {
            if (el.tagName === 'LI') {
                var link = el.querySelector(':scope > a');
                if (link) {
                    link.classList.add(depth === 0 ? 'active' : 'semi_active');
                    var childUl = el.querySelector(':scope > ul');
                    if (childUl) childUl.style.display = 'block';
                }
                depth++;
            }
            el = el.parentElement;
        }
    }

    // 3. Scroll handler
    var ticking = false;

    function onScroll() {
        if (ticking) return;
        ticking = true;

        requestAnimationFrame(function() {
            var currentId = findActiveHeaderId();
            applyActiveState(currentId);
            ticking = false;
        });
    }

    if (typeof ResizeObserver !== 'undefined') {
        var layoutObserver = new ResizeObserver(function() {
            refreshHeaderPositions();
            onScroll();
        });
        layoutObserver.observe(content);

        window.addEventListener('beforeunload', function() {
            layoutObserver.disconnect();
        });
    }

    window.addEventListener('resize', function() {
        refreshHeaderPositions();
        onScroll();
    }, { passive: true });
    window.addEventListener('load', function() {
        refreshHeaderPositions();
        onScroll();
    });

    refreshHeaderPositions();
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // Initial check
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Map all figures on the page to their natural order
    var figures = document.querySelectorAll("figure[id]");
    var figMap = {};
    figures.forEach(function(fig, index) {
        figMap[fig.id] = index + 1;
    });

    // 2. Find all figure references and inject the correct number
    var refs = document.querySelectorAll(".auto-fig-ref");
    refs.forEach(function(ref) {
        var targetId = ref.getAttribute("data-target");
        if (figMap[targetId]) {
            ref.textContent = figMap[targetId];
        } else {
            ref.textContent = "??"; // Shows if you have a typo in the ID
            ref.style.color = "red";
        }
    });
});
</script>
