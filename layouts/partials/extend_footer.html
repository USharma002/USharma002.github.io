<script>
document.addEventListener('DOMContentLoaded', function() {
    var tocEl = document.querySelector('.toc');
    var content = document.querySelector('.post-content');
    if (!tocEl || !content) return;

    // 1. Build sidebar TOC from the inline TOC's HTML
    var sidebar = document.createElement('div');
    sidebar.className = 'agn-sidetoc';

    // "Contents" label
    var label = document.createElement('span');
    label.className = 'agn-sidetoc-label';
    label.textContent = 'Contents';
    sidebar.appendChild(label);

    var linksWrap = document.createElement('div');
    linksWrap.className = 'agn-sidetoc-links';
    sidebar.appendChild(linksWrap);

    // Clone the list content from PaperMod's TOC (inside .inner or details)
    var inner = tocEl.querySelector('.inner');
    if (inner) {
        var lists = inner.querySelectorAll(':scope > ul, :scope > nav');
        lists.forEach(function(el) {
            linksWrap.appendChild(el.cloneNode(true));
        });
    }

    document.body.appendChild(sidebar);

    // 2. Get all headings in post-content and all links in sidebar
    var headers = Array.prototype.slice.call(content.querySelectorAll('h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]'));
    if (!headers.length) return;

    var lastActiveId = '';
    var activeHeaderOffset = 80;

    // Hide all nested lists initially
    var nestedUls = sidebar.querySelectorAll('ul ul');
    for (var i = 0; i < nestedUls.length; i++) {
        nestedUls[i].style.display = 'none';
    }

    function findActiveHeaderId() {
        var currentId = '';

        for (var i = 0; i < headers.length; i++) {
            var top = headers[i].getBoundingClientRect().top;
            if (top <= activeHeaderOffset) {
                currentId = headers[i].getAttribute('id') || '';
            } else {
                break;
            }
        }

        return currentId;
    }

    function applyActiveState(currentId) {
        if (currentId === lastActiveId) return;
        lastActiveId = currentId;

        // Clear old state.
        var highlighted = sidebar.querySelectorAll('a.active, a.semi_active');
        for (var i = 0; i < highlighted.length; i++) {
            highlighted[i].classList.remove('active', 'semi_active');
            var oldChild = highlighted[i].parentElement.querySelector(':scope > ul');
            if (oldChild) oldChild.style.display = 'none';
        }

        if (!currentId) return;

        var activeLink = sidebar.querySelector('a[href="#' + currentId + '"]');
        if (!activeLink) return;

        // Walk up and mark active parent chain.
        var el = activeLink.parentElement;
        var depth = 0;
        while (el && el !== sidebar) {
            if (el.tagName === 'LI') {
                var link = el.querySelector(':scope > a');
                if (link) {
                    link.classList.add(depth === 0 ? 'active' : 'semi_active');
                    var childUl = el.querySelector(':scope > ul');
                    if (childUl) childUl.style.display = 'block';
                }
                depth++;
            }
            el = el.parentElement;
        }
    }

    // 3. Scroll handler
    var ticking = false;

    function onScroll() {
        if (ticking) return;
        ticking = true;

        requestAnimationFrame(function() {
            var currentId = findActiveHeaderId();
            applyActiveState(currentId);
            ticking = false;
        });
    }

    if (typeof ResizeObserver !== 'undefined') {
        var layoutObserver = new ResizeObserver(function() {
            onScroll();
        });
        layoutObserver.observe(content);

        window.addEventListener('beforeunload', function() {
            layoutObserver.disconnect();
        });
    }

    window.addEventListener('resize', onScroll, { passive: true });
    window.addEventListener('load', onScroll);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // Initial check
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var iframes = document.querySelectorAll('.post-content iframe, .page-content iframe, .archive iframe, .single iframe');
    if (!iframes.length) return;

    for (var i = 0; i < iframes.length; i++) {
        if (!iframes[i].hasAttribute('loading')) {
            iframes[i].setAttribute('loading', 'lazy');
        }
        if (!iframes[i].hasAttribute('fetchpriority')) {
            iframes[i].setAttribute('fetchpriority', 'low');
        }
    }

    function parsePositiveNumber(value) {
        var n = Number(value);
        return Number.isFinite(n) && n > 0 ? n : null;
    }

    function getHostBackgroundColor(iframe) {
        var host = iframe.closest('.post-content, .page-content, .archive, .single') || document.body;
        var color = getComputedStyle(host).backgroundColor;
        if (!color || color === 'rgba(0, 0, 0, 0)' || color === 'transparent') {
            color = getComputedStyle(document.body).backgroundColor;
        }
        return color || '#ffffff';
    }

    function shouldBlendIframe(iframe) {
        var explicit = iframe.getAttribute('data-iframe-blend');
        if (explicit === 'true') return true;
        if (explicit === 'false') return false;

        var src = (iframe.getAttribute('src') || '').toLowerCase();
        return src.indexOf('/interactive/vmf.html') !== -1;
    }

    function harmonizeSameOriginIframe(iframe, doc) {
        if (!doc || !doc.head) return;

        var styleId = 'copilot-embedded-iframe-theme';
        var existing = doc.getElementById(styleId);
        if (!existing) {
            existing = doc.createElement('style');
            existing.id = styleId;
            doc.head.appendChild(existing);
        }

        var bg = getHostBackgroundColor(iframe);
        existing.textContent = [
            'html, body {',
            '  background: ' + bg + ' !important;',
            '}',
            'body {',
            '  margin: 0;',
            '}'
        ].join('\n');
    }

    function getSameOriginDocument(iframe) {
        try {
            return iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document) || null;
        } catch (e) {
            return null;
        }
    }

    function getSameOriginContentHeight(doc) {
        if (!doc || !doc.documentElement) return null;

        var body = doc.body;
        var docHeight = Math.max(
            doc.documentElement.scrollHeight || 0,
            doc.documentElement.offsetHeight || 0,
            doc.documentElement.clientHeight || 0,
            body ? body.scrollHeight : 0,
            body ? body.offsetHeight : 0,
            body ? body.clientHeight : 0
        );

        return docHeight > 0 ? Math.round(docHeight) : null;
    }

    function computeAspectRatio(iframe) {
        var cached = parsePositiveNumber(iframe.getAttribute('data-computed-aspect'));
        if (cached) return cached;

        var w = parsePositiveNumber(iframe.getAttribute('width'));
        var h = parsePositiveNumber(iframe.getAttribute('height'));
        if (w && h) return h / w;

        var dataAspect = iframe.getAttribute('data-aspect');
        if (dataAspect && dataAspect.indexOf('/') > -1) {
            var parts = dataAspect.split('/');
            var aw = parsePositiveNumber(parts[0]);
            var ah = parsePositiveNumber(parts[1]);
            if (aw && ah) return ah / aw;
        }

        // If only height is provided, derive ratio from initial rendered width.
        if (h) {
            var currentWidth = iframe.clientWidth;
            if (currentWidth > 0) {
                var derived = h / currentWidth;
                iframe.setAttribute('data-computed-aspect', String(derived));
                return derived;
            }
        }

        return 9 / 16;
    }

    function resizeIframe(iframe) {
        var ratio = computeAspectRatio(iframe);
        var width = iframe.clientWidth;
        if (!width) return;

        var fallbackHeight = Math.round(width * ratio);
        var explicitHeight = parsePositiveNumber(iframe.getAttribute('height'));
        if (explicitHeight) {
            fallbackHeight = Math.max(fallbackHeight, Math.round(explicitHeight));
        }

        var targetHeight = fallbackHeight;
        var isSameOrigin = false;

        var doc = getSameOriginDocument(iframe);
        if (doc) {
            isSameOrigin = true;
            if (shouldBlendIframe(iframe)) {
                harmonizeSameOriginIframe(iframe, doc);
            }
            var contentHeight = getSameOriginContentHeight(doc);
            if (contentHeight) {
                targetHeight = explicitHeight ? Math.max(contentHeight, Math.round(explicitHeight)) : contentHeight;
            }
        }

        iframe.style.height = targetHeight + 'px';
        iframe.setAttribute('scrolling', isSameOrigin ? 'no' : 'auto');
    }

    function isNearViewport(iframe) {
        var rect = iframe.getBoundingClientRect();
        var vh = window.innerHeight || document.documentElement.clientHeight || 0;
        return rect.bottom >= -250 && rect.top <= vh + 1200;
    }

    function resizeVisibleIframes(force) {
        for (var i = 0; i < iframes.length; i++) {
            if (force || isNearViewport(iframes[i])) {
                resizeIframe(iframes[i]);
            }
        }
    }

    window.addEventListener('resize', function() { resizeVisibleIframes(true); }, { passive: true });

    var scrollTicking = false;
    function onScrollResize() {
        if (scrollTicking) return;
        scrollTicking = true;
        requestAnimationFrame(function() {
            resizeVisibleIframes(false);
            scrollTicking = false;
        });
    }
    window.addEventListener('scroll', onScrollResize, { passive: true });

    var themeObserver = new MutationObserver(function() {
        resizeVisibleIframes(false);
    });

    if (document.documentElement) {
        themeObserver.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class', 'style', 'data-theme']
        });
    }

    if (document.body) {
        themeObserver.observe(document.body, {
            attributes: true,
            attributeFilter: ['class', 'style', 'data-theme']
        });
    }

    for (var i = 0; i < iframes.length; i++) {
        iframes[i].addEventListener('load', function() {
            var frame = this;
            resizeIframe(frame);

            // Re-measure shortly after load for widgets that render asynchronously.
            setTimeout(function() { resizeIframe(frame); }, 250);
            setTimeout(function() { resizeIframe(frame); }, 1000);
        });
    }

    resizeVisibleIframes(false);
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Map all figures on the page to their natural order
    var figures = document.querySelectorAll("figure[id]");
    var figMap = {};
    figures.forEach(function(fig, index) {
        figMap[fig.id] = index + 1;
    });

    // 2. Find all figure references and inject the correct number
    var refs = document.querySelectorAll(".auto-fig-ref");
    refs.forEach(function(ref) {
        var targetId = ref.getAttribute("data-target");
        if (figMap[targetId]) {
            ref.textContent = figMap[targetId];
        } else {
            ref.textContent = "??"; // Shows if you have a typo in the ID
            ref.style.color = "red";
        }
    });
});
</script>
