<script>
document.addEventListener("DOMContentLoaded", () => {
    const katexCSS = "/katex/katex.min.css";
    const katexJS = "/katex/katex.min.js";
    const autoRenderJS = "/katex/contrib/auto-render.min.js";

    document.querySelectorAll("iframe").forEach(iframe => {
        iframe.addEventListener("load", () => {
            const doc = iframe.contentDocument;

            if (!doc) return;

            // Inject KaTeX CSS
            const link = doc.createElement("link");
            link.rel = "stylesheet";
            link.href = katexCSS;
            doc.head.appendChild(link);

            // Inject KaTeX scripts
            const script1 = doc.createElement("script");
            script1.src = katexJS;
            script1.defer = true;

            const script2 = doc.createElement("script");
            script2.src = autoRenderJS;
            script2.defer = true;
            script2.onload = () => {
                doc.defaultView.renderMathInElement(doc.body);
            };

            doc.head.appendChild(script1);
            doc.head.appendChild(script2);
        });
    });
});
</script>
