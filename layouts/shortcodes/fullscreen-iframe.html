{{- $id := .Get "id" | default "rt_iframe" -}}
{{- $src := .Get "src" -}}
{{- $height := .Get "height" | default "800" -}}

<style>
.iframe-wrapper {
  position: relative;
  width: 100%;
  min-width: 900px;
}
.fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 10px;
  font-size: 20px;
  background: rgba(0,0,0,0.55);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.25s;
}
.iframe-wrapper:hover .fullscreen-btn {
  opacity: 1;
}
.fullscreen-btn:hover {
  background: rgba(0,0,0,0.75);
}
</style>

<div class="iframe-wrapper">
  <button class="fullscreen-btn" onclick='goFullscreen()'>⛶</button>

  <iframe id="{{ $id }}"
          src="{{ $src }}"
          allowfullscreen
        style="width:100%; height:{{ $height }}px; border:0 !important; border-radius:8px;">
  </iframe>
</div>

<script>
function goFullscreen() {
  const iframe = document.getElementById("{{ $id }}");
  if (iframe.requestFullscreen) iframe.requestFullscreen();
  else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
  else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
}
</script>
