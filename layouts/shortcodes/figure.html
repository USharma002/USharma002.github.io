{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" | default "" -}}
{{- $width := .Get "width" | default "80%" -}}
{{- $num := .Get "num" | default "" -}}
{{- $id := .Get "id" | default (printf "fig-%s" $num) -}}

<figure id="{{ $id }}" style="text-align: center; margin: 2em auto; max-width: {{ $width }}; scroll-margin-top: 80px;">
  {{- if .Get "link" -}}
  <a href="{{ .Get "link" }}">
  {{- end -}}
  
  <img src="{{ $src }}" 
       alt="{{ $alt }}" 
       style="width: 100%; height: auto; border-radius: 8px;">
  
  {{- if .Get "link" -}}
  </a>
  {{- end -}}
  
  {{- if or $num $caption -}}
  <figcaption style="margin-top: 0.5em; font-size: 0.9em; color: var(--secondary);">
    {{- if $num -}}
    <span style="font-weight: 600; user-select: none; color: var(--primary);">Figure {{ $num }}. </span>
    {{- end -}}
    {{ $caption | markdownify }}
  </figcaption>
  {{- end -}}
</figure>
