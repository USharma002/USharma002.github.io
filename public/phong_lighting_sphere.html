<canvas id="c" width="340" height="340" style="display:block;margin:0 auto;background:transparent;"></canvas>

<div style="max-width:340px;margin:1.5rem auto 0;display:flex;flex-direction:column;gap:16px;">
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Ambient</label>
    <input type="range" id="amb" min="0" max="1" step="0.01" value="0.15" style="flex:1;">
    <span id="amb-v" style="font-size:13px;font-weight:500;min-width:32px;text-align:right;">0.15</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Diffuse</label>
    <input type="range" id="dif" min="0" max="1" step="0.01" value="0.70" style="flex:1;">
    <span id="dif-v" style="font-size:13px;font-weight:500;min-width:32px;text-align:right;">0.70</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Specular</label>
    <input type="range" id="spec" min="0" max="1" step="0.01" value="0.60" style="flex:1;">
    <span id="spec-v" style="font-size:13px;font-weight:500;min-width:32px;text-align:right;">0.60</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Shininess</label>
    <input type="range" id="shin" min="1" max="128" step="1" value="32" style="flex:1;">
    <span id="shin-v" style="font-size:13px;font-weight:500;min-width:32px;text-align:right;">32</span>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W/2, cy = H/2, R = 140;

const lightDir = [Math.sqrt(1/3), Math.sqrt(1/3), Math.sqrt(1/3)];
function norm(v){const l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);return[v[0]/l,v[1]/l,v[2]/l];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}

function draw(){
  const Ka=+document.getElementById('amb').value;
  const Kd=+document.getElementById('dif').value;
  const Ks=+document.getElementById('spec').value;
  const ns=+document.getElementById('shin').value;

  const img=ctx.createImageData(W,H);
  const d=img.data;

  for(let py=0;py<H;py++){
    for(let px=0;px<W;px++){
      const dx=px-cx, dy=py-cy;
      const dist2=dx*dx+dy*dy;
      if(dist2>R*R){
        const i=(py*W+px)*4;
        d[i]=d[i+1]=d[i+2]=d[i+3]=0;
        continue;
      }
      const dz=Math.sqrt(R*R-dist2);
      const N=norm([dx,dy,dz]);
      const L=lightDir;
      const NdL=Math.max(0,dot(N,L));
      const V=[0,0,1];
      const ref=[2*NdL*N[0]-L[0],2*NdL*N[1]-L[1],2*NdL*N[2]-L[2]];
      const RdV=Math.max(0,dot(ref,V));

      const intensity=Ka + Kd*NdL + Ks*Math.pow(RdV,ns);
      const c2=Math.min(255,Math.round(intensity*220));

      const i=(py*W+px)*4;
      d[i]=c2; d[i+1]=c2; d[i+2]=c2; d[i+3]=255;
    }
  }
  ctx.clearRect(0,0,W,H);
  ctx.putImageData(img,0,0);
}

function bind(id,outId){
  const el=document.getElementById(id);
  const out=document.getElementById(outId);
  el.addEventListener('input',()=>{out.textContent=parseFloat(el.value).toFixed(id==='shin'?0:2);draw();});
}
bind('amb','amb-v');bind('dif','dif-v');bind('spec','spec-v');bind('shin','shin-v');
draw();
</script>
