<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>vMF Mix</title>

<style>
:root{
  --bg:#f8f9fa; --panel:#fff; --text:#374151; --sub:#6b7280; --b:#d1d5db; --acc:#e67e22;
  --ov:rgba(255,255,255,.92); --sh:0 10px 28px rgba(0,0,0,.14);
  --card:rgba(0,0,0,.03); --cardb:rgba(0,0,0,.10);

  /* FIX: cell size depends on viewport, not sidebar width */
  --cell: clamp(120px, 16vw, 170px);
  --gap: 10px;
  --gridw: calc(var(--cell) * 2 + var(--gap));
}
[data-theme="dark"]{
  --bg:#1a1a1a; --panel:#262626; --text:#f3f4f6; --sub:#9ca3af; --b:#444;
  --ov:rgba(38,38,38,.92); --sh:0 14px 40px rgba(0,0,0,.45);
  --card:rgba(255,255,255,.04); --cardb:rgba(255,255,255,.12);
}
html,body{padding:0; margin:0;height:100%;background:var(--theme);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;justify-content:center;align-items:center;padding:4px;box-sizing:border-box}
#widget{width:min(980px,100%);height:min(560px,100%);display:flex;background:var(--panel);border:1px solid var(--b);border-radius:12px;box-shadow:var(--sh);overflow:hidden}

/* Sidebar */
#side{width:270px;flex:0 0 auto;border-right:1px solid var(--b);position:relative;transition:width .25s cubic-bezier(.4,0,.2,1)}
#side.closed{width:0;border-right:none}
#toggle{position:absolute;right:-30px;top:12px;width:30px;height:30px;border:1px solid var(--b);border-left:none;border-radius:0 10px 10px 0;background:var(--panel);color:var(--sub);cursor:pointer;z-index:5}
#side .in{width:270px;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;gap:10px;transition:opacity .15s}
#side.closed .in{opacity:0;pointer-events:none}
h2{margin:0;color:var(--acc);font-size:15px}
p{margin:0;color:var(--sub);line-height:1.35}
.box{background:var(--ov);border:1px solid var(--b);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center}
label{display:flex;justify-content:space-between;gap:8px;color:var(--sub);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.btns{margin-top:auto;display:flex;gap:8px}
button.action{flex:1;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--text);cursor:pointer;font-weight:800}
button.primary{background:var(--acc);border-color:var(--acc);color:#111}

/* Viz */
#viz{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  gap:var(--gap);
  padding:10px;
  box-sizing:border-box;
  overflow:hidden;
}
.panel{position:relative;background:var(--card);border:1px solid var(--cardb);border-radius:12px;overflow:hidden;cursor:grab;min-width:0}
.panel:active{cursor:grabbing}

/* FIX: main expands when sidebar collapses */
#main{flex:1 1 auto; min-width:0; min-height:0}

/* FIX: grid keeps constant size when sidebar collapses */
#grid{
  flex:0 0 var(--gridw);
  width:var(--gridw);
  min-width:var(--gridw);
  min-height:0;
  display:grid;
  grid-template-columns:repeat(2, var(--cell));
  grid-auto-rows:var(--cell);
  gap:var(--gap);
  align-content:start;
  justify-content:center;
  overflow-y:auto;     /* prevents any overlap */
  overflow-x:hidden;
  padding-right:2px;
  box-sizing:border-box;
}

/* each component box uses the fixed grid tracks */
.badge{position:absolute;top:10px;left:10px;background:var(--ov);border:1px solid var(--b);border-radius:999px;padding:6px 10px;color:var(--acc);font-weight:900;font-size:11px;letter-spacing:.6px;text-transform:uppercase;pointer-events:none}
.tag{position:absolute;bottom:8px;left:8px;background:var(--ov);border:1px solid var(--b);border-radius:999px;padding:2px 8px;color:var(--text);font-size:11px;pointer-events:none}
canvas{display:block;width:100%;height:100%}
</style>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>

<body>
<div id="app">
  <div id="widget">
    <aside id="side">
      <button id="toggle" title="Toggle">☰</button>
      <div class="in">
        <p>Drag any sphere to rotate all views. Sliders update weights (auto-normalized).</p>

        <div class="box">
          <label>Weights <span class="mono" id="sum">sum=1.00</span></label>
          <div id="sliders" style="display:flex;flex-direction:column;gap:10px"></div>
        </div>

        <div class="btns">
          <button class="action" id="rand">Randomize</button>
          <button class="action primary" id="reset">Reset</button>
        </div>
      </div>
    </aside>

    <main id="viz">
      <div class="panel" id="main"><div class="badge">Mixture</div></div>
      <div id="grid"></div>
    </main>
  </div>
</div>

<script type="module">
import * as THREE from "three";

const N=6, $=s=>document.querySelector(s);
const side=$("#side");
$("#toggle").onclick=()=>side.classList.toggle("closed");

// theme inherit
const theme=()=>{try{
  const b=window.getComputedStyle(window.parent.document.body).backgroundColor.match(/\d+/g);
  if(!b) return;
  const y=(+b[0]*299 + +b[1]*587 + +b[2]*114)/1000;
  document.documentElement.setAttribute("data-theme", y<128 ? "dark":"light");
}catch(e){}};
setInterval(theme,1000); theme();

// data
const randComp=()=> {
  const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
  return {mu:new THREE.Vector3(Math.sin(ph)*Math.cos(th),Math.sin(ph)*Math.sin(th),Math.cos(ph)),
          kappa:5+Math.random()*45, weight:Math.random()};
};
const normalize=w=>{const s=w.reduce((a,b)=>a+b,0)||1; return w.map(v=>v/s);};
let data=Array.from({length:N},randComp); data.forEach((c,i)=>c.idx=i);
let baseW=normalize(data.map(c=>c.weight)); baseW.forEach((v,i)=>data[i].weight=v);

// shader
const vs=`varying vec3 n; void main(){n=normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fs=`
precision mediump float; varying vec3 n;
#define MAX 6
uniform vec3 mu[MAX]; uniform float k[MAX]; uniform float w[MAX];
uniform int count; uniform int single;
vec3 magma(float t){
  t=clamp(t,0.,1.);
  vec3 c0=vec3(.001,.001,.014), c1=vec3(.188,.043,.357), c2=vec3(.549,.094,.424),
       c3=vec3(.988,.553,.255), c4=vec3(.996,.878,.545);
  if(t<.25) return mix(c0,c1,t/.25);
  if(t<.5)  return mix(c1,c2,(t-.25)/.25);
  if(t<.75) return mix(c2,c3,(t-.5)/.25);
  return mix(c3,c4,(t-.75)/.25);
}
void main(){
  vec3 nn=normalize(n); float v=0.;
  for(int i=0;i<MAX;i++){ if(i>=count) break;
    float dp=dot(nn,mu[i]);
    float inf=exp(k[i]*(dp-1.));
    v += (single==1) ? inf : w[i]*inf;
  }
  float t=clamp(pow(v*0.6,0.45),0.,1.);
  vec3 col=magma(t);
  vec3 L=normalize(vec3(.5,1.,1.));
  float diff=.4+.6*max(dot(nn,L),0.);
  gl_FragColor=vec4(col*diff,1.);
}`;

class View {
  constructor(el, isMain, idx){
    this.el=el; this.isMain=isMain; this.idx=idx;
    this.scene=new THREE.Scene();
    this.cam=new THREE.PerspectiveCamera(40,1,.1,100);
    this.cam.position.z=isMain?3.25:2.9;
    this.r=new THREE.WebGLRenderer({antialias:true,alpha:true});
    this.r.setPixelRatio(Math.min(devicePixelRatio,2));
    el.appendChild(this.r.domElement);

    const uni=this.makeUniforms();
    this.mat=new THREE.ShaderMaterial({uniforms:uni,vertexShader:vs,fragmentShader:fs});
    this.mesh=new THREE.Mesh(new THREE.SphereGeometry(1,40,40), this.mat);
    if(isMain) this.mesh.scale.setScalar(.92);
    this.scene.add(this.mesh);

    this.drag();
    new ResizeObserver(()=>this.resize()).observe(el);
    this.resize();
  }
  makeUniforms(){
    const mu=[], k=[], w=[];
    if(this.isMain){
      data.forEach(c=>{mu.push(c.mu); k.push(c.kappa); w.push(c.weight);});
    }else{
      const c=data[this.idx];
      mu.push(c.mu); k.push(c.kappa); w.push(c.weight);
      for(let i=1;i<N;i++){mu.push(new THREE.Vector3(0,1,0)); k.push(1); w.push(0);}
    }
    return {mu:{value:mu}, k:{value:k}, w:{value:w}, count:{value:this.isMain?N:1}, single:{value:this.isMain?0:1}};
  }
  resize(){
    const w=Math.max(10,this.el.clientWidth), h=Math.max(10,this.el.clientHeight);
    this.cam.aspect=w/h; this.cam.updateProjectionMatrix();
    this.r.setSize(w,h,false);
  }
  render(){ this.r.render(this.scene,this.cam); }
  setRot(rot){ this.mesh.rotation.copy(rot); }
  drag(){
    let d=false, p={x:0,y:0};
    const down=e=>{d=true;p={x:e.clientX,y:e.clientY};this.el.style.cursor="grabbing";};
    const move=e=>{
      if(!d) return;
      const dx=e.clientX-p.x, dy=e.clientY-p.y;
      this.mesh.rotation.y+=dx*0.015; this.mesh.rotation.x+=dy*0.015;
      views.forEach(v=>v.setRot(this.mesh.rotation));
      p={x:e.clientX,y:e.clientY};
    };
    const up=()=>{d=false;this.el.style.cursor="grab";};
    this.r.domElement.addEventListener("mousedown",down);
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
  }
}

const main=$("#main"), grid=$("#grid"), sliders=$("#sliders"), sum=$("#sum");
const mk=(t,c)=>Object.assign(document.createElement(t),c||{});

// build grid
grid.innerHTML="";
const cells=data.map((c,i)=>{
  const d=mk("div",{className:"panel sub"});
  const tag=mk("div",{className:"tag mono"});
  d.appendChild(tag); grid.appendChild(d);
  return {d,tag,i};
});

// init views
const views=[];
views.push(new View(main,true,-1));
cells.forEach(x=>views.push(new View(x.d,false,x.i)));

function updateBorders(){
  const max=Math.max(...data.map(c=>c.weight))||1;
  cells.forEach(({d,tag,i})=>{
    const w=data[i].weight, a=.30+(w/max)*.60;
    d.style.border=`${1+(w/max)*3}px solid rgba(230,126,34,${a})`;
    tag.textContent=`w:${w.toFixed(2)}`;
  });
  sum.textContent=`sum=${data.reduce((s,c)=>s+c.weight,0).toFixed(2)}`;
  views[0].mat.uniforms.w.value = data.map(c=>c.weight);
}

function rebuildSliders(){
  sliders.innerHTML="";
  data.forEach((c,i)=>{
    const wrap=mk("div");
    wrap.appendChild(mk("label",{innerHTML:`Comp ${i+1}<span class="mono">κ=${c.kappa.toFixed(0)}</span>`}));
    const row=mk("div",{className:"row"});
    const r=mk("input"); r.type="range"; r.min=0; r.max=1; r.step=0.001; r.value=c.weight;
    const v=mk("div",{className:"mono",textContent:(+r.value).toFixed(2),style:"text-align:right"});
    r.addEventListener("input",()=>{
      v.textContent=(+r.value).toFixed(2);
      const norm=normalize(data.map((cc,ii)=> ii===i? +r.value : +cc.__r.value));
      norm.forEach((w,ii)=>{data[ii].weight=w; data[ii].__r.value=w; data[ii].__v.textContent=w.toFixed(2);});
      updateBorders();
    });
    c.__r=r; c.__v=v;
    row.append(r,v); wrap.appendChild(row); sliders.appendChild(wrap);
  });
}

function loop(){ requestAnimationFrame(loop); views.forEach(v=>v.render()); }
rebuildSliders(); updateBorders(); loop();

$("#rand").onclick=()=>{
  const w=data.map(c=>c.weight);
  data=Array.from({length:N},(_,i)=>Object.assign(randComp(),{idx:i,weight:w[i]}));
  views[0].mat.uniforms.mu.value = data.map(c=>c.mu);
  views[0].mat.uniforms.k.value  = data.map(c=>c.kappa);
  cells.forEach(({i},j)=>{
    views[j+1].mat.uniforms.mu.value[0]=data[i].mu;
    views[j+1].mat.uniforms.k.value[0]=data[i].kappa;
  });
  rebuildSliders(); updateBorders();
};

$("#reset").onclick=()=>{
  const norm=normalize(baseW.slice());
  norm.forEach((w,i)=>{data[i].weight=w; data[i].__r.value=w; data[i].__v.textContent=w.toFixed(2);});
  updateBorders();
};
</script>
</body>
</html>
