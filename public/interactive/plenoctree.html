<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlenOctree Accurate Visualization</title>
    <style>
        :root {
            /* Default Light Theme */
            --page-bg: #ffffff;
            --page-text: #212529;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: rgba(0,0,0,0.1);
            --btn-bg: #333;
            --btn-hover: #555;
            --btn-text: #fff;
            --stats-bg: #f0f0f0;
            --stats-text: #444;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--page-bg); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--page-text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        canvas { display: block; }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--card-shadow);
            max-width: 320px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        h1 { margin: 0 0 5px 0; font-size: 1.2rem; color: var(--page-text); }
        p { margin: 0 0 10px 0; font-size: 0.9rem; opacity: 0.8; line-height: 1.4; }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            flex: 1;
            transition: background 0.2s;
        }
        button:hover { background: var(--btn-hover); }

        .stats {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--stats-text);
            background: var(--stats-bg);
            padding: 8px;
            border-radius: 4px;
            transition: background 0.3s ease, color 0.3s ease;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="info">
    <h1>PlenOctree Algorithm</h1>
    <p>
        <strong>Sparse Octree Construction:</strong><br>
        The grid is generated by recursively evaluating the volume density. 
        Empty nodes are pruned (skipped), keeping only nodes with active content.
    </p>
    
    <div class="controls">
        <button onclick="regenerateView()">Randomize Orientation</button>
    </div>
    
    <div class="stats" id="stats">
        Nodes: Calculating...<br>
        Depth: 6
    </div>
</div>

<script>
    let scene, camera, renderer, controls;
    let octreeLines, contentMesh;
    let isDarkMode = false; // Global theme state
    
    // Configuration
    const CONFIG = {
        minDepth: 2,         // Coarse grid background
        maxDepth: 6,         // Detail level
        rootSize: 16,        // Bounding box size
    };

    // --- Theme Detection Logic ---
    function detectTheme() {
        try {
            const parentBody = window.parent.document.body;
            const computedStyle = window.getComputedStyle(parentBody);
            const bgColor = computedStyle.backgroundColor;
            const rgb = bgColor.match(/\d+/g);
            
            if (rgb) {
                const brightness = (parseInt(rgb[0])*299 + parseInt(rgb[1])*587 + parseInt(rgb[2])*114) / 1000;
                const newIsDark = brightness < 128;
                
                // Only update if changed
                if (newIsDark !== isDarkMode) {
                    applyTheme(newIsDark);
                }
            }
        } catch(e) {
            // Fallback if cross-origin or error
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && !isDarkMode) {
                applyTheme(true);
            }
        }
    }

    function applyTheme(isDark) {
        isDarkMode = isDark;
        const root = document.documentElement.style;

        if (isDark) {
            // Dark Mode Vars
            root.setProperty('--page-bg', '#1a1a1a');
            root.setProperty('--page-text', '#e4e4e4');
            root.setProperty('--card-bg', 'rgba(45, 45, 45, 0.95)');
            root.setProperty('--card-shadow', 'rgba(0,0,0,0.3)');
            root.setProperty('--btn-bg', '#555');
            root.setProperty('--btn-hover', '#666');
            root.setProperty('--stats-bg', '#333');
            root.setProperty('--stats-text', '#ccc');
        } else {
            // Light Mode Vars
            root.setProperty('--page-bg', '#ffffff');
            root.setProperty('--page-text', '#212529');
            root.setProperty('--card-bg', 'rgba(255, 255, 255, 0.95)');
            root.setProperty('--card-shadow', 'rgba(0,0,0,0.1)');
            root.setProperty('--btn-bg', '#333');
            root.setProperty('--btn-hover', '#555');
            root.setProperty('--stats-bg', '#f0f0f0');
            root.setProperty('--stats-text', '#444');
        }

        // Update Three.js Scene
        if (scene) {
            scene.background = new THREE.Color(isDark ? 0x1a1a1a : 0xffffff);
        }
        
        // Update Grid Lines Color
        if (octreeLines) {
            const lineColor = isDark ? 0xaaaaaa : 0x000000;
            octreeLines.material.color.setHex(lineColor);
            // Adjust opacity slightly for dark mode visibility
            octreeLines.material.opacity = isDark ? 0.3 : 0.4;
        }
    }

    init();
    animate();
    
    // Start polling for theme changes
    setInterval(detectTheme, 1000);
    detectTheme(); // Initial check

    function init() {
        // 1. Setup Scene
        scene = new THREE.Scene();
        // Set initial background based on current state (default light)
        scene.background = new THREE.Color(0xffffff);

        // 2. Setup Camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        // 3. Setup Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 4. Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        // 6. Generate Content & Tree
        createSceneContent();

        // 7. Add Ray
        addRay();

        window.addEventListener('resize', onWindowResize, false);
    }

    function createSceneContent() {
        // --- A. Create the "NeRF" Volume (Torus Knot) ---
        const geometry = new THREE.TorusKnotGeometry(2.5, 0.7, 150, 30);
        
        // Material: Solid volume style
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x8b5a2b,   
            roughness: 0.6,
            metalness: 0.1,
            flatShading: false,
            side: THREE.DoubleSide
        });
        
        if (contentMesh) scene.remove(contentMesh);
        contentMesh = new THREE.Mesh(geometry, material);
        scene.add(contentMesh);

        // --- B. Generate Octree based on Geometry ---
        const positionAttribute = geometry.attributes.position;
        const vertices = [];
        const vector = new THREE.Vector3();

        for ( let i = 0; i < positionAttribute.count; i ++ ) {
            vector.fromBufferAttribute( positionAttribute, i );
            vertices.push(vector.clone());
        }

        generateSparseOctree(vertices);
    }

    // --- The Core PlenOctree Algorithm ---
    function generateSparseOctree(points) {
        if (octreeLines) scene.remove(octreeLines);

        const lineVertices = [];
        let nodeCount = 0;

        const rootMin = new THREE.Vector3(-CONFIG.rootSize/2, -CONFIG.rootSize/2, -CONFIG.rootSize/2);
        const rootMax = new THREE.Vector3(CONFIG.rootSize/2, CONFIG.rootSize/2, CONFIG.rootSize/2);

        function buildNode(pointsInNode, min, max, depth) {
            const hasPoints = pointsInNode.length > 0;
            const mustSubdivide = depth < CONFIG.minDepth;
            const canSubdivide = depth < CONFIG.maxDepth;

            if ((hasPoints && canSubdivide) || mustSubdivide) {
                const mid = new THREE.Vector3().addVectors(min, max).multiplyScalar(0.5);
                const childrenPoints = Array(8).fill().map(() => []);

                if (hasPoints) {
                    for (let p of pointsInNode) {
                        const xBit = p.x >= mid.x ? 1 : 0;
                        const yBit = p.y >= mid.y ? 2 : 0;
                        const zBit = p.z >= mid.z ? 4 : 0;
                        const index = xBit + yBit + zBit;
                        childrenPoints[index].push(p);
                    }
                }

                for (let i = 0; i < 8; i++) {
                    const xBit = (i & 1);
                    const yBit = (i & 2) >> 1;
                    const zBit = (i & 4) >> 2;

                    const childMin = new THREE.Vector3(
                        xBit ? mid.x : min.x,
                        yBit ? mid.y : min.y,
                        zBit ? mid.z : min.z
                    );
                    const childMax = new THREE.Vector3(
                        xBit ? max.x : mid.x,
                        yBit ? max.y : mid.y,
                        zBit ? max.z : mid.z
                    );

                    buildNode(childrenPoints[i], childMin, childMax, depth + 1);
                }
            } else {
                addBoxToVertices(min, max, lineVertices);
                nodeCount++;
            }
        }

        buildNode(points, rootMin, rootMax, 0);

        document.getElementById('stats').innerHTML = `
            <strong>Leaf Nodes:</strong> ${nodeCount}<br>
            <strong>Structure:</strong> Multi-Res Adaptive Grid<br>
            <strong>Status:</strong> Visualizing All Nodes
        `;

        // Create the Wireframe Mesh
        const geometry = new THREE.BufferGeometry().setFromPoints(lineVertices);
        
        // ADAPTIVE COLOR: Check current theme for initial color
        const lineColor = isDarkMode ? 0xaaaaaa : 0x000000;
        const opacity = isDarkMode ? 0.3 : 0.4;
        
        const material = new THREE.LineBasicMaterial({ 
            color: lineColor, 
            transparent: true, 
            opacity: opacity 
        });
        
        octreeLines = new THREE.LineSegments(geometry, material);
        scene.add(octreeLines);
    }

    function addBoxToVertices(min, max, array) {
        const p1 = new THREE.Vector3(min.x, min.y, min.z);
        const p2 = new THREE.Vector3(max.x, min.y, min.z);
        const p3 = new THREE.Vector3(max.x, min.y, max.z);
        const p4 = new THREE.Vector3(min.x, min.y, max.z);
        const p5 = new THREE.Vector3(min.x, max.y, min.z);
        const p6 = new THREE.Vector3(max.x, max.y, min.z);
        const p7 = new THREE.Vector3(max.x, max.y, max.z);
        const p8 = new THREE.Vector3(min.x, max.y, max.z);

        array.push(p1, p2, p2, p3, p3, p4, p4, p1);
        array.push(p5, p6, p6, p7, p7, p8, p8, p5);
        array.push(p1, p5, p2, p6, p3, p7, p4, p8);
    }

    function addRay() {
        const dir = new THREE.Vector3(-1, -0.4, -0.8).normalize();
        const origin = new THREE.Vector3(10, 6, 8);
        const length = 22;
        const hex = 0xff3300; 

        const arrowHelper = new THREE.ArrowHelper(dir, origin, length, hex, 1, 0.5);
        
        const material = new THREE.MeshBasicMaterial( {color: hex} );
        const cylinderGeo = new THREE.CylinderGeometry(0.06, 0.06, length - 1, 8);
        const cylinder = new THREE.Mesh(cylinderGeo, material);
        cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        cylinder.position.copy(origin).add(dir.clone().multiplyScalar((length-1)/2));
        
        scene.add(arrowHelper);
        scene.add(cylinder);
    }

    function regenerateView() {
        const rotX = Math.random() * Math.PI;
        const rotY = Math.random() * Math.PI;
        
        contentMesh.rotation.x = rotX;
        contentMesh.rotation.y = rotY;
        
        contentMesh.updateMatrixWorld();
        
        const geometry = contentMesh.geometry;
        const positionAttribute = geometry.attributes.position;
        const vertices = [];
        const vector = new THREE.Vector3();
        
        for ( let i = 0; i < positionAttribute.count; i ++ ) {
            vector.fromBufferAttribute( positionAttribute, i );
            vector.applyMatrix4(contentMesh.matrixWorld);
            vertices.push(vector.clone());
        }

        generateSparseOctree(vertices);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>

</body>
</html>
