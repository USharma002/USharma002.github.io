<canvas id="c" style="width:100%;display:block;border-radius:8px;"></canvas>
<div style="display:flex;gap:16px;margin-top:10px;align-items:center;flex-wrap:wrap;">
  <label style="font-size:13px;color:var(--color-text-secondary);">Speed <input type="range" id="spd" min="0.1" max="3" step="0.1" value="1" style="width:100px;vertical-align:middle;"> <span id="spdv">1.0×</span></label>
  <label style="font-size:13px;color:var(--color-text-secondary);">Pause <input type="checkbox" id="pause" style="vertical-align:middle;"></label>
  <span style="font-size:12px;color:var(--color-text-tertiary);">Move mouse over canvas to aim the ray</span>
</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');

const vert = `#version 300 es
in vec2 a_pos;
void main(){gl_Position=vec4(a_pos,0,1);}`;

const frag = `#version 300 es
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_mouse;
out vec4 fragColor;

float sdCircle(vec2 p,float r){return length(p)-r;}

float sceneSDF(vec2 p){
  float c1=sdCircle(p-vec2(-0.45,0.10),0.35);
  float c2=sdCircle(p-vec2(0.42,-0.24),0.22);
  float fl=p.y+0.72;
  return min(min(c1,c2),fl);
}

void main(){
  vec2 p=(2.0*gl_FragCoord.xy-u_res)/u_res.y;

  vec2 ro=vec2(-1.1+0.25*cos(u_time*0.6),-0.55+0.15*sin(u_time*0.4));

  vec2 target=(u_mouse.x<=0.0&&u_mouse.y<=0.0)
    ?vec2(0.7*cos(u_time*0.55),0.15+0.3*sin(u_time*0.8))
    :(2.0*u_mouse-u_res)/u_res.y;
  vec2 rd=normalize(target-ro);

  // --- SDF field visualization ---
  float d=sceneSDF(p);
  vec3 col=(d>0.0)?vec3(0.314,0.627,0.941):vec3(0.922,0.314,0.235);
  float decay=(d>0.0)?3.0:4.0;
  col*=1.0-exp(-decay*abs(d));
  col*=0.85+0.15*cos(150.0*d);
  col=mix(col,vec3(1.0),1.0-smoothstep(0.0,0.01,abs(d)));

  // --- Ray line ---
  float rayLine=1.0-smoothstep(0.0,0.012,
    length(p-(ro+clamp(dot(p-ro,rd),0.0,4.0)*rd)));
  col=mix(col,vec3(1.0),rayLine*0.18);

  // --- Sphere tracing circles (20 steps) ---
  vec2 marchP=ro;
  float t=0.0;
  for(int i=0;i<20;i++){
    float sd=sceneSDF(marchP);
    float asd=abs(sd);

    // Stepping circle ring
    float ring=abs(length(p-marchP)-asd);
    float ringGlow=1.0-smoothstep(0.0,0.008,ring-0.003);
    float frac=float(i)/19.0;
    vec3 ringCol=mix(vec3(0.3,0.75,1.0),vec3(1.0,0.85,0.2),frac);
    col=mix(col,ringCol,ringGlow*0.9);

    // Dot at each march position
    float dot1=1.0-smoothstep(0.0,0.025,length(p-marchP)-0.012);
    col=mix(col,vec3(1.0),dot1*0.9);

    if(sd<0.001||t>4.0) break;
    t+=asd;
    marchP=ro+t*rd;
  }

  // --- Ray origin dot ---
  float roGlow=1.0-smoothstep(0.0,0.03,length(p-ro)-0.018);
  col=mix(col,vec3(1.0,0.9,0.3),roGlow);

  fragColor=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,frag));
gl.linkProgram(prog);gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(prog,'u_res');
const uTime=gl.getUniformLocation(prog,'u_time');
const uMouse=gl.getUniformLocation(prog,'u_mouse');

let mouse=[0,0],start=null,paused=false,elapsed=0,lastT=null;

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const scaleX=canvas.width/r.width;
  const scaleY=canvas.height/r.height;
  mouse=[(e.clientX-r.left)*scaleX,(canvas.height-(e.clientY-r.top)*scaleY)];
});
canvas.addEventListener('mouseleave',()=>mouse=[0,0]);

document.getElementById('pause').addEventListener('change',e=>{
  paused=e.target.checked;
  if(!paused) lastT=null;
});
const spdSlider=document.getElementById('spd');
const spdVal=document.getElementById('spdv');
spdSlider.addEventListener('input',()=>spdVal.textContent=parseFloat(spdSlider.value).toFixed(1)+'×');

function resize(){
  const w=canvas.clientWidth,h=Math.round(w*0.56);
  canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
  gl.viewport(0,0,canvas.width,canvas.height);
}
resize();new ResizeObserver(resize).observe(canvas);

function frame(ts){
  if(start===null) start=ts;
  const speed=parseFloat(spdSlider.value);
  if(!paused){
    const dt=lastT===null?0:(ts-lastT)/1000;
    elapsed+=dt*speed;
  }
  lastT=ts;

  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,elapsed);
  gl.uniform2f(uMouse,...mouse);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
