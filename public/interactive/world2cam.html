<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Coordinate System Demo</title>
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --page-bg: #ffffff;
            --page-text: #212529;
            --card-bg: #f8f9fa;
            --border-color: #dee2e6;
            --accent-color: #2E86AB;
            --frustum-color: rgba(0, 120, 255, 0.05);
            --frustum-stroke: #0078ff;
            --grid-color: #e0e0e0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--theme);
            color: var(--page-text);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- CONTROLS --- */
        .controls-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label { font-weight: 600; white-space: nowrap; }
        
        input[type=range] {
            width: 100px;
            cursor: pointer;
            accent-color: var(--page-text);
        }

        /* --- LAYOUT GRID --- */
        .viz-row-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
            height: 280px;
        }

        .viz-row-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            height: 280px;
        }

        .canvas-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            min-width: 0; 
            display: flex;
            flex-direction: column;
        }

        .plot-label {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255,255,255,0.9);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            color: #333;
            border: 1px solid rgba(0,0,0,0.1);
            z-index: 10;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* Responsive Breakpoint */
        @media (max-width: 700px) {
            .viz-row-top { grid-template-columns: 1fr; height: auto; }
            .viz-row-bottom { grid-template-columns: 1fr; height: auto; }
            .canvas-container { height: 260px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls-card">
        <div class="control-group">
            <label>Cam X</label>
            <input type="range" id="camX" min="-5" max="5" step="0.1" value="0">
        </div>
        <div class="control-group">
            <label>Cam Z</label>
            <input type="range" id="camZ" min="-8" max="-1" step="0.1" value="-6">
        </div>
        <div class="control-group">
            <label>FOV</label>
            <input type="range" id="fov" min="30" max="120" step="1" value="60">
        </div>
        <div style="flex-basis: 100%; text-align: center; font-size: 0.85rem; color: var(--accent-color); margin-top: -5px;">
            <small>Drag the Red Point in the Top/Side views below to move target</small>
        </div>
    </div>

    <div class="viz-row-top">
        <div class="canvas-container">
            <div class="plot-label">1. World Space</div>
            <canvas id="c-world"></canvas>
        </div>
        <div class="canvas-container">
            <div class="plot-label">2. Camera Space</div>
            <canvas id="c-camera"></canvas>
        </div>
        <div class="canvas-container">
            <div class="plot-label">3. Image Plane</div>
            <canvas id="c-screen"></canvas>
        </div>
    </div>

    <div class="viz-row-bottom">
        <div class="canvas-container">
            <div class="plot-label">Top View (XZ) - DRAG ME</div>
            <canvas id="c-top"></canvas>
        </div>
        <div class="canvas-container">
            <div class="plot-label">Side View (YZ) - DRAG ME</div>
            <canvas id="c-side"></canvas>
        </div>
    </div>
</div>

<script>
/* --- MATH KERNEL --- */
const V3 = {
    add: (a, b) => ({x: a.x+b.x, y: a.y+b.y, z: a.z+b.z}),
    sub: (a, b) => ({x: a.x-b.x, y: a.y-b.y, z: a.z-b.z}),
    dot: (a, b) => a.x*b.x + a.y*b.y + a.z*b.z,
    cross: (a, b) => ({x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x}),
    norm: (a) => {
        let len = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
        return len === 0 ? {x:0,y:0,z:0} : {x:a.x/len, y:a.y/len, z:a.z/len};
    },
    transform: (v, m) => {
        const x = v.x*m[0] + v.y*m[4] + v.z*m[8] + m[12];
        const y = v.x*m[1] + v.y*m[5] + v.z*m[9] + m[13];
        const z = v.x*m[2] + v.y*m[6] + v.z*m[10] + m[14];
        const w = v.x*m[3] + v.y*m[7] + v.z*m[11] + m[15];
        return w === 0 ? {x:x, y:y, z:z} : {x:x/w, y:y/w, z:z/w};
    }
};

const M4 = {
    lookAt: (eye, target, up) => {
        let z = V3.norm(V3.sub(eye, target));
        let x = V3.norm(V3.cross(up, z));
        let y = V3.cross(z, x);
        return [
            x.x, y.x, z.x, 0,
            x.y, y.y, z.y, 0,
            x.z, y.z, z.z, 0,
            -V3.dot(x, eye), -V3.dot(y, eye), -V3.dot(z, eye), 1
        ];
    }
};

/* --- STATE --- */
const state = {
    point: { x: 1.5, y: 0.5, z: 2 },
    cam: {
        pos: { x: 0, y: 0, z: -6 },
        fov: 60,
        aspect: 1,
        near: 1,
        far: 8
    },
    orbit: { angle: Math.PI / 5, pitch: Math.PI / 8, dist: 18 },
    dragging: null,
    lastMouse: { x:0, y:0 }
};

const canvases = {
    world: document.getElementById('c-world'),
    camera: document.getElementById('c-camera'),
    screen: document.getElementById('c-screen'),
    top: document.getElementById('c-top'),
    side: document.getElementById('c-side'),
};
const ctxs = {};

Object.keys(canvases).forEach(k => {
    ctxs[k] = canvases[k].getContext('2d');
    new ResizeObserver(() => {
        const rect = canvases[k].getBoundingClientRect();
        canvases[k].width = rect.width * window.devicePixelRatio;
        canvases[k].height = rect.height * window.devicePixelRatio;
        ctxs[k].scale(window.devicePixelRatio, window.devicePixelRatio);
        requestAnimationFrame(render);
    }).observe(canvases[k].parentElement);
});

/* --- HELPERS --- */
function worldToScreen(v, viewMat, w, h) {
    const vCam = V3.transform(v, viewMat);
    const scale = Math.min(w, h) / 22;
    return {
        x: w/2 + vCam.x * scale,
        y: h/2 - vCam.y * scale
    };
}

function getFrustumCorners() {
    const tang = Math.tan((state.cam.fov * 0.5) * Math.PI / 180);
    const nh = state.cam.near * tang;
    const fh = state.cam.far * tang;
    return [
        {x: -nh, y: nh, z: state.cam.near}, {x: nh, y: nh, z: state.cam.near},
        {x: nh, y: -nh, z: state.cam.near}, {x: -nh, y: -nh, z: state.cam.near},
        {x: -fh, y: fh, z: state.cam.far}, {x: fh, y: fh, z: state.cam.far},
        {x: fh, y: -fh, z: state.cam.far}, {x: -fh, y: -fh, z: state.cam.far}
    ];
}

/* --- DRAWING --- */
function drawWireframe(ctx, corners, origin, styles) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = styles.frustumStroke;
    
    // Edges
    ctx.beginPath();
    for(let i=0; i<4; i++) {
        ctx.moveTo(corners[i].x, corners[i].y);
        ctx.lineTo(corners[i+4].x, corners[i+4].y);
    }
    ctx.stroke();

    // Faces
    [0, 4].forEach(start => {
        ctx.beginPath();
        ctx.moveTo(corners[start].x, corners[start].y);
        ctx.lineTo(corners[start+1].x, corners[start+1].y);
        ctx.lineTo(corners[start+2].x, corners[start+2].y);
        ctx.lineTo(corners[start+3].x, corners[start+3].y);
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = styles.frustum;
        ctx.fill();
    });

    // Apex
    ctx.beginPath();
    ctx.setLineDash([2, 4]);
    for(let i=0; i<4; i++) {
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(corners[i].x, corners[i].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
}

function render() {
    // --- DYNAMIC THEME VARIABLES ---
    const styles = {
        bg: getComputedStyle(document.body).getPropertyValue('--card-bg'),
        text: getComputedStyle(document.body).getPropertyValue('--page-text'),
        frustum: getComputedStyle(document.documentElement).getPropertyValue('--frustum-color') || 'rgba(0, 120, 255, 0.05)',
        frustumStroke: getComputedStyle(document.documentElement).getPropertyValue('--frustum-stroke') || '#0078ff',
        grid: isDark ? '#444' : '#ddd'
    };

    const camX = Math.sin(state.orbit.angle) * state.orbit.dist * Math.cos(state.orbit.pitch);
    const camY = Math.sin(state.orbit.pitch) * state.orbit.dist;
    const camZ = Math.cos(state.orbit.angle) * state.orbit.dist * Math.cos(state.orbit.pitch);
    const orbitView = M4.lookAt({x:camX, y:camY, z:camZ}, {x:0,y:0,z:0}, {x:0,y:1,z:0});
    const camSpaceView = M4.lookAt({x:-6, y:5, z:5}, {x:0,y:0,z:4}, {x:0,y:1,z:0});

    draw3DScene(ctxs.world, canvases.world, orbitView, true, styles);
    draw3DScene(ctxs.camera, canvases.camera, camSpaceView, false, styles);
    drawScreen(ctxs.screen, canvases.screen, styles);
    drawOrtho(ctxs.top, canvases.top, 'x', 'z', styles);
    drawOrtho(ctxs.side, canvases.side, 'z', 'y', styles);
}

function draw3DScene(ctx, cvs, viewMat, isWorld, styles) {
    const w = cvs.width / window.devicePixelRatio;
    const h = cvs.height / window.devicePixelRatio;
    ctx.clearRect(0,0,w,h);

    // Grid
    ctx.strokeStyle = styles.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=-10; i<=10; i+=2) {
        let p1 = worldToScreen({x:i,y:-2,z:-10}, viewMat, w, h);
        let p2 = worldToScreen({x:i,y:-2,z:10}, viewMat, w, h);
        ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
        p1 = worldToScreen({x:-10,y:-2,z:i}, viewMat, w, h);
        p2 = worldToScreen({x:10,y:-2,z:i}, viewMat, w, h);
        ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
    }
    ctx.stroke();

    // --- NEW: RGB AXES ---
    const axisLen = 2.0;
    const origin = {x:0, y:0, z:0};
    const xTip = {x:axisLen, y:0, z:0};
    const yTip = {x:0, y:axisLen, z:0};
    const zTip = {x:0, y:0, z:axisLen};

    const pO = worldToScreen(origin, viewMat, w, h);
    const pX = worldToScreen(xTip, viewMat, w, h);
    const pY = worldToScreen(yTip, viewMat, w, h);
    const pZ = worldToScreen(zTip, viewMat, w, h);

    ctx.lineWidth = 3;
    
    // Z - Blue
    ctx.strokeStyle = '#2E86AB'; 
    ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pZ.x, pZ.y); ctx.stroke();
    
    // Y - Green
    ctx.strokeStyle = '#48bb78'; 
    ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pY.x, pY.y); ctx.stroke();
    
    // X - Red
    ctx.strokeStyle = '#f56565'; 
    ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pX.x, pX.y); ctx.stroke();
    // ---------------------

    let corners = getFrustumCorners();
    let camOrigin = {x:0,y:0,z:0};
    if(isWorld) {
        corners = corners.map(p => ({x: p.x + state.cam.pos.x, y: p.y + state.cam.pos.y, z: p.z + state.cam.pos.z}));
        camOrigin = state.cam.pos;
    }
    const scrCorners = corners.map(p => worldToScreen(p, viewMat, w, h));
    const scrOrigin = worldToScreen(camOrigin, viewMat, w, h);
    drawWireframe(ctx, scrCorners, scrOrigin, styles);

    let pt = state.point;
    if (!isWorld) pt = {x: state.point.x - state.cam.pos.x, y: state.point.y - state.cam.pos.y, z: state.point.z - state.cam.pos.z};
    const scrPt = worldToScreen(pt, viewMat, w, h);
    
    ctx.beginPath();
    ctx.moveTo(scrOrigin.x, scrOrigin.y);
    ctx.lineTo(scrPt.x, scrPt.y);
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(255,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(scrPt.x, scrPt.y, 4, 0, Math.PI*2);
    ctx.fillStyle = '#ff3333';
    ctx.fill();
}

function drawScreen(ctx, cvs, styles) {
    const w = cvs.width / window.devicePixelRatio;
    const h = cvs.height / window.devicePixelRatio;
    ctx.clearRect(0,0,w,h);

    const margin = 40;
    const size = Math.min(w,h) - margin*2;
    const sx = (w-size)/2;
    const sy = (h-size)/2;

    ctx.strokeStyle = styles.text;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, size, size);

    const pc = {x: state.point.x - state.cam.pos.x, y: state.point.y - state.cam.pos.y, z: state.point.z - state.cam.pos.z};

    if(pc.z < state.cam.near) {
        ctx.fillStyle = 'orange';
        ctx.font = '12px sans-serif';
        ctx.fillText("Behind Near Plane", sx, sy + size + 20);
        return;
    }

    const tang = Math.tan((state.cam.fov * 0.5) * Math.PI / 180);
    const nx = (pc.x / pc.z) / tang;
    const ny = (pc.y / pc.z) / tang;
    const px = sx + size/2 + nx * (size/2);
    const py = sy + size/2 - ny * (size/2);

    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx+size/2, sy); ctx.lineTo(sx+size/2, sy+size);
    ctx.moveTo(sx, sy+size/2); ctx.lineTo(sx+size, sy+size/2);
    ctx.stroke();

    const isInside = (Math.abs(nx) <= 1 && Math.abs(ny) <= 1);
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI*2);
    if (isInside) {
        ctx.fillStyle = '#ff3333';
        ctx.fill();
    } else {
        ctx.fillStyle = 'rgba(255, 50, 50, 0.2)';
        ctx.strokeStyle = '#ff3333';
        ctx.fill();
        ctx.stroke();
    }
}

function drawOrtho(ctx, cvs, ah, av, styles) {
    const w = cvs.width / window.devicePixelRatio;
    const h = cvs.height / window.devicePixelRatio;
    ctx.clearRect(0,0,w,h);
    
    const cx = w/2, cy = h/2;
    const scale = 18;
    const map = (u, v) => ({ x: cx + u*scale, y: cy - v*scale });

    // Grid Axes lines
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

    // --- NEW: RGB AXES for 2D ---
    const axisLen = 3.0; 
    const center = map(0,0);
    ctx.lineWidth = 3;

    // Draw Horizontal Axis (ah)
    let colH = ah === 'x' ? '#f56565' : (ah === 'z' ? '#2E86AB' : '#48bb78');
    const pH = map(axisLen, 0);
    ctx.strokeStyle = colH;
    ctx.beginPath(); ctx.moveTo(center.x, center.y); ctx.lineTo(pH.x, pH.y); ctx.stroke();

    // Draw Vertical Axis (av)
    let colV = av === 'x' ? '#f56565' : (av === 'z' ? '#2E86AB' : '#48bb78');
    const pV = map(0, axisLen);
    ctx.strokeStyle = colV;
    ctx.beginPath(); ctx.moveTo(center.x, center.y); ctx.lineTo(pV.x, pV.y); ctx.stroke();
    // ----------------------------

    const corners = getFrustumCorners().map(p => ({
        x: p.x + state.cam.pos.x, y: p.y + state.cam.pos.y, z: p.z + state.cam.pos.z
    }));
    const scrCorners = corners.map(p => map(p[ah], p[av]));
    const scrOrigin = map(state.cam.pos[ah], state.cam.pos[av]);
    drawWireframe(ctx, scrCorners, scrOrigin, styles);

    const pt = map(state.point[ah], state.point[av]);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 5, 0, Math.PI*2);
    ctx.fillStyle = '#ff3333';
    ctx.fill();
    
    ctx.fillStyle = styles.text;
    ctx.font = "10px sans-serif";
    ctx.fillText(ah.toUpperCase(), w-15, cy-5);
    ctx.fillText(av.toUpperCase(), cx+5, 15);
}

/* --- EVENTS --- */
document.getElementById('camX').addEventListener('input', e => { state.cam.pos.x = parseFloat(e.target.value); requestAnimationFrame(render); });
document.getElementById('camZ').addEventListener('input', e => { state.cam.pos.z = parseFloat(e.target.value); requestAnimationFrame(render); });
document.getElementById('fov').addEventListener('input', e => { state.cam.fov = parseFloat(e.target.value); requestAnimationFrame(render); });

function getMouse(e, c) {
    const r = c.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height };
}
canvases.top.addEventListener('mousedown', () => state.dragging = 'top');
canvases.top.addEventListener('mousemove', e => {
    if(state.dragging !== 'top') return;
    const m = getMouse(e, canvases.top);
    const scale = 18;
    state.point.x = (m.x - m.w/2) / scale;
    state.point.z = (m.h/2 - m.y) / scale;
    requestAnimationFrame(render);
});
canvases.side.addEventListener('mousedown', () => state.dragging = 'side');
canvases.side.addEventListener('mousemove', e => {
    if(state.dragging !== 'side') return;
    const m = getMouse(e, canvases.side);
    const scale = 18;
    state.point.z = (m.x - m.w/2) / scale;
    state.point.y = (m.h/2 - m.y) / scale;
    requestAnimationFrame(render);
});
canvases.world.addEventListener('mousedown', e => { state.dragging = 'orbit'; state.lastMouse = {x: e.clientX, y: e.clientY}; });
window.addEventListener('mousemove', e => {
    if(state.dragging === 'orbit') {
        const dx = e.clientX - state.lastMouse.x;
        const dy = e.clientY - state.lastMouse.y;
        state.orbit.angle -= dx * 0.005;
        state.orbit.pitch += dy * 0.005;
        state.orbit.pitch = Math.max(-1.5, Math.min(1.5, state.orbit.pitch));
        state.lastMouse = {x: e.clientX, y: e.clientY};
        requestAnimationFrame(render);
    }
});
window.addEventListener('mouseup', () => state.dragging = null);

/* --- THEME DETECTION (RESTORED PARENT CHECK) --- */
let isDark = false;
function detectTheme() {
    try {
        // 1. Try accessing parent (Blog context)
        let computed;
        try {
            computed = window.getComputedStyle(window.parent.document.body);
        } catch(e) {
            // 2. Fallback: check for dark mode preference if iframe is blocked
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDark = true;
            }
            return updateTheme();
        }

        // 3. Parse parent background color
        const bg = computed.backgroundColor;
        if(bg.includes('rgb')) {
            const rgb = bg.match(/\d+/g).map(Number);
            // Calculate luma
            const bright = (rgb[0]*299 + rgb[1]*587 + rgb[2]*114)/1000;
            const newDark = bright < 128;
            if(newDark !== isDark) {
                isDark = newDark;
                updateTheme();
            }
        }
    } catch(e) {}
}

function updateTheme() {
    if(isDark) {
        document.documentElement.style.setProperty('--page-bg', '#1a1a1a');
        document.documentElement.style.setProperty('--page-text', '#e4e4e4');
        document.documentElement.style.setProperty('--card-bg', '#2d2d2d');
        document.documentElement.style.setProperty('--border-color', '#404040');
        document.documentElement.style.setProperty('--frustum-color', 'rgba(100, 200, 255, 0.1)');
    } else {
        document.documentElement.style.setProperty('--page-bg', '#ffffff');
        document.documentElement.style.setProperty('--page-text', '#212529');
        document.documentElement.style.setProperty('--card-bg', '#f8f9fa');
        document.documentElement.style.setProperty('--border-color', '#dee2e6');
        document.documentElement.style.setProperty('--frustum-color', 'rgba(0, 120, 255, 0.05)');
    }
    render();
}

setInterval(detectTheme, 1000);
detectTheme();
render();

</script>
</body>
</html>
