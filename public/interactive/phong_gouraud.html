<div style="display:flex;gap:16px;margin:10px 0 14px;justify-content:center;">
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-secondary);">
    <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#378ADD;"></span> Gouraud (vertex shading)
  </div>
  <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-secondary);">
    <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#1D9E75;"></span> Phong (per-pixel shading)
  </div>
</div>

<div id="wrap">
  <canvas id="cG" style="display:block;border-radius:var(--border-radius-lg);"></canvas>
  <canvas id="cP" style="display:block;border-radius:var(--border-radius-lg);"></canvas>
</div>

<div style="max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px;">
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Ambient</label>
    <input type="range" id="amb" min="0" max="1" step="0.01" value="0.10" style="flex:1;">
    <span id="amb-v" style="font-size:13px;font-weight:500;min-width:36px;text-align:right;color:var(--color-text-primary);">0.10</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Diffuse</label>
    <input type="range" id="dif" min="0" max="1" step="0.01" value="0.70" style="flex:1;">
    <span id="dif-v" style="font-size:13px;font-weight:500;min-width:36px;text-align:right;color:var(--color-text-primary);">0.70</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Specular</label>
    <input type="range" id="spec" min="0" max="1" step="0.01" value="0.80" style="flex:1;">
    <span id="spec-v" style="font-size:13px;font-weight:500;min-width:36px;text-align:right;color:var(--color-text-primary);">0.80</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Shininess</label>
    <input type="range" id="shin" min="1" max="128" step="1" value="32" style="flex:1;">
    <span id="shin-v" style="font-size:13px;font-weight:500;min-width:36px;text-align:right;color:var(--color-text-primary);">32</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <label style="font-size:13px;color:var(--color-text-secondary);width:80px;">Subdivisions</label>
    <input type="range" id="subdiv" min="2" max="20" step="1" value="6" style="flex:1;">
    <span id="subdiv-v" style="font-size:13px;font-weight:500;min-width:36px;text-align:right;color:var(--color-text-primary);">6</span>
  </div>
</div>

<style>
  #wrap {
    width: 100%;
    box-sizing: border-box;
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  #wrap canvas {
    /* Prevent the stretched aspect ratio by relying on aspect-ratio property */
    flex: 1 1 280px;
    max-width: 320px;
    min-width: 200px;
    aspect-ratio: 1 / 1;
    height: auto;
    background: transparent;
  }
</style>

<script>
const cG = document.getElementById('cG');
const cP = document.getElementById('cP');

const lightDir = norm3([1.5, 1.2, 2.0]);
const viewDir  =[0, 0, 1];

function norm3(v) { 
  const l = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]); 
  return l > 0 ? [v[0]/l, v[1]/l, v[2]/l] : [0,0,0]; 
}
function dot3(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function add3(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function scale3(v, s) { return [v[0]*s, v[1]*s, v[2]*s]; }

// Breaking down shading components guarantees highly accurate physical specular highlights (white reflection)
function phongComponents(N, Ka, Kd, Ks, ns) {
  const NdL = Math.max(0, dot3(N, lightDir));
  const R = norm3(add3(scale3(N, 2 * NdL), scale3(lightDir, -1)));
  const RdV = Math.max(0, dot3(R, viewDir));
  return {
    diffuse: Ka + Kd * NdL,
    specular: Ks * Math.pow(RdV, ns)
  };
}

function buildSphere(stacks, slices) {
  const verts = [], tris =[];
  for (let i = 0; i <= stacks; i++) {
    const phi = Math.PI * i / stacks;
    for (let j = 0; j <= slices; j++) {
      const theta = 2 * Math.PI * j / slices;
      verts.push([Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)]);
    }
  }
  for (let i = 0; i < stacks; i++) {
    for (let j = 0; j < slices; j++) {
      const a = i * (slices + 1) + j, b = a + 1, c = a + (slices + 1), d = c + 1;
      tris.push([a, b, d]);
      tris.push([a, d, c]);
    }
  }
  return { verts, tris };
}

// Rewritten high-performance software Z-buffer rasterizer
function drawSphere(canvas, mode, Ka, Kd, Ks, ns, stacks, slices, color, isDark) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  if (W === 0 || H === 0) return;

  const R = Math.min(W, H) * 0.42;
  const cx = W / 2, cy = H / 2;

  const { verts, tris } = buildSphere(stacks, slices);
  
  const imgData = new ImageData(W, H);
  const data = imgData.data;
  const zBuffer = new Float32Array(W * H);
  zBuffer.fill(-Infinity);

  for (const tri of tris) {
    const vA = verts[tri[0]], vB = verts[tri[1]], vC = verts[tri[2]];
    const pA = [cx + vA[0]*R, cy - vA[1]*R, vA[2]];
    const pB = [cx + vB[0]*R, cy - vB[1]*R, vB[2]];
    const pC =[cx + vC[0]*R, cy - vC[1]*R, vC[2]];

    const ex = pB[0] - pA[0], ey = pB[1] - pA[1];
    const fx = pC[0] - pA[0], fy = pC[1] - pA[1];
    const denom = ex * fy - ey * fx;
    
    // Cull backfaces and avoid dividing by zeroes/degenerate primitives
    if (denom >= -1e-5) continue;

    const minX = Math.max(0, Math.floor(Math.min(pA[0], pB[0], pC[0])));
    const maxX = Math.min(W - 1, Math.ceil(Math.max(pA[0], pB[0], pC[0])));
    const minY = Math.max(0, Math.floor(Math.min(pA[1], pB[1], pC[1])));
    const maxY = Math.min(H - 1, Math.ceil(Math.max(pA[1], pB[1], pC[1])));

    let dA, sA, dB, sB, dC, sC;
    if (mode === 'gouraud') {
      const cA = phongComponents(vA, Ka, Kd, Ks, ns);
      const cB = phongComponents(vB, Ka, Kd, Ks, ns);
      const cC = phongComponents(vC, Ka, Kd, Ks, ns);
      dA = cA.diffuse; sA = cA.specular;
      dB = cB.diffuse; sB = cB.specular;
      dC = cC.diffuse; sC = cC.specular;
    }

    const dyBC = pB[1] - pC[1];
    const dxCB = pC[0] - pB[0];
    const dyCA = pC[1] - pA[1];
    const dxAC = pA[0] - pC[0];

    for (let y = minY; y <= maxY; y++) {
      const dy = y - pC[1];
      const term1_y = dxCB * dy;
      const term2_y = dxAC * dy;
      const rowIdx = y * W;

      for (let x = minX; x <= maxX; x++) {
        const dx = x - pC[0];
        
        // Perspective-correct screen space barycentrics
        const w1 = (dyBC * dx + term1_y) / denom;
        const w2 = (dyCA * dx + term2_y) / denom;
        const w3 = 1.0 - w1 - w2;
        
        // Edge inclusion check (using tiny epsilon preventing visual gaps)
        if (w1 < -1e-5 || w2 < -1e-5 || w3 < -1e-5) continue;

        const idx = rowIdx + x;
        const z = pA[2] * w1 + pB[2] * w2 + pC[2] * w3;
        
        if (z > zBuffer[idx]) {
          zBuffer[idx] = z;

          let d, s;
          if (mode === 'gouraud') {
            d = dA * w1 + dB * w2 + dC * w3;
            s = sA * w1 + sB * w2 + sC * w3;
          } else {
            const nx = vA[0] * w1 + vB[0] * w2 + vC[0] * w3;
            const ny = vA[1] * w1 + vB[1] * w2 + vC[1] * w3;
            const nz = vA[2] * w1 + vB[2] * w2 + vC[2] * w3;
            const invLen = 1.0 / (Math.sqrt(nx*nx + ny*ny + nz*nz) || 1.0);
            const comp = phongComponents([nx*invLen, ny*invLen, nz*invLen], Ka, Kd, Ks, ns);
            d = comp.diffuse;
            s = comp.specular;
          }

          const ptr = idx * 4;
          // Apply hue map logic to composite realistic pure white reflections
          data[ptr]     = Math.min(255, Math.max(0, Math.round(color[0] * d + 255 * s)));
          data[ptr + 1] = Math.min(255, Math.max(0, Math.round(color[1] * d + 255 * s)));
          data[ptr + 2] = Math.min(255, Math.max(0, Math.round(color[2] * d + 255 * s)));
          data[ptr + 3] = 255;
        }
      }
    }
  }

  // Draw final composition
  ctx.putImageData(imgData, 0, 0);

  // Overlay wireframe mesh specifically for Gouraud
  if (mode === 'gouraud') {
    ctx.save();
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    for (const tri of tris) {
      const vA = verts[tri[0]], vB = verts[tri[1]], vC = verts[tri[2]];
      const pA = [cx + vA[0]*R, cy - vA[1]*R];
      const pB = [cx + vB[0]*R, cy - vB[1]*R];
      const pC = [cx + vC[0]*R, cy - vC[1]*R];
      if ((pB[0] - pA[0]) * (pC[1] - pA[1]) - (pB[1] - pA[1]) * (pC[0] - pA[0]) >= 0) continue;
      
      ctx.moveTo(pA[0], pA[1]);
      ctx.lineTo(pB[0], pB[1]);
      ctx.lineTo(pC[0], pC[1]);
      ctx.closePath();
    }
    ctx.stroke();
    ctx.restore();
  }

  // Render Label using CSS-accurate coordinates
  ctx.save();
  const rectW = canvas.getBoundingClientRect().width;
  const rectH = canvas.getBoundingClientRect().height;
  const renderDpr = rectW > 0 ? W / rectW : 1;
  ctx.scale(renderDpr, renderDpr);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-text-secondary').trim() || '#888';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(mode === 'gouraud' ? 'Gouraud' : 'Phong', rectW / 2, rectH - 8);
  ctx.restore();
}

function draw() {
  const Ka = +document.getElementById('amb').value;
  const Kd = +document.getElementById('dif').value;
  const Ks = +document.getElementById('spec').value;
  const ns = +document.getElementById('shin').value;
  const sub = +document.getElementById('subdiv').value;
  const stacks = sub, slices = sub * 2;
  const isDark = getComputedStyle(document.documentElement).getPropertyValue('--color-background-primary').trim().includes('30,');
  const gColor = isDark ? [80, 160, 230] :[55, 138, 221];
  const pColor = isDark ?[40, 185, 140] :[29, 158, 117];
  
  drawSphere(cG, 'gouraud', Ka, Kd, Ks, ns, stacks, slices, gColor, isDark);
  drawSphere(cP, 'phong',   Ka, Kd, Ks, ns, stacks, slices, pColor, isDark);
}

let initialized = false;
function resize() {
  const dpr = Math.max(2, window.devicePixelRatio || 1);
  let resized = !initialized;
  
  [cG, cP].forEach(c => {
    const rect = c.getBoundingClientRect();
    if (rect.width === 0) return;
    
    // Scale canvas up to native DPR ensuring MSAA-level smoothness natively
    const w = Math.floor(rect.width * dpr);
    const h = Math.floor(rect.height * dpr);
    
    if (c.width !== w || c.height !== h) {
      c.width = w;
      c.height = h;
      resized = true;
    }
  });

  if (resized) {
    draw();
    initialized = true;
  }
}

function bind(id, outId, isInt) {
  const el = document.getElementById(id), out = document.getElementById(outId);
  el.addEventListener('input', () => { 
    out.textContent = isInt ? el.value : parseFloat(el.value).toFixed(2); 
    draw(); 
  });
}

bind('amb', 'amb-v', false); 
bind('dif', 'dif-v', false); 
bind('spec', 'spec-v', false);
bind('shin', 'shin-v', true); 
bind('subdiv', 'subdiv-v', true);

window.addEventListener('resize', resize);
// Allow time for CSS layout properties
setTimeout(resize, 0); 
</script>
