</a><script>
document.addEventListener('DOMContentLoaded', function() {
    var tocEl = document.querySelector('.toc');
    var content = document.querySelector('.post-content');
    if (!tocEl || !content) return;

    
    var sidebar = document.createElement('div');
    sidebar.className = 'agn-sidetoc';

    
    var label = document.createElement('span');
    label.className = 'agn-sidetoc-label';
    label.textContent = 'Contents';
    sidebar.appendChild(label);

    var linksWrap = document.createElement('div');
    linksWrap.className = 'agn-sidetoc-links';
    sidebar.appendChild(linksWrap);

    
    var inner = tocEl.querySelector('.inner');
    if (inner) {
        var lists = inner.querySelectorAll(':scope > ul, :scope > nav');
        lists.forEach(function(el) {
            linksWrap.appendChild(el.cloneNode(true));
        });
    }

    document.body.appendChild(sidebar);

    
    sidebar.addEventListener('click', function(e) {
        var anchor = e.target.closest('a[href^="#"]');
        if (!anchor) return;

        var id = anchor.getAttribute('href').slice(1);
        if (!id) return;

        var target = document.getElementById(decodeURIComponent(id));
        if (!target) return;

        e.preventDefault();

        var headerHeight = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-height')) || 60);
        var targetTop = target.getBoundingClientRect().top + window.scrollY - (headerHeight + 40);

        window.scrollTo({
            top: targetTop,
            behavior: 'smooth'
        });

        if (history.pushState) {
            history.pushState(null, null, '#' + id);
        } else {
            location.hash = '#' + id;
        }
    });

    
    var headers = Array.prototype.slice.call(content.querySelectorAll('h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]'));
    if (!headers.length) return;

    var lastActiveId = '';
    var headerHeight = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-height')) || 60);
    var activeHeaderOffset = headerHeight + 45;

    
    var nestedUls = sidebar.querySelectorAll('ul ul');
    for (var i = 0; i < nestedUls.length; i++) {
        nestedUls[i].style.display = 'none';
    }

    function applyActiveState(currentId) {
        if (currentId === lastActiveId) return;
        lastActiveId = currentId;

        
        var highlighted = sidebar.querySelectorAll('a.active, a.semi_active');
        for (var i = 0; i < highlighted.length; i++) {
            highlighted[i].classList.remove('active', 'semi_active');
            var oldChild = highlighted[i].parentElement.querySelector(':scope > ul');
            if (oldChild) oldChild.style.display = 'none';
        }

        if (!currentId) return;

        var activeLink = sidebar.querySelector('a[href="#' + currentId + '"]');
        if (!activeLink) return;

        
        var el = activeLink.parentElement;
        var depth = 0;
        while (el && el !== sidebar) {
            if (el.tagName === 'LI') {
                var link = el.querySelector(':scope > a');
                if (link) {
                    link.classList.add(depth === 0 ? 'active' : 'semi_active');
                    var childUl = el.querySelector(':scope > ul');
                    if (childUl) childUl.style.display = 'block';
                }
                depth++;
            }
            el = el.parentElement;
        }

        
        var container = sidebar.querySelector('.agn-sidetoc-links');
        if (container) {
            var containerRect = container.getBoundingClientRect();
            var linkRect = activeLink.getBoundingClientRect();
            var relativeTop = linkRect.top - containerRect.top + container.scrollTop;
            var targetScrollTop = relativeTop - (container.clientHeight / 2) + (linkRect.height / 2);
            container.scrollTo({
                top: targetScrollTop,
                behavior: 'smooth'
            });
        }
    }

    var ticking = false;
    function onScroll() {
        if (ticking) return;
        ticking = true;

        requestAnimationFrame(function() {
            var currentId = '';
            var scrollY = window.scrollY;
            var windowHeight = window.innerHeight;
            var documentHeight = document.documentElement.scrollHeight;

            if (scrollY + windowHeight >= documentHeight - 10) {
                currentId = headers[headers.length - 1].id;
            } else {
                for (var i = headers.length - 1; i >= 0; i--) {
                    var rect = headers[i].getBoundingClientRect();
                    if (rect.top <= activeHeaderOffset) {
                        currentId = headers[i].id;
                        break;
                    }
                }
            }

            applyActiveState(currentId);
            ticking = false;
        });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    
    
    onScroll();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    
    var figures = document.querySelectorAll("figure[id]");
    var figMap = {};
    figures.forEach(function(fig, index) {
        figMap[fig.id] = index + 1;
    });

    
    var refs = document.querySelectorAll(".auto-fig-ref");
    refs.forEach(function(ref) {
        var targetId = ref.getAttribute("data-target");
        if (figMap[targetId]) {
            ref.textContent = figMap[targetId];
        } else {
            ref.textContent = "??"; 
            ref.style.color = "red";
        }
    });
});
</script>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        if (document.body.className.includes("dark")) {
            document.body.classList.remove('dark');
            localStorage.setItem("pref-theme", 'light');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
